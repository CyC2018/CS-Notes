<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1d1c" media="(prefers-color-scheme: dark)">
  <title>CS-Notes · CyC2018</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CS-Notes">
  <meta property="og:title" content="CS-Notes：技术面试必备的计算机基础知识">
  <meta property="og:description" content="涵盖算法、操作系统、计算机网络、数据库、Java 与系统设计，配有学习路线和面试题练习。">
  <meta property="og:url" content="https://cyc2018.xyz/">
  <meta property="og:image" content="https://cyc2018.xyz/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <script>
    // 正文和侧边栏的 Markdown 在 Docsify 载入前就开始下载，Docsify 请求同一地址时直接用下载好的内容
    (function () {
      var path = location.hash.replace(/^#/, '').split('?')[0] || '/';
      var file = path === '/' ? '/README.txt' : /^\/notes\/[^.]+$/.test(path) ? path + '.txt' : null;
      [file, '/_sidebar.txt'].forEach(function (href) {
        if (!href) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = href;
        document.head.appendChild(link);
      });
    })();
  </script>
  <script>
    // 在渲染前确定配色，避免深色模式下先闪一下白色
    try {
      var theme = JSON.parse(localStorage.getItem('cs-notes-theme'));
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      var reading = JSON.parse(localStorage.getItem('cs-notes-reading')) || {};
      if (/^[0-4]$/.test(reading.size)) document.documentElement.dataset.size = reading.size;
      if (/^(compact|loose)$/.test(reading.leading)) document.documentElement.dataset.leading = reading.leading;
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="/vendor/vue.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
