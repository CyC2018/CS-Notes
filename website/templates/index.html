<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CS-Notes：技术面试必备的计算机基础知识，涵盖算法、操作系统、计算机网络、数据库、Java 与系统设计。">
  <meta name="theme-color" content="#42b983">
  <title>CS-Notes · CyC2018</title>
  <link rel="icon" href="/favicon.png">
  <script>
    // 正文和侧边栏的 Markdown 在 Docsify 载入前就开始下载，Docsify 请求同一地址时直接用下载好的内容
    (function () {
      var path = location.hash.replace(/^#/, '').split('?')[0] || '/';
      var file = path === '/' ? '/README.txt' : /^\/notes\/[^.]+$/.test(path) ? path + '.txt' : null;
      [file, '/_sidebar.txt'].forEach(function (href) {
        if (!href) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = href;
        document.head.appendChild(link);
      });
    })();
  </script>
  <link rel="stylesheet" href="/vendor/vue.css">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <div id="app">正在载入 CS-Notes…</div>
  <noscript>请启用 JavaScript 阅读网站，或访问 <a href="https://github.com/CyC2018/CS-Notes">GitHub 仓库</a>。</noscript>
  <script src="/search-paths.js" defer></script>
  <script src="/site.js" defer></script>
  <script src="/search.js" defer></script>
  <script src="/vendor/docsify.min.js" defer></script>
  <script src="/vendor/docsify-copy-code.min.js" defer></script>
  <script src="/vendor/zoom-image.min.js" defer></script>
  <script src="/vendor/prism-bash.min.js" defer></script>
  <script src="/vendor/prism-c.min.js" defer></script>
  <script src="/vendor/prism-java.min.js" defer></script>
  <script src="/vendor/prism-sql.min.js" defer></script>
  <script src="/vendor/prism-python.min.js" defer></script>
  <script src="/vendor/prism-json.min.js" defer></script>
</body>
</html>
