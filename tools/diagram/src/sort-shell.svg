<svg xmlns="http://www.w3.org/2000/svg" width="560" height="318" viewBox="0 0 560 318">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="280" y="28" class="title">希尔排序：先对间隔 h = 4 的 4 组排序，再令 h = 1</text>
  <text x="135" y="58" class="c sub mono">0</text>
  <text x="169" y="58" class="c sub mono">1</text>
  <text x="203" y="58" class="c sub mono">2</text>
  <text x="237" y="58" class="c sub mono">3</text>
  <text x="271" y="58" class="c sub mono">4</text>
  <text x="305" y="58" class="c sub mono">5</text>
  <text x="339" y="58" class="c sub mono">6</text>
  <text x="373" y="58" class="c sub mono">7</text>
  <rect x="118" y="66" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="135" y="86" class="c mono" style="font-size:13px;fill:#333">5</text>
  <rect x="152" y="66" width="34" height="30" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="169" y="86" class="c mono" style="font-size:13px;fill:#333">2</text>
  <rect x="186" y="66" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="203" y="86" class="c mono" style="font-size:13px;fill:#333">7</text>
  <rect x="220" y="66" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="237" y="86" class="c mono" style="font-size:13px;fill:#333">4</text>
  <rect x="254" y="66" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="271" y="86" class="c mono" style="font-size:13px;fill:#333">1</text>
  <rect x="288" y="66" width="34" height="30" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="305" y="86" class="c mono" style="font-size:13px;fill:#333">8</text>
  <rect x="322" y="66" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="339" y="86" class="c mono" style="font-size:13px;fill:#333">3</text>
  <rect x="356" y="66" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="373" y="86" class="c mono" style="font-size:13px;fill:#333">6</text>
  <text x="106" y="86" class="e">初始</text>
  <text x="404" y="79" class="sub">逆序数 13</text>
  <text x="404" y="95" class="sub">同色的元素为一组</text>
  <path d="M135,97 V102 H271 V97" fill="none" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M169,97 V107 H305 V97" fill="none" stroke="#7DBCB7" stroke-width="1.2"/>
  <path d="M203,97 V112 H339 V97" fill="none" stroke="#B8B0DE" stroke-width="1.2"/>
  <path d="M237,97 V117 H373 V97" fill="none" stroke="#BBBBBB" stroke-width="1.2"/>
  <rect x="118" y="156" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="135" y="176" class="c mono" style="font-size:13px;fill:#333">1</text>
  <rect x="152" y="156" width="34" height="30" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="169" y="176" class="c mono" style="font-size:13px;fill:#333">2</text>
  <rect x="186" y="156" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="203" y="176" class="c mono" style="font-size:13px;fill:#333">3</text>
  <rect x="220" y="156" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="237" y="176" class="c mono" style="font-size:13px;fill:#333">4</text>
  <rect x="254" y="156" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="271" y="176" class="c mono" style="font-size:13px;fill:#333">5</text>
  <rect x="288" y="156" width="34" height="30" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="305" y="176" class="c mono" style="font-size:13px;fill:#333">8</text>
  <rect x="322" y="156" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="339" y="176" class="c mono" style="font-size:13px;fill:#333">7</text>
  <rect x="356" y="156" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="373" y="176" class="c mono" style="font-size:13px;fill:#333">6</text>
  <text x="106" y="176" class="e">h = 4 之后</text>
  <text x="404" y="169" class="sub">交换 2 次，逆序数 3</text>
  <text x="404" y="185" class="sub">每组内部有序</text>
  <line x1="254" y1="122" x2="254" y2="150" class="arrow "/>
  <rect x="118" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="135" y="256" class="c mono" style="font-size:13px;fill:#333">1</text>
  <rect x="152" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="169" y="256" class="c mono" style="font-size:13px;fill:#333">2</text>
  <rect x="186" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="203" y="256" class="c mono" style="font-size:13px;fill:#333">3</text>
  <rect x="220" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="237" y="256" class="c mono" style="font-size:13px;fill:#333">4</text>
  <rect x="254" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="271" y="256" class="c mono" style="font-size:13px;fill:#333">5</text>
  <rect x="288" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="305" y="256" class="c mono" style="font-size:13px;fill:#333">6</text>
  <rect x="322" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="339" y="256" class="c mono" style="font-size:13px;fill:#333">7</text>
  <rect x="356" y="236" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="373" y="256" class="c mono" style="font-size:13px;fill:#333">8</text>
  <text x="106" y="256" class="e">h = 1 之后</text>
  <text x="404" y="249" class="sub">交换 3 次，整体有序</text>
  <text x="404" y="265" class="sub">就是普通的插入排序</text>
  <line x1="254" y1="192" x2="254" y2="230" class="arrow "/>
  <text x="280" y="300" class="sub c">共交换 5 次；直接插入排序需要交换 13 次</text>
</svg>
