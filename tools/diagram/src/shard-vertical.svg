  <rect x="190" y="168" width="80" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="230" y="185" class="c sub mono" style="fill:#444">price</text>
  <rect x="190" y="194" width="80" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
