<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">FAT：没有 inode，文件分配表记录每个簇的下一个簇号</text>
  <text x="30" y="58" class="sub">1.44 MB 软盘格式（FAT12，每簇 512 B）。写入 f1～f6 各 1 个簇，删除 f2、f4，再写入 2 KB 的 big.txt：</text>
  <rect x="30" y="96" width="140" height="50" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="100" y="116" class="c b">目录项 big.txt</text>
  <text x="100" y="134" class="c sub">起始簇号 3</text>
  <text x="200" y="90" class="sub b">FAT 表</text>
  <text x="200" y="200" class="sub b">数据区</text>
  <rect x="200" y="100" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="224" y="120" class="c sub" style="fill:#3F3F3F">结束</text>
  <text x="224" y="146" class="c sub mono">2</text>
  <rect x="200" y="208" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="224" y="228" class="c sub mono" style="fill:#3F3F3F">f1</text>
  <rect x="254" y="100" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="278" y="120" class="c sub mono" style="fill:#3F3F3F">5</text>
  <text x="278" y="146" class="c sub mono">3</text>
  <rect x="254" y="208" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="278" y="228" class="c sub mono" style="fill:#3F3F3F">big</text>
  <rect x="308" y="100" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="332" y="120" class="c sub" style="fill:#3F3F3F">结束</text>
  <text x="332" y="146" class="c sub mono">4</text>
  <rect x="308" y="208" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="332" y="228" class="c sub mono" style="fill:#3F3F3F">f3</text>
  <rect x="362" y="100" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="386" y="120" class="c sub mono" style="fill:#3F3F3F">8</text>
  <text x="386" y="146" class="c sub mono">5</text>
  <rect x="362" y="208" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="386" y="228" class="c sub mono" style="fill:#3F3F3F">big</text>
  <rect x="416" y="100" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="440" y="120" class="c sub" style="fill:#3F3F3F">结束</text>
  <text x="440" y="146" class="c sub mono">6</text>
  <rect x="416" y="208" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="440" y="228" class="c sub mono" style="fill:#3F3F3F">f5</text>
  <rect x="470" y="100" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="494" y="120" class="c sub" style="fill:#3F3F3F">结束</text>
  <text x="494" y="146" class="c sub mono">7</text>
  <rect x="470" y="208" width="48" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="494" y="228" class="c sub mono" style="fill:#3F3F3F">f6</text>
  <rect x="524" y="100" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="548" y="120" class="c sub mono" style="fill:#3F3F3F">9</text>
  <text x="548" y="146" class="c sub mono">8</text>
  <rect x="524" y="208" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="548" y="228" class="c sub mono" style="fill:#3F3F3F">big</text>
  <rect x="578" y="100" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="602" y="120" class="c sub" style="fill:#3F3F3F">结束</text>
  <text x="602" y="146" class="c sub mono">9</text>
  <rect x="578" y="208" width="48" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="602" y="228" class="c sub mono" style="fill:#3F3F3F">big</text>
  <rect x="632" y="100" width="48" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="656" y="120" class="c sub" style="fill:#3F3F3F">空闲</text>
  <text x="656" y="146" class="c sub mono">10</text>
  <rect x="632" y="208" width="48" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="656" y="228" class="c sub mono" style="fill:#3F3F3F"></text>
  <rect x="686" y="100" width="48" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="710" y="120" class="c sub" style="fill:#3F3F3F">空闲</text>
  <text x="710" y="146" class="c sub mono">11</text>
  <rect x="686" y="208" width="48" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="710" y="228" class="c sub mono" style="fill:#3F3F3F"></text>
  <path d="M170,121 H194 V160 H268 V134" class="arrow"/>
  <path d="M278,100 C278,76 386,76 386,98" class="arrow"/>
  <path d="M386,100 C386,76 548,76 548,98" class="arrow"/>
  <path d="M548,100 C548,76 602,76 602,98" class="arrow"/>
  <line x1="278" y1="152" x2="278" y2="204" class="line dash"/>
  <line x1="386" y1="152" x2="386" y2="204" class="line dash"/>
  <line x1="548" y1="152" x2="548" y2="204" class="line dash"/>
  <line x1="602" y1="152" x2="602" y2="204" class="line dash"/>
  <text x="30" y="268" class="sub">mshowfat 显示 big.txt 占用的簇是 &lt;3&gt; &lt;5&gt; &lt;8-9&gt;。读取时从目录项中的起始簇号 3 开始，在 FAT 表中查到</text>
  <text x="30" y="286" class="sub">下一个簇是 5，再查到 8、9，直到“结束”标记。下一个簇号集中存放在 FAT 表中，而不是存放在数据块里。</text>
</svg>
