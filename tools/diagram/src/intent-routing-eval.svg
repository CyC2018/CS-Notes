<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="350" y="28" class="title">三种路由方法在 60 条客服消息上的准确率</text>
  <line x1="90" y1="250" x2="660" y2="250" stroke="#E6E6E6"/>
  <text x="80" y="254" class="sub e">0%</text>
  <line x1="90" y1="210" x2="660" y2="210" stroke="#E6E6E6"/>
  <text x="80" y="214" class="sub e">25%</text>
  <line x1="90" y1="170" x2="660" y2="170" stroke="#E6E6E6"/>
  <text x="80" y="174" class="sub e">50%</text>
  <line x1="90" y1="130" x2="660" y2="130" stroke="#E6E6E6"/>
  <text x="80" y="134" class="sub e">75%</text>
  <line x1="90" y1="90" x2="660" y2="90" stroke="#E6E6E6"/>
  <text x="80" y="94" class="sub e">100%</text>
  <rect x="120" y="132.72" width="38" height="117.28" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="139" y="126.72" class="c sub">73.3%</text>
  <rect x="162" y="186" width="38" height="64" fill="#9F94D5" stroke="#8A7FC4" stroke-width="1"/>
  <text x="181" y="180" class="c sub">40%</text>
  <text x="160" y="270" class="c b">关键词规则</text>
  <rect x="260" y="124.72" width="38" height="125.28" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="279" y="118.72" class="c sub">78.3%</text>
  <rect x="302" y="154" width="38" height="96" fill="#9F94D5" stroke="#8A7FC4" stroke-width="1"/>
  <text x="321" y="148" class="c sub">60%</text>
  <text x="300" y="270" class="c b">分类模型</text>
  <rect x="400" y="106" width="38" height="144" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="419" y="100" class="c sub">90%</text>
  <rect x="442" y="122" width="38" height="128" fill="#9F94D5" stroke="#8A7FC4" stroke-width="1"/>
  <text x="461" y="116" class="c sub">80%</text>
  <text x="440" y="270" class="c b">Qwen2.5-3B</text>
  <rect x="540" y="98" width="38" height="152" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="559" y="92" class="c sub">95%</text>
  <rect x="582" y="90" width="38" height="160" fill="#9F94D5" stroke="#8A7FC4" stroke-width="1"/>
  <text x="601" y="84" class="c sub">100%</text>
  <text x="580" y="270" class="c b">Qwen2.5-7B</text>
  <rect x="200" y="48" width="12" height="12" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="218" y="58" class="sub">全部 60 条</text>
  <rect x="300" y="48" width="12" height="12" rx="2" fill="#9F94D5" stroke="#8A7FC4"/>
  <text x="318" y="58" class="sub">其中 10 条含有其它类别的关键词</text>
  <text x="350" y="292" class="c sub">5 个类别各 12 条；分类模型是 bge-small-zh-v1.5 加每类 6 条示例（取最近的类中心）；大模型只输出类别名</text>
  <text x="350" y="308" class="c sub">示例：“钱退到哪了”含“到哪”，“我人不在家，能改到驿站自提吗”含“驿站”</text>
</svg>
