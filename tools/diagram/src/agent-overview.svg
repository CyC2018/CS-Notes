  <circle cx="194" cy="270.5" r="2" fill="#7FB2D6"/>
  <line x1="201" y1="270.5" x2="226" y2="270.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="210" y="296" class="c b">物流服务</text>
  <text x="210" y="311" class="c sub mono">track</text>
  <path d="M290,234 v34 a20,6 0 0 0 40,0 v-34" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <ellipse cx="310" cy="234" rx="20" ry="6" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <path d="M290,251 a20,6 0 0 0 40,0" fill="none" stroke="#BFBEBA" stroke-width="1"/>
  <text x="310" y="296" class="c b">记忆存储</text>
  <text x="310" y="311" class="c sub">用户偏好</text>
  <line x1="215" y1="196" x2="110" y2="226" class="arrow dash"/>
  <line x1="255" y1="196" x2="210" y2="226" class="arrow dash"/>
  <line x1="295" y1="196" x2="310" y2="226" class="arrow dash"/>
  <text x="380" y="238" class="sub">① 应用把问题和工具列表发给模型</text>
  <text x="380" y="256" class="sub">② 模型返回：调用 query_order(1024)</text>
  <text x="380" y="274" class="sub">③ 应用执行，把“快递单号 SF123”发回</text>
  <text x="380" y="292" class="sub">④ 模型返回：调用 track("SF123")，⑤ 应用执行</text>
  <text x="380" y="310" class="sub">⑥ 模型返回最终回答，循环结束</text>
  <text x="20" y="340" class="note">模型始终只生成文本，查询数据库、调用接口都由应用代码完成</text>
</svg>
