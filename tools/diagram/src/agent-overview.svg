  <circle cx="94" cy="238.5" r="2" fill="#7FB2D6"/>
  <line x1="101" y1="238.5" x2="126" y2="238.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="87" y="248" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="94" cy="254.5" r="2" fill="#7FB2D6"/>
  <line x1="101" y1="254.5" x2="126" y2="254.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="87" y="264" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="94" cy="270.5" r="2" fill="#7FB2D6"/>
  <line x1="101" y1="270.5" x2="126" y2="270.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="110" y="296" class="c b">订单服务</text>
  <text x="110" y="311" class="c sub mono">query_order</text>
  <rect x="187" y="232" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="194" cy="238.5" r="2" fill="#7FB2D6"/>
  <line x1="201" y1="238.5" x2="226" y2="238.5" stroke="#7FB2D6" stroke-width="1"/>
