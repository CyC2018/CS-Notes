  <text x="116" y="94" class="c sub">提问</text>
  <line x1="156" y1="126" x2="76" y2="126" class="arrow "/>
  <text x="116" y="142" class="c sub">回答</text>
  <line x1="354" y1="96" x2="552" y2="96" class="arrow "/>
  <text x="453" y="88" class="c sub">消息历史 + 工具列表</text>
