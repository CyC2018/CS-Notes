<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Parallel Scavenge 与 Parallel Old：两代都多线程</text>
  <text x="30" y="102" class="sub b" style="fill:#444">用户线程</text>
  <rect x="111" y="65" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="111" y="87" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="111" y="109" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="111" y="131" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="251" y="65" width="68" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="251" y="87" width="68" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="251" y="109" width="68" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="251" y="131" width="68" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="285" y="168" class="c sub" style="fill:#444">新生代复制</text>
  <line x1="250" y1="56" x2="250" y2="154" stroke="#C0605A" stroke-width="1.4"/>
  <line x1="320" y1="56" x2="320" y2="154" stroke="#C0605A" stroke-width="1.4"/>
  <text x="285" y="52" class="c sub note">停顿</text>
  <rect x="321" y="65" width="178" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="321" y="87" width="178" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="321" y="109" width="178" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="321" y="131" width="178" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="501" y="65" width="88" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="501" y="87" width="88" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="501" y="109" width="88" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <rect x="501" y="131" width="88" height="16" rx="2" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="545" y="168" class="c sub" style="fill:#444">老年代标记 - 整理</text>
  <line x1="500" y1="56" x2="500" y2="154" stroke="#C0605A" stroke-width="1.4"/>
  <line x1="590" y1="56" x2="590" y2="154" stroke="#C0605A" stroke-width="1.4"/>
  <text x="545" y="52" class="c sub note">停顿</text>
  <rect x="591" y="65" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="591" y="87" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="591" y="109" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="591" y="131" width="138" height="16" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="30" y="198" class="sub">浅蓝是用户线程，浅青是 GC 线程，红线之间所有用户线程暂停（Stop The World）。</text>
  <text x="30" y="216" class="sub">目标是吞吐量：用户线程运行时间占总时间的比例越高越好。</text>
</svg>
