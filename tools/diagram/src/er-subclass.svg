<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">子类：用三角形 isa 连接父类和子类</text>
  <rect x="320" y="50" width="120" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="380" y="74.5" class="c sub b">Student</text>
  <ellipse cx="230" cy="50" rx="48" ry="17" fill="#FFFFFF" stroke="#BFBEBA"/>
  <text x="230" y="54" class="c sub" text-decoration="underline">sno</text>
  <ellipse cx="530" cy="50" rx="48" ry="17" fill="#FFFFFF" stroke="#BFBEBA"/>
  <text x="530" y="54" class="c sub">name</text>
  <line x1="278" y1="52" x2="320" y2="66" class="line"/>
  <line x1="482" y1="52" x2="440" y2="66" class="line"/>
  <path d="M380,110 L414,166 L346,166 z" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="380" y="156" class="c sub b">isa</text>
  <line x1="380" y1="90" x2="380" y2="110" class="line"/>
  <rect x="170" y="210" width="120" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="230" y="234.5" class="c sub b">Undergraduate</text>
  <rect x="470" y="210" width="120" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="530" y="234.5" class="c sub b">Postgraduate</text>
  <line x1="346" y1="166" x2="250" y2="210" class="line"/>
  <line x1="414" y1="166" x2="510" y2="210" class="line"/>
  <path d="M640.0,230 L690,206.0 L740.0,230 L690,254.0 z" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="690" y="234" class="c sub b">Advises</text>
  <line x1="590" y1="230" x2="640" y2="230" class="line"/>
  <text x="30" y="300" class="sub">学号、姓名等共有的属性连在父类 Student 上；只有研究生才有导师，所以联系 Advises 连在子类 Postgraduate 上。</text>
</svg>
