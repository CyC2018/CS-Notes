  <text x="40" y="290" class="sub">INT4 只有 -7～7 共 15 个整数，缩放系数 s = 范围内的最大绝对值 / 7，量化值 = round(w / s)。灰色格子被量化成 0，信息丢失。</text>
  <text x="40" y="308" class="sub">离群值 -244.1 让它所在范围内的小权重都变成 0；按组之后，它只影响自己那一组，后 8 个权重得以保留。实际常用 128 个一组。</text>
