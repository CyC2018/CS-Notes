  <rect x="35" y="66" width="26" height="15.12" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M44,85.12 v5 M52,85.12 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="36" y="90.12" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <text x="76" y="74" class="sub mono">192.0.2.30</text>
  <text x="76" y="90" class="sub mono">crc32(IP) % 2 = 0</text>
  <line x1="220" y1="78" x2="412" y2="96" class="arrow "/>
