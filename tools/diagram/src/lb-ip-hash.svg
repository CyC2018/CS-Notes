  <text x="76" y="128" class="sub mono">198.51.100.8</text>
  <text x="76" y="144" class="sub mono">crc32(IP) % 2 = 0</text>
  <line x1="220" y1="132" x2="412" y2="96" class="arrow "/>
  <rect x="31" y="170" width="34" height="23.12" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="35" y="174" width="26" height="15.12" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M44,193.12 v5 M52,193.12 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="36" y="198.12" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <text x="76" y="182" class="sub mono">203.0.113.11</text>
  <text x="76" y="198" class="sub mono">crc32(IP) % 2 = 1</text>
  <line x1="220" y1="186" x2="412" y2="216" class="arrow "/>
  <rect x="31" y="224" width="34" height="23.12" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="35" y="228" width="26" height="15.12" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M44,247.12 v5 M52,247.12 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="36" y="252.12" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <text x="76" y="236" class="sub mono">198.51.100.7</text>
  <text x="76" y="252" class="sub mono">crc32(IP) % 2 = 1</text>
  <line x1="220" y1="240" x2="412" y2="216" class="arrow "/>
  <rect x="417" y="72" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="424" cy="78.5" r="2" fill="#7FB2D6"/>
  <line x1="431" y1="78.5" x2="456" y2="78.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="417" y="88" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="424" cy="94.5" r="2" fill="#7FB2D6"/>
  <line x1="431" y1="94.5" x2="456" y2="94.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="417" y="104" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="424" cy="110.5" r="2" fill="#7FB2D6"/>
  <line x1="431" y1="110.5" x2="456" y2="110.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="440" y="132" class="c sub b">Server 1</text>
  <text x="478" y="100" class="sub">余数为 0 的客户端</text>
  <rect x="417" y="192" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="424" cy="198.5" r="2" fill="#7FB2D6"/>
