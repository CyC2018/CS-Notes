  <circle cx="424" cy="214.5" r="2" fill="#7FB2D6"/>
  <line x1="431" y1="214.5" x2="456" y2="214.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="417" y="224" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="424" cy="230.5" r="2" fill="#7FB2D6"/>
  <line x1="431" y1="230.5" x2="456" y2="230.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="440" y="252" class="c sub b">Server 2</text>
  <text x="478" y="220" class="sub">余数为 1 的客户端</text>
  <text x="30" y="288" class="sub">示意：用 crc32(IP) % 服务器数 选择服务器。服务器数量变化时，大部分客户端的结果都会改变。</text>
</svg>
