<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Next-Key Locks：锁住记录和它前面的间隙</text>
  <text x="30" y="70" class="sub mono b" style="fill:#3F3F3F">① SELECT * FROM t WHERE c = 11 FOR UPDATE</text>
  <rect x="194" y="94" width="102" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="245" y="105" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(10, 11]</text>
  <rect x="304" y="94" width="112" height="14" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="360" y="105" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(11, 13)</text>
  <line x1="60" y1="116" x2="720" y2="116" stroke="#999"/>
  <text x="60" y="134" class="c sub mono">-∞</text>
  <circle cx="190" cy="116" r="4" fill="#555"/>
  <text x="190" y="134" class="c sub mono">c=10</text>
  <circle cx="300" cy="116" r="4" fill="#555"/>
  <text x="300" y="134" class="c sub mono">c=11</text>
  <circle cx="420" cy="116" r="4" fill="#555"/>
  <text x="420" y="134" class="c sub mono">c=13</text>
  <circle cx="580" cy="116" r="4" fill="#555"/>
  <text x="580" y="134" class="c sub mono">c=20</text>
  <text x="720" y="134" class="c sub mono">+∞</text>
  <text x="30" y="156" class="sub">data_locks：c = 11 的记录上是 X（Next-Key Lock），c = 13 上是 X,GAP；插入 c = 12 被阻塞，c = 9、14、21 可以插入</text>
  <text x="30" y="200" class="sub mono b" style="fill:#3F3F3F">② SELECT * FROM t WHERE c BETWEEN 10 AND 20 FOR UPDATE</text>
  <rect x="64" y="224" width="122" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="125" y="235" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(-∞, 10]</text>
  <rect x="194" y="224" width="102" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="245" y="235" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(10, 11]</text>
  <rect x="304" y="224" width="112" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="360" y="235" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(11, 13]</text>
  <rect x="424" y="224" width="152" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="500" y="235" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(13, 20]</text>
  <rect x="584" y="224" width="132" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="650" y="235" class="c sub mono" style="font-size:10px;fill:#3F3F3F">(20, +∞]</text>
  <line x1="60" y1="246" x2="720" y2="246" stroke="#999"/>
  <text x="60" y="264" class="c sub mono">-∞</text>
  <circle cx="190" cy="246" r="4" fill="#555"/>
  <text x="190" y="264" class="c sub mono">c=10</text>
  <circle cx="300" cy="246" r="4" fill="#555"/>
  <text x="300" y="264" class="c sub mono">c=11</text>
  <circle cx="420" cy="246" r="4" fill="#555"/>
  <text x="420" y="264" class="c sub mono">c=13</text>
  <circle cx="580" cy="246" r="4" fill="#555"/>
  <text x="580" y="264" class="c sub mono">c=20</text>
  <text x="720" y="264" class="c sub mono">+∞</text>
  <text x="30" y="286" class="sub">data_locks：c = 10、11、13、20 和 supremum 上都是 X；插入 c = 9、12、14、21 都被阻塞</text>
  <rect x="30" y="302" width="18" height="12" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="54" y="312" class="sub">Next-Key Lock（前开后闭）</text>
  <rect x="230" y="302" width="18" height="12" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="254" y="312" class="sub">Gap Lock（开区间）</text>
  <text x="420" y="312" class="sub">MySQL 8.0，c 上有普通索引，可重复读</text>
</svg>
