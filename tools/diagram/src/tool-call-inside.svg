<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="350" y="28" class="title">工具调用的内部过程</text>
  <rect x="22" y="52" width="300" height="130" rx="6" class="shadow"/>
  <rect x="20" y="50" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="32" y="72" class="b">① 应用发出的请求</text>
  <text x="34" y="94" class="sub mono">messages: [</text>
  <text x="34" y="112" class="sub mono">  {"role": "user",</text>
  <text x="34" y="130" class="sub mono">   "content": "杭州今天天气怎么样？"}]</text>
  <rect x="28" y="135" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="34" y="148" class="sub mono">tools: [get_weather(city)]</text>
  <rect x="382" y="52" width="300" height="130" rx="6" class="shadow"/>
  <rect x="380" y="50" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="392" y="72" class="b">② 推理服务按模板拼成提示词</text>
  <text x="394" y="94" class="sub mono">&lt;|im_start|&gt;system</text>
  <rect x="388" y="99" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="112" class="sub mono">&lt;tools&gt;{get_weather 的定义}&lt;/tools&gt;</text>
  <rect x="388" y="117" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="130" class="sub mono">需要调用时输出 &lt;tool_call&gt;…&lt;/tool_call&gt;</text>
  <text x="394" y="148" class="sub mono">&lt;|im_start|&gt;user 杭州今天天气怎么样？</text>
  <rect x="382" y="222" width="300" height="110" rx="6" class="shadow"/>
  <rect x="380" y="220" width="300" height="110" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="392" y="242" class="b">③ 模型生成的文本</text>
  <rect x="388" y="251" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="264" class="sub mono">&lt;tool_call&gt;</text>
  <rect x="388" y="269" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="282" class="sub mono">{"name": "get_weather",</text>
  <rect x="388" y="287" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="300" class="sub mono"> "arguments": {"city": "杭州"}}</text>
  <rect x="388" y="305" width="284" height="18" fill="#DDD7F6" opacity="0.7"/>
  <text x="394" y="318" class="sub mono">&lt;/tool_call&gt;</text>
  <rect x="22" y="222" width="300" height="110" rx="6" class="shadow"/>
  <rect x="20" y="220" width="300" height="110" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="32" y="242" class="b">④ 推理服务解析后返回给应用</text>
  <text x="34" y="264" class="sub mono">tool_calls: [{</text>
  <text x="34" y="282" class="sub mono">  "name": "get_weather",</text>
  <text x="34" y="300" class="sub mono">  "arguments": "{\"city\": \"杭州\"}"</text>
  <text x="34" y="318" class="sub mono">}]</text>
  <line x1="324" y1="115" x2="376" y2="115" class="arrow "/>
  <line x1="530" y1="184" x2="530" y2="216" class="arrow "/>
  <line x1="376" y1="275" x2="324" y2="275" class="arrow "/>
  <text x="20" y="360" class="sub">以 Qwen2.5 的模板为例。工具调用本质上仍是生成文本，参数可能写错，应用必须校验。</text>
</svg>
