  <text x="260" y="96" class="c sub">光纤或 DSL</text>
  <text x="30" y="210" class="sub">ISP 为家用路由器分配一个公网 IP 地址（例如 203.0.113.25），用户的流量经接入 ISP 进入互联网，</text>
  <text x="30" y="230" class="sub">再由各级 ISP 转交，最终到达网站的服务器。</text>
