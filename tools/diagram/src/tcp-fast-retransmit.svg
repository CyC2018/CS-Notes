<svg xmlns="http://www.w3.org/2000/svg" width="620" height="530" viewBox="0 0 620 530">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="310" y="28" class="title">快重传：M3 丢失</text>
  <rect x="130" y="46" width="120" height="34" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="190" y="67.5" class="b c">发送方</text>
  <line x1="190" y1="82" x2="190" y2="470" stroke="#BBB" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="390" y="46" width="120" height="34" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="450" y="67.5" class="b c">接收方</text>
  <line x1="450" y1="82" x2="450" y2="470" stroke="#BBB" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="178" y="100" class="sub e">发送 M1</text>
  <line x1="190" y1="96" x2="450" y2="126" class="arrow "/>
  <line x1="450" y1="126" x2="190" y2="156" class="arrow dash"/>
  <text x="462" y="130" class="sub" style="fill:#555">确认 M1</text>
  <text x="178" y="140" class="sub e">发送 M2</text>
  <line x1="190" y1="136" x2="450" y2="166" class="arrow "/>
  <line x1="450" y1="166" x2="190" y2="196" class="arrow dash"/>
  <text x="462" y="170" class="sub" style="fill:#555">确认 M2</text>
  <text x="178" y="180" class="sub e">发送 M3</text>
  <line x1="190" y1="176" x2="360" y2="195.615" class="arrow "/>
  <circle cx="372" cy="197" r="8" fill="#F3C6C2" stroke="#D99A94" stroke-width="1.2"/>
  <path d="M368.4,193.4 L375.6,200.6 M375.6,193.4 L368.4,200.6" stroke="#C0605A" stroke-width="2" stroke-linecap="round"/>
  <text x="178" y="220" class="sub e">发送 M4</text>
  <line x1="190" y1="216" x2="450" y2="246" class="arrow "/>
  <line x1="450" y1="246" x2="190" y2="276" class="arrow dash"/>
  <text x="462" y="250" class="sub" style="fill:#C0605A">重复确认 M2</text>
  <text x="178" y="260" class="sub e">发送 M5</text>
  <line x1="190" y1="256" x2="450" y2="286" class="arrow "/>
  <line x1="450" y1="286" x2="190" y2="316" class="arrow dash"/>
  <text x="462" y="290" class="sub" style="fill:#C0605A">重复确认 M2</text>
  <text x="178" y="300" class="sub e">发送 M6</text>
  <line x1="190" y1="296" x2="450" y2="326" class="arrow "/>
  <line x1="450" y1="326" x2="190" y2="356" class="arrow dash"/>
  <text x="462" y="330" class="sub" style="fill:#C0605A">重复确认 M2</text>
  <text x="386" y="201" class="sub note">丢失</text>
  <rect x="20" y="342" width="150" height="50" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="95" y="359" class="c sub" style="fill:#555">收到 3 个重复确认，</text>
  <text x="95" y="376" class="c sub" style="fill:#555">不等超时，立即重传 M3</text>
  <line x1="190" y1="378" x2="450" y2="408" class="arrow green"/>
  <text x="220" y="372" class="sub ok">重传 M3</text>
  <line x1="450" y1="408" x2="190" y2="438" class="arrow dash green"/>
  <text x="462" y="412" class="sub ok">确认 M6</text>
  <text x="462" y="428" class="sub">M4～M6 已缓存</text>
  <text x="30" y="500" class="sub">接收方每收到一个失序的报文段，就重复确认最后一个按序到达的报文段（这里是 M2）。</text>
  <text x="30" y="518" class="sub">重复确认说明后面的报文段还能到达，网络没有严重拥塞，所以只重传丢失的 M3。</text>
</svg>
