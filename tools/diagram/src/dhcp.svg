<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="390" y="28" class="title">DHCP：新接入的主机获取 IP 地址</text>
  <rect x="150" y="44" width="180" height="32" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="240" y="64.5" class="c sub b">客户端（还没有 IP）</text>
  <line x1="240" y1="78" x2="240" y2="300" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="470" y="44" width="180" height="32" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="64.5" class="c sub b">DHCP 服务器 192.168.1.1</text>
  <line x1="560" y1="78" x2="560" y2="300" stroke="#BBB" stroke-dasharray="4 4"/>
  <line x1="240" y1="100" x2="560" y2="114" class="arrow "/>
  <text x="400" y="96" class="c sub" style="fill:#444">① Discover  0.0.0.0:68 → 255.255.255.255:67</text>
  <text x="576" y="116" class="sub">广播：有没有 DHCP 服务器？</text>
  <line x1="560" y1="150" x2="240" y2="164" class="arrow dash"/>
  <text x="400" y="146" class="c sub" style="fill:#444">② Offer  可以用 192.168.1.100，租期 1 天</text>
  <text x="228" y="166" class="sub e">附带子网掩码、网关、DNS 服务器</text>
  <line x1="240" y1="200" x2="560" y2="214" class="arrow "/>
  <text x="400" y="196" class="c sub" style="fill:#444">③ Request  我要 192.168.1.1 提供的这个地址</text>
  <text x="576" y="216" class="sub">仍是广播，其它服务器收回提议</text>
  <line x1="560" y1="250" x2="240" y2="264" class="arrow dash"/>
  <text x="400" y="246" class="c sub" style="fill:#444">④ Ack  确认，从现在起租期 1 天</text>
  <text x="228" y="266" class="sub e">客户端开始使用这个地址</text>
  <text x="30" y="316" class="sub">前两步用广播是因为客户端还没有地址，也不知道服务器在哪；租期过半时客户端会向同一台服务器申请续租。</text>
</svg>
