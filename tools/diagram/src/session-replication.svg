  <text x="585" y="210" class="c sub mono" style="fill:#444">session: bob</text>
  <line x1="298" y1="158" x2="444" y2="192" class="arrow "/>
  <path d="M660,110 C700,130 700,160 660,176" class="arrow dash"/>
  <path d="M640,176 C620,160 620,130 640,112" class="arrow dash"/>
  <text x="712" y="146" class="c sub">同步</text>
  <text x="30" y="266" class="sub">任何一台服务器都能处理任何用户的请求，但每次修改会话都要同步给所有服务器，服务器越多，内存和网络开销越大。</text>
</svg>
