<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">LinkedList：双向链表，first 和 last 指向两端</text>
  <rect x="120" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="145" y="121" class="c sub mono" style="fill:#444">prev</text>
  <rect x="170" y="100" width="50" height="34" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="195" y="121" class="c sub mono" style="fill:#444">"a"</text>
  <rect x="220" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="245" y="121" class="c sub mono" style="fill:#444">next</text>
  <line x1="270" y1="110" x2="338" y2="110" class="arrow "/>
  <line x1="340" y1="124" x2="272" y2="124" class="arrow "/>
  <rect x="340" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="365" y="121" class="c sub mono" style="fill:#444">prev</text>
  <rect x="390" y="100" width="50" height="34" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="415" y="121" class="c sub mono" style="fill:#444">"b"</text>
  <rect x="440" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="465" y="121" class="c sub mono" style="fill:#444">next</text>
  <line x1="490" y1="110" x2="558" y2="110" class="arrow "/>
  <line x1="560" y1="124" x2="492" y2="124" class="arrow "/>
  <rect x="560" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="585" y="121" class="c sub mono" style="fill:#444">prev</text>
  <rect x="610" y="100" width="50" height="34" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="635" y="121" class="c sub mono" style="fill:#444">"c"</text>
  <rect x="660" y="100" width="50" height="34" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="685" y="121" class="c sub mono" style="fill:#444">next</text>
  <text x="120" y="160" class="sub mono">null</text>
  <text x="706" y="160" class="e sub mono">null</text>
  <rect x="145" y="52" width="70" height="26" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="180" y="69.5" class="c sub mono b">first</text>
  <line x1="180" y1="78" x2="180" y2="98" class="arrow "/>
  <rect x="605" y="52" width="70" height="26" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="640" y="69.5" class="c sub mono b">last</text>
  <line x1="640" y1="78" x2="640" y2="98" class="arrow "/>
  <text x="30" y="200" class="sub">每个 Node 保存 prev、item、next 三个字段。按下标访问要从一端逐个移动，在已知位置插入、删除只需改几个指针。</text>
</svg>
