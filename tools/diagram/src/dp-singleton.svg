<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">单例的类图</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="330" y="66" width="224" height="90" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="442" y="86" class="c b mono" style="font-size:12px;fill:#3F3F3F">Singleton</text>
  <line x1="330" y1="95" x2="554" y2="95" stroke="#7FB2D6"/>
  <text x="339" y="110.5" class="mono" style="font-size:10.5px;fill:#3F3F3F;text-decoration:underline">- uniqueInstance: Singleton</text>
  <line x1="330" y1="118" x2="554" y2="118" stroke="#7FB2D6"/>
  <text x="339" y="133.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- Singleton()</text>
  <text x="339" y="148.5" class="mono" style="font-size:10.5px;fill:#3F3F3F;text-decoration:underline">+ getUniqueInstance(): Singleton</text>
  <rect x="80" y="115.8" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="128" y="135.8" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M176,130.3 L330,130.8" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="253" y="122.8" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">getUniqueInstance()</text>
  <path d="M554,120 L604,120 L604,80 L554,80" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="612" y="97.5" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">uniqueInstance</text>
  <line x1="30" y1="190" x2="64" y2="190" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="72" y="194" class="sub">关联（字段）</text>
  <line x1="160" y1="190" x2="194" y2="190" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="202" y="194" class="sub">依赖（创建、调用）</text>
  <rect x="323" y="183" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="347" y="194" class="sub">类</text>
  <rect x="376" y="183" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="400" y="194" class="sub">客户端</text>
  <text x="455" y="194" class="sub">+ public，- private；下划线为静态成员</text>
  <text x="30" y="216" class="sub" style="fill:#3F3F3F">构造函数是私有的，外部不能 new，只能通过静态方法 getUniqueInstance() 拿到 uniqueInstance 指向的唯一实例。</text>
</svg>
