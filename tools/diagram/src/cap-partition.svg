<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">CAP：发生网络分区时，只能在一致性和可用性之间选一个</text>
  <path d="M115,86 v44 a25,6 0 0 0 50,0 v-44" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <ellipse cx="140" cy="86" rx="25" ry="6" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M115,108 a25,6 0 0 0 50,0" fill="none" stroke="#7FB2D6" stroke-width="1"/>
  <text x="140" y="156" class="c sub b">节点 1</text>
  <text x="140" y="172" class="c sub mono">x = 2</text>
  <path d="M435,86 v44 a25,6 0 0 0 50,0 v-44" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <ellipse cx="460" cy="86" rx="25" ry="6" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M435,108 a25,6 0 0 0 50,0" fill="none" stroke="#7FB2D6" stroke-width="1"/>
  <text x="460" y="156" class="c sub b">节点 2</text>
  <text x="460" y="172" class="c sub mono">x = 1（还没同步）</text>
  <line x1="175" y1="108" x2="425" y2="108" stroke="#C0605A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="300" cy="108" r="10" fill="#F3C6C2" stroke="#D99A94" stroke-width="1.2"/>
  <path d="M295.5,103.5 L304.5,112.5 M304.5,103.5 L295.5,112.5" stroke="#C0605A" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="88" class="c sub note">网络分区，无法同步</text>
  <circle cx="60" cy="209" r="9" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <path d="M43,240 q0,-19 17,-19 q17,0 17,19 z" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <text x="60" y="258" class="c sub">写入 x = 2</text>
  <line x1="82" y1="206" x2="120" y2="140" class="arrow "/>
  <circle cx="560" cy="209" r="9" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <path d="M543,240 q0,-19 17,-19 q17,0 17,19 z" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <text x="560" y="258" class="c sub">读取 x</text>
  <line x1="540" y1="206" x2="488" y2="140" class="arrow "/>
  <rect x="600" y="60" width="140" height="50" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="670" y="83" class="b c">CP：拒绝请求</text>
  <text x="670" y="98" class="sub c">返回错误或等待</text>
  <rect x="600" y="120" width="140" height="50" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="670" y="143" class="b c">AP：返回 x = 1</text>
  <text x="670" y="158" class="sub c">旧数据</text>
  <text x="24" y="296" class="sub">没有分区时两者可以同时满足；分区是一定会发生的故障，所以“三选二”中不存在放弃 P 的选项。</text>
  <text x="24" y="314" class="sub">Zookeeper、etcd 选择 CP，少数派一侧的节点拒绝读写；Eureka、Cassandra 选择 AP。</text>
</svg>
