<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="390" y="28" class="title">思维树与反思</text>
  <rect x="15" y="46" width="370" height="360" rx="8" class="frame"/>
  <text x="25" y="64" class="b">思维树：搜索多条思路，评估后剪枝</text>
  <text x="30" y="86" class="sub">4 件商品 120、90、60、30 元，每单满 150 减 25，怎么拆单？</text>
  <rect x="110" y="98" width="170" height="28" rx="5" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="195" y="116.5" class="c sub b">120 元的那一单再配哪件</text>
  <path d="M195,126 C195,146 82,146 82,164" class="arrow"/>
  <rect x="30" y="166" width="104" height="28" rx="5" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="82" y="184.5" class="c sub b mono">120 + 90</text>
  <text x="82" y="212" class="c sub">剩 60 + 30 = 90</text>
  <text x="82" y="228" class="c sub note">凑不满 150，剪掉</text>
  <path d="M195,126 C195,146 200,146 200,164" class="arrow"/>
  <rect x="148" y="166" width="104" height="28" rx="5" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="200" y="184.5" class="c sub b mono">120 + 60</text>
  <text x="200" y="212" class="c sub">剩 90 + 30 = 120</text>
  <text x="200" y="228" class="c sub note">凑不满 150，剪掉</text>
  <path d="M195,126 C195,146 318,146 318,164" class="arrow"/>
  <rect x="266" y="166" width="104" height="28" rx="5" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="318" y="184.5" class="c sub b mono">120 + 30</text>
  <text x="318" y="212" class="c sub">剩 90 + 60 = 150</text>
  <text x="318" y="228" class="c sub ok">还能凑一单</text>
  <line x1="312" y1="236" x2="312" y2="268" class="arrow "/>
  <rect x="240" y="270" width="130" height="28" rx="5" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="305" y="288.5" class="c sub b mono">90 + 60</text>
  <text x="305" y="316" class="c sub ok">两单各减 25，共省 50 元</text>
  <text x="30" y="352" class="sub">每一步生成几个候选，让模型或代码评估“剩下的商品</text>
  <text x="30" y="368" class="sub">还能不能凑满 150”，只展开有希望的分支。</text>
  <text x="30" y="390" class="sub">按顺序先凑 120 + 90 的做法只能减一次。</text>
  <rect x="400" y="46" width="365" height="360" rx="8" class="frame"/>
  <text x="410" y="64" class="b">反思：根据外部反馈总结原因，再试一次</text>
  <rect x="416" y="72" width="333" height="58" rx="5" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="428" y="90" class="sub b">第 1 次尝试</text>
  <text x="428" y="107" class="sub mono">SELECT SUM(amount) FROM refunds</text>
  <text x="428" y="123" class="sub mono">WHERE status IN ('refunding', 'refunded')</text>
  <line x1="582" y1="132" x2="582" y2="150" class="arrow "/>
  <rect x="416" y="152" width="333" height="42" rx="5" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="428" y="170" class="sub b">测试结果</text>
  <text x="428" y="187" class="sub">期望 1289.5，实际 1349.4</text>
  <line x1="582" y1="196" x2="582" y2="214" class="arrow "/>
  <rect x="416" y="216" width="333" height="58" rx="5" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="428" y="234" class="sub b">反思（写入记忆）</text>
  <text x="428" y="251" class="sub">退款中的记录还没退成功，</text>
  <text x="428" y="267" class="sub mono">只应统计 status = 'refunded'</text>
  <line x1="582" y1="276" x2="582" y2="294" class="arrow "/>
  <rect x="416" y="296" width="333" height="58" rx="5" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="428" y="314" class="sub b">第 2 次尝试</text>
  <text x="428" y="331" class="sub mono">... WHERE status = 'refunded'</text>
  <text x="428" y="347" class="sub ok">测试通过</text>
  <text x="416" y="384" class="sub">关键是测试这类外部信号：没有反馈时让模型自己检查，</text>
  <text x="416" y="400" class="sub">往往发现不了错误。（示意）</text>
</svg>
