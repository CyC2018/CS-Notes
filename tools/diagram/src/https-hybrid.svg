<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="370" y="28" class="title">混合加密：用非对称加密传递会话密钥（TLS 1.2 的 RSA 密钥交换）</text>
  <rect x="80" y="46" width="140" height="32" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="150" y="66.5" class="c sub b">浏览器</text>
  <line x1="150" y1="80" x2="150" y2="270" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="520" y="46" width="140" height="32" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="590" y="66.5" class="c sub b">服务器（持有私钥）</text>
  <line x1="590" y1="80" x2="590" y2="270" stroke="#BBB" stroke-dasharray="4 4"/>
  <line x1="150" y1="110" x2="590" y2="110" class="arrow "/>
  <text x="370" y="104" class="c sub" style="fill:#444">① 客户端随机数</text>
  <line x1="590" y1="144" x2="150" y2="144" class="arrow dash"/>
  <text x="370" y="138" class="c sub" style="fill:#444">② 服务器随机数 + 证书（含公钥）</text>
  <line x1="150" y1="178" x2="590" y2="178" class="arrow "/>
  <text x="370" y="172" class="c sub" style="fill:#444">③ 用公钥加密的预主密钥</text>
  <text x="138" y="210" class="sub e" style="fill:#766AA8">三者算出会话密钥</text>
  <text x="602" y="210" class="sub" style="fill:#766AA8">解密后算出同样的会话密钥</text>
  <rect x="150" y="226" width="440" height="30" rx="15" fill="#E6E3FA" fill-opacity="0.5" stroke="#B8B0DE"/>
  <text x="370" y="246" class="c sub" style="fill:#444">④ 之后的 HTTP 报文用会话密钥对称加密（例如 AES-GCM）</text>
  <text x="30" y="290" class="sub">这种方式下私钥一旦泄露，之前录下的通信都能被解密，TLS 1.3 已经去掉它，改用 ECDHE 密钥交换。</text>
</svg>
