<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">进程状态的切换</text>
  <rect x="40" y="132" width="100" height="36" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="90" y="154.5" class="c sub b">新建</text>
  <rect x="220" y="132" width="100" height="36" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="270" y="154.5" class="c sub b">就绪</text>
  <rect x="420" y="132" width="100" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="470" y="154.5" class="c sub b">运行</text>
  <rect x="320" y="232" width="100" height="36" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="370" y="254.5" class="c sub b">阻塞</text>
  <rect x="590" y="132" width="100" height="36" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="640" y="154.5" class="c sub b">终止</text>
  <line x1="142" y1="150" x2="218" y2="150" class="arrow "/>
  <text x="180" y="142" class="c sub">创建完成</text>
  <path d="M322,140 L418,140" class="arrow"/>
  <text x="370" y="132" class="c sub">被调度</text>
  <path d="M418,162 L322,162" class="arrow"/>
  <text x="370" y="180" class="c sub">时间片用完</text>
  <line x1="522" y1="150" x2="588" y2="150" class="arrow "/>
  <text x="555" y="142" class="c sub">结束</text>
  <path d="M470,170 C470,230 440,250 422,250" class="arrow"/>
  <text x="480" y="220" class="sub">等待 I/O 或事件</text>
  <path d="M318,250 C290,250 270,220 270,172" class="arrow"/>
  <text x="260" y="222" class="sub e">I/O 完成</text>
  <text x="30" y="288" class="sub">只有就绪和运行可以相互转换；阻塞的进程即使 CPU 空闲也不能运行，要先回到就绪队列。</text>
</svg>
