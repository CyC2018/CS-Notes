<svg xmlns="http://www.w3.org/2000/svg" width="656" height="300" viewBox="0 0 656 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="328" y="28" class="title">KV Cache：算过的 K、V 不再重算</text>
  <text x="55" y="73" class="c b">预填充</text>
  <text x="55" y="89" class="c sub">Prefill</text>
  <rect x="105" y="60" width="52" height="28" rx="4" fill="#B1DDF0"/>
  <text x="131" y="78.5" class="c">今天</text>
  <rect x="163" y="60" width="52" height="28" rx="4" fill="#B1DDF0"/>
  <text x="189" y="78.5" class="c">天气</text>
  <line x1="342" y1="74" x2="372" y2="74" class="arrow "/>
  <rect x="376" y="60" width="52" height="28" rx="4" fill="#DDD7F6"/>
  <text x="402" y="78.5" class="c">很</text>
  <text x="446" y="78" class="sub">一次处理整个输入，决定首 Token 延迟</text>
  <text x="55" y="135" class="c b">解码</text>
  <text x="55" y="151" class="c sub">第 1 步</text>
  <rect x="105" y="122" width="52" height="28" rx="4" fill="#E6E6E6"/>
  <text x="131" y="140.5" class="c">今天</text>
  <rect x="163" y="122" width="52" height="28" rx="4" fill="#E6E6E6"/>
  <text x="189" y="140.5" class="c">天气</text>
  <rect x="221" y="122" width="52" height="28" rx="4" fill="#B1DDF0"/>
  <text x="247" y="140.5" class="c">很</text>
  <line x1="342" y1="136" x2="372" y2="136" class="arrow "/>
  <rect x="376" y="122" width="52" height="28" rx="4" fill="#DDD7F6"/>
  <text x="402" y="140.5" class="c">好</text>
  <text x="446" y="140" class="sub"></text>
  <text x="55" y="197" class="c b">解码</text>
  <text x="55" y="213" class="c sub">第 2 步</text>
  <rect x="105" y="184" width="52" height="28" rx="4" fill="#E6E6E6"/>
  <text x="131" y="202.5" class="c">今天</text>
  <rect x="163" y="184" width="52" height="28" rx="4" fill="#E6E6E6"/>
  <text x="189" y="202.5" class="c">天气</text>
  <rect x="221" y="184" width="52" height="28" rx="4" fill="#E6E6E6"/>
  <text x="247" y="202.5" class="c">很</text>
  <rect x="279" y="184" width="52" height="28" rx="4" fill="#B1DDF0"/>
  <text x="305" y="202.5" class="c">好</text>
  <line x1="342" y1="198" x2="372" y2="198" class="arrow "/>
  <rect x="376" y="184" width="52" height="28" rx="4" fill="#DDD7F6"/>
  <text x="402" y="202.5" class="c">结束</text>
  <text x="446" y="202" class="sub"></text>
  <path d="M440,122 L436,122 L436,212 L440,212" class="line"/>
  <text x="446" y="163" class="sub">每步只算 1 个新 Token，</text>
  <text x="446" y="181" class="sub">决定后续的输出速度</text>
  <rect x="105" y="250" width="16" height="14" rx="2" fill="#B1DDF0"/>
  <text x="127" y="262" class="sub">本步计算 Q、K、V，并把 K、V 写入缓存</text>
  <rect x="105" y="272" width="16" height="14" rx="2" fill="#E6E6E6"/>
  <text x="127" y="284" class="sub">直接读取缓存中的 K、V</text>
  <text x="600" y="284" class="e note">上下文越长，缓存占用的显存越多</text>
</svg>
