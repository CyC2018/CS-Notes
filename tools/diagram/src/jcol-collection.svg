  <path d="M554,221.0 L371,170.0" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M554,221.0 L615,170.0" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M676,221.0 L615,170.0" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <line x1="30" y1="386" x2="70" y2="386" stroke="#555" marker-end="url(#tri)"/>
  <text x="78" y="390" class="sub">继承</text>
  <line x1="130" y1="386" x2="170" y2="386" stroke="#555" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="178" y="390" class="sub">实现</text>
  <rect x="230" y="378" width="18" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="254" y="390" class="sub">接口</text>
  <rect x="300" y="378" width="18" height="14" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="324" y="390" class="sub">类</text>
  <text x="30" y="420" class="sub">LinkedList 实现的是 Queue 的子接口 Deque，TreeSet 实现的是 SortedSet 的子接口 NavigableSet，图中省略了这些中间层。</text>
</svg>
