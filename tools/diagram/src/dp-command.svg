<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">命令的类图（遥控器）</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="30" y="60" width="205" height="163" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="132.5" y="80" class="c b mono" style="font-size:12px;fill:#3F3F3F">Invoker</text>
  <text x="132.5" y="93" class="c sub" style="font-size:10px">（遥控器）</text>
  <line x1="30" y1="102" x2="235" y2="102" stroke="#7FB2D6"/>
  <text x="39" y="117.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- onCommands: Command[]</text>
  <text x="39" y="132.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- offCommands: Command[]</text>
  <text x="39" y="147.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- slotNum: int</text>
  <line x1="30" y1="155" x2="235" y2="155" stroke="#7FB2D6"/>
  <text x="39" y="170.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ setOnCommand(Command, int)</text>
  <text x="39" y="185.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ setOffCommand(Command, int)</text>
  <text x="39" y="200.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ onButtonWasPushed(int)</text>
  <text x="39" y="215.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ offButtonWasPushed(int)</text>
  <rect x="517" y="76" width="96" height="64" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="565" y="93" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="565" y="108" class="c b mono" style="font-size:12px;fill:#3F3F3F">Command</text>
  <line x1="517" y1="117" x2="613" y2="117" stroke="#B8B0DE"/>
  <text x="526" y="132.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ execute()</text>
  <path d="M235,108 L517,108" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="376" y="102" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">onCommands、offCommands</text>
  <rect x="386.5" y="200" width="167" height="90" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="470" y="220" class="c b mono" style="font-size:12px;fill:#3F3F3F">LightOnCommand</text>
  <line x1="386.5" y1="229" x2="553.5" y2="229" stroke="#7FB2D6"/>
  <text x="395.5" y="244.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ light: Light</text>
  <line x1="386.5" y1="252" x2="553.5" y2="252" stroke="#7FB2D6"/>
  <text x="395.5" y="267.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ LightOnCommand(Light)</text>
  <text x="395.5" y="282.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ execute()</text>
  <rect x="573" y="200" width="174" height="90" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="660" y="220" class="c b mono" style="font-size:12px;fill:#3F3F3F">LightOffCommand</text>
  <line x1="573" y1="229" x2="747" y2="229" stroke="#7FB2D6"/>
  <text x="582" y="244.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ light: Light</text>
  <line x1="573" y1="252" x2="747" y2="252" stroke="#7FB2D6"/>
  <text x="582" y="267.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ LightOffCommand(Light)</text>
  <text x="582" y="282.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ execute()</text>
  <path d="M470,200 L470,170" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M660,200 L660,170" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M470,170 L660,170" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M565,170 L565,141" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <rect x="517" y="350" width="96" height="80" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="565" y="370" class="c b mono" style="font-size:12px;fill:#3F3F3F">Light</text>
  <text x="565" y="383" class="c sub" style="font-size:10px">（Receiver）</text>
  <line x1="517" y1="392" x2="613" y2="392" stroke="#7FB2D6"/>
  <text x="526" y="407.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ on()</text>
  <text x="526" y="422.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ off()</text>
  <path d="M470,290 L470,320" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M660,290 L660,320" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M470,320 L660,320" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M565,320 L565,350" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="573" y="338" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">light</text>
  <rect x="84.5" y="375" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="132.5" y="395" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M132.5,375 L132.5,223" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="140.5" y="303" class="sub" style="font-size:10.5px">setOnCommand()、onButtonWasPushed()</text>
  <path d="M180.5,389.5 L517,390" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="348.75" y="384" class="c sub" style="font-size:10.5px">创建</text>
  <line x1="30" y1="464" x2="64" y2="464" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="72" y="468" class="sub">实现</text>
  <line x1="116" y1="464" x2="150" y2="464" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="158" y="468" class="sub">关联（字段）</text>
  <line x1="246" y1="464" x2="280" y2="464" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="288" y="468" class="sub">依赖（创建、调用）</text>
  <rect x="409" y="457" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="433" y="468" class="sub">接口</text>
  <rect x="473" y="457" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="497" y="468" class="sub">类</text>
  <rect x="526" y="457" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="550" y="468" class="sub">客户端</text>
  <text x="30" y="488" class="sub">+ public，- private，~ 包访问权限</text>
  <text x="30" y="510" class="sub" style="fill:#3F3F3F">onButtonWasPushed(0) 只调用 onCommands[0].execute()，Invoker 不知道背后是电灯；真正干活的是接收者 Light。</text>
</svg>
