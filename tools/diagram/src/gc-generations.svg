<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="370" y="28" class="title">分代的堆：其它收集器按新生代、老年代整体回收</text>
  <rect x="40" y="70" width="176" height="44" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="128" y="96" class="c sub b" style="fill:#444">Eden</text>
  <rect x="216" y="70" width="22" height="44" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="227" y="96" class="c sub b" style="fill:#444">S0</text>
  <rect x="238" y="70" width="22" height="44" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="249" y="96" class="c sub b" style="fill:#444">S1</text>
  <rect x="260" y="70" width="440" height="44" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="480" y="96" class="c sub b" style="fill:#444">老年代</text>
  <path d="M40,124 q0,8 8,8 H252 q8,0 8,-8" class="line"/>
  <text x="150" y="150" class="c sub">新生代：Eden 与两个 Survivor 默认 8 : 1 : 1</text>
  <path d="M260,124 q0,8 8,8 H692 q8,0 8,-8" class="line"/>
  <text x="480" y="150" class="c sub">老年代：默认是新生代的 2 倍（NewRatio = 2）</text>
  <text x="30" y="190" class="sub">新对象在 Eden 分配；Minor GC 时把存活对象复制到 Survivor，年龄够了晋升到老年代。</text>
  <text x="30" y="208" class="sub">类的元数据不在堆中，JDK 8 起放在本地内存的元空间（Metaspace）。</text>
</svg>
