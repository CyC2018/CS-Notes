<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">一次模型调用的重试、熔断与降级</text>
  <rect x="30" y="62" width="120" height="50" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="90" y="85" class="b c">限流</text>
  <text x="90" y="100" class="sub c">按 RPM、TPM 排队</text>
  <rect x="200" y="62" width="140" height="50" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="270" y="85" class="b c">主模型</text>
  <text x="270" y="100" class="sub c">熔断器关闭时调用</text>
  <rect x="460" y="62" width="140" height="50" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="530" y="85" class="b c">备用模型</text>
  <text x="530" y="100" class="sub c">同类能力，提前评测</text>
  <rect x="640" y="62" width="90" height="50" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="685" y="85" class="b c">兜底</text>
  <text x="685" y="100" class="sub c">转人工</text>
  <line x1="150" y1="87" x2="198" y2="87" class="arrow "/>
  <line x1="340" y1="87" x2="458" y2="87" class="arrow "/>
  <text x="400" y="108" class="c sub note">重试后仍失败，</text>
  <text x="400" y="124" class="c sub note">或熔断打开时直接跳过</text>
  <line x1="600" y1="87" x2="638" y2="87" class="arrow "/>
  <text x="619" y="78" class="c sub note">失败</text>
  <path d="M240,112 C240,150 300,150 300,114" class="arrow"/>
  <text x="270" y="166" class="c sub">429、5xx、超时：等 0.5 秒、1 秒…后重试，</text>
  <text x="270" y="182" class="c sub">响应带 Retry-After 时按它等待；400、401 不重试</text>
  <text x="30" y="222" class="b">超时怎么设置</text>
  <rect x="30" y="236" width="700" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="30" y="236" width="70" height="32" rx="4" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="65" y="256" class="c sub b" style="fill:#444">非流式</text>
  <text x="112" y="256" class="sub">要等完整结果：总超时 ≥ TTFT + 最大输出 Token 数 × TPOT，例如 2 秒 + 1000 × 30 ms ≈ 32 秒</text>
  <rect x="30" y="274" width="700" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="30" y="274" width="70" height="32" rx="4" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="65" y="294" class="c sub b" style="fill:#444">流式</text>
  <text x="112" y="294" class="sub">首 Token 超时（例如 15 秒）、相邻两段数据的间隔超时（例如 20 秒），再加一个总时长上限</text>
  <rect x="30" y="312" width="700" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="30" y="312" width="70" height="32" rx="4" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="65" y="332" class="c sub b" style="fill:#444">熔断</text>
  <text x="112" y="332" class="sub">主模型最近 1 分钟失败率超过 50% 时打开，请求直接走备用模型，30 秒后放行少量请求试探</text>
  <text x="30" y="372" class="sub">示意：数值按接口实测的 TTFT、TPOT 和业务能接受的等待时间确定。</text>
</svg>
