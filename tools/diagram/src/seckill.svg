<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">秒杀：层层过滤请求</text>
  <path d="M20,70 L250,92 L330,120 L700,124 L700,140 L330,144 L250,172 L20,194 Z" fill="#B1DDF0" opacity="0.35"/>
  <text x="30" y="128" class="b">10 万个请求</text>
  <text x="30" y="144" class="sub">同时到达</text>
  <path d="M170,104 L189,113 V124.7 C189,139.88 176,147 170,150 C164,147 151,139.88 151,124.7 V113 Z" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <path d="M161,126.08 l6,6 l12,-13" fill="none" stroke="#7FB4D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="90" class="c b">前端与网关</text>
  <text x="170" y="74" class="c sub">防重复提交、按用户限流</text>
  <path d="M307,112 v34 a23,6 0 0 0 46,0 v-34" fill="#B0E3E6" stroke="#78BFC4" stroke-width="1.2"/>
  <ellipse cx="330" cy="112" rx="23" ry="6" fill="#B0E3E6" stroke="#78BFC4" stroke-width="1.2"/>
  <path d="M307,129 a23,6 0 0 0 46,0" fill="none" stroke="#78BFC4" stroke-width="1"/>
  <text x="330" y="90" class="c b">Redis + Lua</text>
  <text x="330" y="58" class="c sub">判断库存和是否已购，</text>
  <text x="330" y="74" class="c sub">原子扣减 100 → 0</text>
  <rect x="430" y="119" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.2"/>
  <rect x="440" y="123" width="20.6667" height="18" rx="3" fill="#DDD7F6" stroke="#A99FD8" stroke-width="1.2"/>
  <text x="450.333" y="136" class="c sub"></text>
  <rect x="464.667" y="123" width="20.6667" height="18" rx="3" fill="#DDD7F6" stroke="#A99FD8" stroke-width="1.2"/>
  <text x="475" y="136" class="c sub"></text>
  <rect x="489.333" y="123" width="20.6667" height="18" rx="3" fill="#DDD7F6" stroke="#A99FD8" stroke-width="1.2"/>
  <text x="499.667" y="136" class="c sub"></text>
  <text x="475" y="108" class="c sub">消息队列 100 条</text>
  <rect x="570" y="108" width="40" height="13" rx="3" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <circle cx="577" cy="114.5" r="2" fill="#7FB4D0"/>
  <line x1="584" y1="114.5" x2="603" y2="114.5" stroke="#7FB4D0" stroke-width="1"/>
  <rect x="570" y="124" width="40" height="13" rx="3" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <circle cx="577" cy="130.5" r="2" fill="#7FB4D0"/>
  <line x1="584" y1="130.5" x2="603" y2="130.5" stroke="#7FB4D0" stroke-width="1"/>
  <rect x="570" y="140" width="40" height="13" rx="3" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <circle cx="577" cy="146.5" r="2" fill="#7FB4D0"/>
  <line x1="584" y1="146.5" x2="603" y2="146.5" stroke="#7FB4D0" stroke-width="1"/>
  <text x="590" y="172" class="c b">订单服务</text>
  <path d="M650,114 v30 a20,6 0 0 0 40,0 v-30" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <ellipse cx="670" cy="114" rx="20" ry="6" fill="#B1DDF0" stroke="#7FB4D0" stroke-width="1.2"/>
  <path d="M650,129 a20,6 0 0 0 40,0" fill="none" stroke="#7FB4D0" stroke-width="1"/>
  <text x="670" y="172" class="c b">MySQL</text>
  <line x1="522" y1="132" x2="568" y2="132" class="arrow "/>
  <line x1="612" y1="132" x2="648" y2="132" class="arrow "/>
  <text x="630" y="192" class="c sub">库存大于 0 才扣减</text>
  <text x="630" y="208" class="c sub">唯一索引保证一人一单</text>
  <line x1="330" y1="158" x2="330" y2="214" class="arrow red"/>
  <text x="330" y="232" class="c note">其余请求直接返回“已抢完”</text>
  <line x1="170" y1="156" x2="170" y2="214" class="arrow red"/>
  <text x="170" y="232" class="c note">拦截重复和超限请求</text>
  <text x="360" y="280" class="c sub">到达数据库的请求接近库存数量；订单最终创建失败时，要把 Redis 中的库存和购买记录恢复。</text>
</svg>
