<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">TCP/IP：应用可以跳过传输层直接使用 IP</text>
  <rect x="30" y="60" width="700" height="56" rx="6" fill="#C6ECE9" opacity="0.35"/>
  <text x="46" y="93" class="b">应用层</text>
  <rect x="30" y="130" width="700" height="56" rx="6" fill="#C6E4FB" opacity="0.35"/>
  <text x="46" y="163" class="b">传输层</text>
  <rect x="30" y="200" width="700" height="56" rx="6" fill="#E6E3FA" opacity="0.35"/>
  <text x="46" y="233" class="b">网际层</text>
  <rect x="30" y="270" width="700" height="56" rx="6" fill="#EAE9E7" opacity="0.35"/>
  <text x="46" y="303" class="b">网络接口层</text>
  <rect x="195" y="72" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="240" y="92.5" class="c sub b">HTTP</text>
  <rect x="335" y="72" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="380" y="92.5" class="c sub b">DNS</text>
  <rect x="515" y="72" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="560" y="92.5" class="c sub b">ping</text>
  <rect x="195" y="142" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="240" y="162.5" class="c sub b">TCP</text>
  <rect x="335" y="142" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="380" y="162.5" class="c sub b">UDP</text>
  <rect x="265" y="212" width="110" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="320" y="232.5" class="c sub b">IP</text>
  <rect x="515" y="212" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="560" y="232.5" class="c sub b">ICMP</text>
  <rect x="155" y="282" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="200" y="302.5" class="c sub b">以太网</text>
  <rect x="275" y="282" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="320" y="302.5" class="c sub b">Wi-Fi</text>
  <rect x="395" y="282" width="90" height="32" rx="4" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="440" y="302.5" class="c sub b">PPP</text>
  <line x1="240" y1="104" x2="240" y2="140" class="arrow "/>
  <line x1="380" y1="104" x2="380" y2="140" class="arrow "/>
  <line x1="240" y1="174" x2="300" y2="210" class="arrow "/>
  <line x1="380" y1="174" x2="340" y2="210" class="arrow "/>
  <line x1="560" y1="104" x2="560" y2="210" class="arrow "/>
  <text x="570" y="160" class="sub" style="fill:#766AA8">不经过传输层</text>
  <line x1="515" y1="228" x2="377" y2="228" class="arrow "/>
  <text x="446" y="222" class="c sub">封装在 IP 中</text>
  <line x1="320" y1="244" x2="200" y2="280" class="arrow "/>
  <line x1="320" y1="244" x2="320" y2="280" class="arrow "/>
  <line x1="320" y1="244" x2="440" y2="280" class="arrow "/>
  <text x="30" y="352" class="sub">所有应用的数据最后都封装成 IP 数据报，IP 又可以运行在各种网络接口之上。ping 直接发送 ICMP 报文，不使用 TCP 或 UDP。</text>
</svg>
