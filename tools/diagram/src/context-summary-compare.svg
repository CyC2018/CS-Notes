  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">两种摘要提示词：压缩后保留了哪些事实</text>
  <text x="360" y="50" class="c sub">Qwen2.5-3B 把 11 轮客服对话（1654 个 Token）各压缩 3 次；摘要为第 1 次的节选</text>
  <rect x="20" y="66" width="330" height="215" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="34" y="88" class="b">普通摘要：“用一段话总结这段对话”</text>
  <text x="34" y="108" class="sub">约 150 个 Token　保留 <tspan class="note b">4.3</tspan> / 14 条　探针问题答对 <tspan class="note b">0.3</tspan> / 5</text>
  <text x="34" y="136" class="sub">……订单ID为1024的耳机目前在杭州转运中心，预计10月</text>
  <text x="34" y="155" class="sub">27日送达；订单ID为1025的65W氮化镓充电器已签收，</text>
  <text x="34" y="174" class="sub">用户申请退货，客服为其安排了10月29日14:00-16:00</text>
  <text x="34" y="193" class="sub">上门取件，<tspan class="note">并告知了用户取件地址和退款详情</tspan>；</text>
  <text x="34" y="212" class="sub">用户还更改了订单ID为1026机械键盘的收货地址，客服</text>
  <text x="34" y="231" class="sub">确认并更新了地址信息；最后，用户询问优惠券是否可以</text>
  <text x="34" y="250" class="sub">用于订单ID为1026……</text>
  <text x="34" y="271" class="sub note">只说“告知了地址和退款详情”，没有写出地址和金额</text>
  <rect x="370" y="66" width="330" height="215" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="384" y="88" class="b">结构化摘要：分项输出，编号照原文抄写</text>
  <text x="384" y="108" class="sub">约 480 个 Token　保留 <tspan class="ok b">9.7</tspan> / 14 条　探针问题答对 <tspan class="ok b">3</tspan> / 5</text>
  <text x="384" y="136" class="sub">订单：1024 降噪蓝牙耳机 X3，运输中，预计 10 月 27 日送达</text>
  <text x="384" y="155" class="sub">　　　1025 65W 氮化镓充电器，已签收</text>
  <text x="384" y="174" class="sub">　　　1026 机械键盘 K8，待发货</text>
  <text x="384" y="193" class="sub">已办理：1024 优惠券 CP7731，10 元，有效期 2026-11-30</text>
  <text x="384" y="212" class="sub">　　　　1025 退货，取件时间 2026-10-29 14:00-16:00，</text>
  <text x="384" y="231" class="sub">　　　　　　　退款金额 59.9 元</text>
  <text x="384" y="250" class="sub">　　　　1026 地址改为江南大道 588 号 3 幢 1201</text>
  <text x="384" y="271" class="sub note">没有退货单号 R2051，也没有“短信联系、尾号 8823”</text>
  <text x="20" y="315" class="b">每条事实在 3 次压缩中被保留的次数</text>
