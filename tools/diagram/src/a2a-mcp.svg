  <line x1="635" y1="236.5" x2="648" y2="236.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="638" y="270" class="c sub">轨迹系统</text>
  <path d="M690,156 C690,180 638,184 638,210" class="arrow"/>
  <rect x="725" y="214" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="732" cy="220.5" r="2" fill="#7FB2D6"/>
  <line x1="739" y1="220.5" x2="752" y2="220.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="725" y="230" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="732" cy="236.5" r="2" fill="#7FB2D6"/>
  <line x1="739" y1="236.5" x2="752" y2="236.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="742" y="270" class="c sub">派送调度</text>
  <path d="M690,156 C690,180 742,184 742,210" class="arrow"/>
  <text x="690" y="192" class="c sub b">MCP</text>
  <text x="410" y="70" class="c b">A2A（JSON-RPC、gRPC 或 HTTP+JSON）</text>
  <rect x="256" y="88" width="308" height="42" rx="5" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="264" y="105" class="sub" style="font-size:10.5px;fill:#3F3F3F">① GET /.well-known/agent-card.json</text>
  <text x="264" y="121" class="sub" style="font-size:10.5px">名称、技能（查询轨迹、改派）、地址、认证方式</text>
  <rect x="256" y="138" width="308" height="42" rx="5" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="264" y="155" class="sub" style="font-size:10.5px;fill:#3F3F3F">② SendMessage：运单 SF1234567 改派到驿站</text>
  <text x="264" y="171" class="sub" style="font-size:10.5px">返回任务 task-77，状态 submitted → working</text>
  <rect x="256" y="188" width="308" height="42" rx="5" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="264" y="205" class="sub" style="font-size:10.5px;fill:#3F3F3F">③ 状态 input-required：需要收件人手机号后四位</text>
  <text x="264" y="221" class="sub" style="font-size:10.5px">客服 Agent 向用户询问后补充消息</text>
  <rect x="256" y="238" width="308" height="42" rx="5" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="264" y="255" class="sub" style="font-size:10.5px;fill:#3F3F3F">④ 状态 completed，Artifact：改派成功</text>
  <text x="264" y="271" class="sub" style="font-size:10.5px">长任务可以用 SSE 推送进度或回调通知</text>
  <line x1="242" y1="170" x2="254" y2="170" class="line"/>
  <line x1="566" y1="170" x2="578" y2="170" class="arrow"/>
  <text x="410" y="322" class="c sub">MCP 是 Agent 与自己的工具之间的协议，工具按固定的输入输出执行一次调用；</text>
  <text x="410" y="340" class="c sub">A2A 是 Agent 与 Agent 之间的协议，对方是黑盒，任务有状态、可能持续很久、中途可能要补充信息。</text>
  <text x="410" y="362" class="c sub">两家公司的 Agent 都只暴露能力，不共享各自的提示词、记忆和工具。</text>
</svg>
