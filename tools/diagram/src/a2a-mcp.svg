  <text x="130" y="146" class="c b">客服 Agent</text>
  <rect x="61" y="214" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="68" cy="220.5" r="2" fill="#7FB2D6"/>
  <line x1="75" y1="220.5" x2="88" y2="220.5" stroke="#7FB2D6" stroke-width="1"/>
