  <text x="78" y="270" class="c sub">订单库</text>
  <path d="M130,156 C130,180 78,184 78,210" class="arrow"/>
  <rect x="165" y="214" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="172" cy="220.5" r="2" fill="#7FB2D6"/>
  <line x1="179" y1="220.5" x2="192" y2="220.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="165" y="230" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="172" cy="236.5" r="2" fill="#7FB2D6"/>
  <line x1="179" y1="236.5" x2="192" y2="236.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="182" y="270" class="c sub">退款接口</text>
  <path d="M130,156 C130,180 182,184 182,210" class="arrow"/>
  <text x="130" y="192" class="c sub b">MCP</text>
  <rect x="580" y="46" width="220" height="250" rx="8" class="frame"/>
  <text x="590" y="64" class="b">快递公司</text>
  <line x1="681.5" y1="82" x2="681.5" y2="126" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="668" y1="95.5" x2="712" y2="95.5" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="690" y1="82" x2="690" y2="126" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="668" y1="104" x2="712" y2="104" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="698.5" y1="82" x2="698.5" y2="126" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="668" y1="112.5" x2="712" y2="112.5" stroke="#7DBCB7" stroke-width="1.6"/>
  <rect x="673" y="87" width="34" height="34" rx="5" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <rect x="682.52" y="96.52" width="14.96" height="14.96" rx="2" fill="#FFFFFF" stroke="#7DBCB7" stroke-width="1"/>
  <text x="690" y="146" class="c b">物流 Agent</text>
  <rect x="621" y="214" width="34" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="628" cy="220.5" r="2" fill="#7FB2D6"/>
  <line x1="635" y1="220.5" x2="648" y2="220.5" stroke="#7FB2D6" stroke-width="1"/>
