    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="410" y="28" class="title">MCP 连接工具，A2A 连接 Agent</text>
  <rect x="20" y="46" width="220" height="250" rx="8" class="frame"/>
  <text x="30" y="64" class="b">电商平台</text>
  <line x1="121.5" y1="82" x2="121.5" y2="126" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="108" y1="95.5" x2="152" y2="95.5" stroke="#7DBCB7" stroke-width="1.6"/>
  <line x1="130" y1="82" x2="130" y2="126" stroke="#7DBCB7" stroke-width="1.6"/>
