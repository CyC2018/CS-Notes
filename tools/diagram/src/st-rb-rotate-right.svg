  <text x="404" y="114.5" class="c b">E</text>
  <circle cx="360" cy="170" r="15" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="360" y="174.5" class="c b">C</text>
  <circle cx="492" cy="170" r="15" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="492" y="174.5" class="c b">J</text>
