  <text x="536" y="234.5" class="c b">M</text>
  <text x="300" y="284" class="c sub">E 成为子树的根，继承 J 原来的颜色（黑）；J 变红，成为 E 的右子节点</text>
  <text x="300" y="302" class="c sub">G 从 E 的右子树移到 J 的左子树</text>
  <text x="300" y="92" class="c sub">灰色节点代表子树</text>
</svg>
