  <text x="226" y="174.5" class="c b">M</text>
  <line x1="270" y1="160" x2="320" y2="160" class="arrow "/>
  <line x1="404" y1="76" x2="404" y2="95" stroke="#555" stroke-width="1.1"/>
  <line x1="395.13" y1="122.096" x2="368.87" y2="157.904" stroke="#555" stroke-width="1.1"/>
  <line x1="416.393" y1="118.45" x2="479.607" y2="161.55" stroke="#C0605A" stroke-width="2.2"/>
