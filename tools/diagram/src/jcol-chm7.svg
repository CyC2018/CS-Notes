  <line x1="100" y1="212" x2="100" y2="236" class="arrow "/>
  <rect x="56" y="238" width="120" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="116" y="257.5" class="c sub mono b">HashEntry</text>
  <line x1="474" y1="98" x2="474" y2="140" class="arrow "/>
  <text x="488" y="124" class="sub">线程 B 可以同时写入 9 号段</text>
  <rect x="400" y="140" width="300" height="140" rx="8" class="frame"/>
  <text x="410" y="158" class="b">Segment 9</text>
  <text x="416" y="178" class="sub mono">HashEntry[] table</text>
  <rect x="416" y="186" width="44" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="438" y="203" class="c sub mono" style="fill:#444">0</text>
  <rect x="460" y="186" width="44" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="482" y="203" class="c sub mono" style="fill:#444">1</text>
  <rect x="504" y="186" width="44" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="526" y="203" class="c sub mono" style="fill:#444">2</text>
  <rect x="548" y="186" width="44" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="570" y="203" class="c sub mono" style="fill:#444">3</text>
  <text x="30" y="312" class="sub">JDK 1.8 不再分段，改为对数组中单个桶的头节点加锁，空桶用 CAS 插入，见下文。</text>
</svg>
