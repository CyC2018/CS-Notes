<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">三种对齐算法训练时要加载的模型</text>
  <text x="140" y="64" class="c b">PPO</text>
  <rect x="40" y="80" width="200" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="140" y="99.5" class="c sub b">策略模型</text>
  <text x="234" y="99" class="sub e">训练</text>
  <rect x="40" y="120" width="200" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="140" y="139.5" class="c sub b">价值模型</text>
  <text x="234" y="139" class="sub e">训练</text>
  <rect x="40" y="160" width="200" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="140" y="179.5" class="c sub">奖励模型</text>
  <text x="234" y="179" class="sub e">冻结</text>
  <rect x="40" y="200" width="200" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="140" y="219.5" class="c sub">参考模型</text>
  <text x="234" y="219" class="sub e">冻结</text>
  <text x="40" y="252" class="sub">提示词；训练中生成回答，</text>
  <text x="40" y="270" class="sub">奖励模型打分，价值模型估计预期得分</text>
  <text x="40" y="302" class="b">约 274 GB</text>
  <text x="380" y="64" class="c b">DPO</text>
  <rect x="280" y="80" width="200" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="380" y="99.5" class="c sub b">策略模型</text>
  <text x="474" y="99" class="sub e">训练</text>
  <rect x="280" y="120" width="200" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="380" y="139.5" class="c sub">参考模型</text>
  <text x="474" y="139" class="sub e">冻结</text>
  <text x="280" y="252" class="sub">离线的偏好对 (x, y_w, y_l)，</text>
  <text x="280" y="270" class="sub">不在训练中生成回答</text>
  <text x="280" y="302" class="b">约 137 GB</text>
  <text x="620" y="64" class="c b">GRPO</text>
  <rect x="520" y="80" width="200" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="620" y="99.5" class="c sub b">策略模型</text>
  <text x="714" y="99" class="sub e">训练</text>
  <rect x="520" y="120" width="200" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="620" y="139.5" class="c sub">参考模型</text>
  <text x="714" y="139" class="sub e">冻结</text>
  <rect x="520" y="160" width="200" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="620" y="179.5" class="c sub">奖励模型或规则</text>
  <text x="714" y="179" class="sub e">冻结</text>
  <text x="520" y="252" class="sub">提示词；每题生成一组回答，</text>
  <text x="520" y="270" class="sub">用组内平均分作为预期得分</text>
  <text x="520" y="302" class="b">约 137 GB（用规则打分时）</text>
  <text x="40" y="352" class="sub">显存按 7.6B 参数估算，只算模型状态：训练的模型含 BF16 参数、梯度和 FP32 Adam 状态，每个参数 16 字节，约 122 GB；</text>
  <text x="40" y="370" class="sub">冻结的模型只做前向计算，每个参数 2 字节，约 15 GB。不含激活、生成回答时的 KV Cache；奖励模型也可以比策略模型小。</text>
  <rect x="40" y="312" width="14" height="12" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="60" y="322" class="sub">要训练</text>
  <rect x="120" y="312" width="14" height="12" rx="2" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="140" y="322" class="sub">只做前向</text>
</svg>
