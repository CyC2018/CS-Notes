  <path d="M298.6,104.6 L302.6,104.6 L302.6,100.6" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M281.4,79.4 L277.4,79.4 L277.4,83.4" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
