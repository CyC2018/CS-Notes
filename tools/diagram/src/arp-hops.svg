  <text x="70" y="124" class="c b">H1</text>
  <text x="70" y="140" class="c sub mono">192.168.1.10</text>
  <circle cx="290" cy="92" r="18" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <line x1="294.5" y1="96.5" x2="302.6" y2="104.6" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
