<svg xmlns="http://www.w3.org/2000/svg" width="660" height="275" viewBox="0 0 660 275">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="330" y="28" class="title">切片的两种常用做法</text>
  <rect x="15" y="45" width="300" height="215" rx="8" class="frame"/>
  <text x="25" y="63" class="b">相邻切片保留重叠</text>
  <rect x="80" y="127" width="160" height="40" fill="#E6E3FA" opacity="0.6" stroke="#B8B0DE"/>
  <text x="85" y="80" class="sub">……</text>
  <text x="85" y="101" class="sub">年假按自然年计算，</text>
  <text x="85" y="122" class="sub">工作满 1 年不满 10 年的，</text>
  <text x="85" y="143" class="sub">每年 5 天。</text>
  <text x="85" y="164" class="sub">年假可以分段使用，</text>
  <text x="85" y="185" class="sub">当年未休完的，</text>
  <text x="85" y="206" class="sub">可以延至次年 3 月底前。</text>
  <path d="M70,90 L62,90 L62,166 L70,166" class="line"/>
  <text x="56" y="132" class="e sub">切片 1</text>
  <path d="M250,128 L258,128 L258,210 L250,210" class="line"/>
  <text x="264" y="173" class="sub">切片 2</text>
  <text x="165" y="243" class="c sub">重叠部分同时出现在两个切片中</text>
  <rect x="335" y="45" width="310" height="215" rx="8" class="frame"/>
  <text x="345" y="63" class="b">父子切片</text>
  <rect x="355" y="80" width="160" height="140" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="365" y="98" class="b">父切片：完整的一节</text>
  <rect x="370" y="110" width="130" height="26" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="435" y="127.5" class="c sub">子切片 1</text>
  <rect x="370" y="144" width="130" height="26" rx="3" fill="#E6E3FA" stroke="#BBB"/>
  <text x="435" y="161.5" class="c sub">子切片 2</text>
  <rect x="370" y="178" width="130" height="26" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="435" y="195.5" class="c sub">子切片 3</text>
  <text x="590" y="150" class="c sub">用子切片检索</text>
  <text x="590" y="166" class="c b">命中子切片 2</text>
  <line x1="545" y1="158" x2="506" y2="158" class="arrow "/>
  <text x="590" y="200" class="c ok">返回整个父切片</text>
  <text x="590" y="216" class="c sub">给模型完整的上下文</text>
  <line x1="545" y1="205" x2="519" y2="205" class="arrow green"/>
</svg>
