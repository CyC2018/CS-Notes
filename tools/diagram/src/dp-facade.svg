<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" viewBox="0 0 760 222">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">外观的类图（一键看电影）</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="535.5" y="60" width="129" height="82" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="600" y="80" class="c b mono" style="font-size:12px;fill:#3F3F3F">SubSystem</text>
  <line x1="535.5" y1="89" x2="664.5" y2="89" stroke="#7FB2D6"/>
  <text x="544.5" y="104.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ turnOnTV()</text>
  <text x="544.5" y="119.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ setCD(String)</text>
  <text x="544.5" y="134.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ startWatching()</text>
  <rect x="259.5" y="63.5" width="161" height="75" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="340" y="83.5" class="c b mono" style="font-size:12px;fill:#3F3F3F">Facade</text>
  <line x1="259.5" y1="92.5" x2="420.5" y2="92.5" stroke="#7FB2D6"/>
  <text x="268.5" y="108" class="mono" style="font-size:10.5px;fill:#3F3F3F">- subSystem: SubSystem</text>
  <line x1="259.5" y1="115.5" x2="420.5" y2="115.5" stroke="#7FB2D6"/>
  <text x="268.5" y="131" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ watchMovie()</text>
  <path d="M420.5,101 L535.5,101" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="478" y="95" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">subSystem</text>
  <rect x="42" y="86" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="90" y="106" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M138,100.5 L259.5,101" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="198.75" y="95" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">watchMovie()</text>
  <line x1="30" y1="176" x2="64" y2="176" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="72" y="180" class="sub">关联（字段）</text>
  <line x1="160" y1="176" x2="194" y2="176" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="202" y="180" class="sub">依赖（创建、调用）</text>
  <rect x="323" y="169" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="347" y="180" class="sub">类</text>
  <rect x="376" y="169" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="400" y="180" class="sub">客户端</text>
  <text x="455" y="180" class="sub">+ public，- private</text>
  <text x="30" y="202" class="sub" style="fill:#3F3F3F">Client 只调用 facade.watchMovie()，由 Facade 依次调用子系统的 turnOnTV()、setCD("a movie") 和 startWatching()。</text>
</svg>
