<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">漏桶与令牌桶</text>
  <rect x="20" y="45" width="290" height="240" rx="8" class="frame"/>
  <text x="30" y="63" class="b">漏桶</text>
  <line x1="95" y1="80" x2="95" y2="108" class="arrow "/>
  <line x1="125" y1="80" x2="125" y2="108" class="arrow "/>
  <line x1="155" y1="80" x2="155" y2="108" class="arrow "/>
  <line x1="185" y1="80" x2="185" y2="108" class="arrow "/>
  <text x="140" y="75" class="c sub">请求</text>
  <path d="M90,110 L102,210 L188,210 L200,110" class="line"/>
  <rect x="104" y="185" width="82" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="104" y="163" width="82" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="104" y="141" width="82" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="104" y="119" width="82" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="82" y="170" class="e sub">排队</text>
  <line x1="205" y1="116" x2="250" y2="116" class="arrow red"/>
  <text x="255" y="120" class="note">桶满丢弃</text>
  <line x1="145" y1="212" x2="145" y2="250" class="arrow "/>
  <text x="155" y="240" class="ok">固定速率处理</text>
  <rect x="330" y="45" width="290" height="240" rx="8" class="frame"/>
  <text x="340" y="63" class="b">令牌桶</text>
  <line x1="430" y1="80" x2="430" y2="108" class="arrow "/>
  <text x="440" y="92" class="sub">固定速率放入令牌</text>
  <path d="M380,110 L392,210 L478,210 L490,110" class="line"/>
  <circle cx="410" cy="195" r="9" fill="#E6E3FA" stroke="#9F94D5"/>
  <circle cx="435" cy="195" r="9" fill="#E6E3FA" stroke="#9F94D5"/>
  <circle cx="460" cy="195" r="9" fill="#E6E3FA" stroke="#9F94D5"/>
  <circle cx="422" cy="175" r="9" fill="#E6E3FA" stroke="#9F94D5"/>
  <circle cx="448" cy="175" r="9" fill="#E6E3FA" stroke="#9F94D5"/>
  <text x="435" y="140" class="c sub">桶满后不再放入</text>
  <rect x="510" y="140" width="80" height="30" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="550" y="159.5" class="b c">请求</text>
  <line x1="507" y1="165" x2="470" y2="190" class="arrow "/>
  <text x="500" y="196" class="sub">取走令牌</text>
  <line x1="550" y1="173" x2="550" y2="245" class="arrow green"/>
  <text x="550" y="262" class="c ok">有令牌：处理</text>
  <text x="550" y="278" class="c note">没有令牌：拒绝</text>
  <text x="435" y="238" class="c sub">积累的令牌允许突发流量</text>
</svg>
