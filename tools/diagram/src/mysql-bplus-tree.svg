  <text x="660" y="248" class="c sub mono" style="fill:#444">70</text>
  <rect x="680" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="700" y="248" class="c sub mono" style="fill:#444">85</text>
  <text x="680" y="278" class="c sub" style="font-size:10px">整行数据</text>
  <line x1="180" y1="168" x2="80" y2="228" class="arrow "/>
  <line x1="197" y1="168" x2="200" y2="228" class="arrow "/>
  <line x1="214" y1="168" x2="320" y2="228" class="arrow green"/>
  <line x1="512" y1="168" x2="440" y2="228" class="arrow "/>
  <line x1="529" y1="168" x2="560" y2="228" class="arrow "/>
  <line x1="546" y1="168" x2="680" y2="228" class="arrow "/>
  <text x="30" y="316" class="sub ok">查找 id = 33（绿色路径）：33 &lt; 40 走左边，28 ≤ 33 走第三个指针，再在叶子中二分查找。</text>
  <text x="30" y="336" class="sub">范围查询 id BETWEEN 22 AND 47：先找到 22 所在的叶子，再沿着叶子之间的指针向右扫描，不需要回到上层。</text>
  <text x="30" y="356" class="sub">示意：每个节点实际是一个 16 KB 的页，能放几百上千个 key，所以几百万行的表也只有 3 层左右。</text>
</svg>
