  <line x1="372" y1="88" x2="214" y2="138" class="arrow green"/>
  <line x1="392" y1="88" x2="546" y2="138" class="arrow "/>
  <rect x="40" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="60" y="248" class="c sub mono" style="fill:#444">5</text>
  <rect x="80" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="100" y="248" class="c sub mono" style="fill:#444">10</text>
  <text x="80" y="278" class="c sub" style="font-size:10px">整行数据</text>
  <line x1="122" y1="240" x2="158" y2="240" class="arrow"/>
  <line x1="158" y1="250" x2="122" y2="250" class="arrow"/>
  <rect x="160" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="180" y="248" class="c sub mono" style="fill:#444">15</text>
  <rect x="200" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="220" y="248" class="c sub mono" style="fill:#444">22</text>
  <text x="200" y="278" class="c sub" style="font-size:10px">整行数据</text>
  <line x1="242" y1="240" x2="278" y2="240" class="arrow"/>
  <line x1="278" y1="250" x2="242" y2="250" class="arrow"/>
  <rect x="280" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="300" y="248" class="c sub mono" style="fill:#444">28</text>
