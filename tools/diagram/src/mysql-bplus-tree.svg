  <text x="340" y="248" class="c sub mono" style="fill:#444">33</text>
  <text x="320" y="278" class="c sub" style="font-size:10px">整行数据</text>
  <line x1="362" y1="240" x2="398" y2="240" class="arrow"/>
  <line x1="398" y1="250" x2="362" y2="250" class="arrow"/>
  <rect x="400" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="420" y="248" class="c sub mono" style="fill:#444">40</text>
  <rect x="440" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="460" y="248" class="c sub mono" style="fill:#444">47</text>
  <text x="440" y="278" class="c sub" style="font-size:10px">整行数据</text>
  <line x1="482" y1="240" x2="518" y2="240" class="arrow"/>
  <line x1="518" y1="250" x2="482" y2="250" class="arrow"/>
  <rect x="520" y="230" width="40" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
