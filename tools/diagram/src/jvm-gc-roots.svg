<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">可达性分析：从 GC Roots 出发找不到的对象可以回收</text>
  <rect x="30" y="60" width="200" height="40" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="130" y="84.5" class="b c">GC Roots</text>
  <rect x="30" y="120" width="200" height="34" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="130" y="141.5" class="c sub">栈中的局部变量 order</text>
  <rect x="30" y="164" width="200" height="34" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="130" y="185.5" class="c sub">静态变量 Cache.MAP</text>
  <line x1="30" y1="110" x2="230" y2="110" stroke="#DDD"/>
  <rect x="330" y="120" width="120" height="34" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="390" y="141.5" class="c sub mono b">Order</text>
  <rect x="510" y="100" width="120" height="34" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="570" y="121.5" class="c sub mono b">Item</text>
  <rect x="510" y="160" width="120" height="34" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="570" y="181.5" class="c sub mono b">Address</text>
  <rect x="330" y="190" width="120" height="34" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="390" y="211.5" class="c sub mono b">HashMap</text>
  <rect x="420" y="262" width="120" height="34" rx="6" fill="#F3C6C2" stroke="#BBBBBB"/>
  <text x="480" y="283.5" class="c sub mono b">Test（原 a）</text>
  <rect x="600" y="262" width="120" height="34" rx="6" fill="#F3C6C2" stroke="#BBBBBB"/>
  <text x="660" y="283.5" class="c sub mono b">Test（原 b）</text>
  <line x1="232" y1="137" x2="328" y2="137" class="arrow "/>
  <line x1="232" y1="181" x2="328" y2="203" class="arrow "/>
  <line x1="452" y1="130" x2="508" y2="117" class="arrow "/>
  <line x1="452" y1="144" x2="508" y2="172" class="arrow "/>
  <line x1="542" y1="279" x2="598" y2="279" class="arrow "/>
  <line x1="598" y1="285" x2="542" y2="285" class="arrow "/>
  <text x="660" y="120" class="c sub ok b">可达，存活</text>
  <text x="510" y="316" class="c sub note">互相引用，但从 GC Roots 不可达，可以回收</text>
  <text x="30" y="236" class="sub">a、b 设为 null 之后，两个 Test 对象</text>
  <text x="30" y="254" class="sub">的引用计数都不为 0；在 JDK 21 上执行</text>
  <text x="30" y="272" class="sub">System.gc() 后，指向它们的弱引用</text>
  <text x="30" y="290" class="sub">都变为 null，说明已经被回收。</text>
</svg>
