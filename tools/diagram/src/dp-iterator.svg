<svg xmlns="http://www.w3.org/2000/svg" width="760" height="399" viewBox="0 0 760 399">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">迭代器的类图</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="20" y="60" width="199" height="64" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="119.5" y="77" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="119.5" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F">Aggregate</text>
  <line x1="20" y1="101" x2="219" y2="101" stroke="#B8B0DE"/>
  <text x="29" y="116.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ createIterator(): Iterator</text>
  <rect x="573" y="60" width="148" height="79" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="647" y="77" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="647" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F">Iterator&lt;Item&gt;</text>
  <line x1="573" y1="101" x2="721" y2="101" stroke="#B8B0DE"/>
  <text x="582" y="116.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ next(): Item</text>
  <text x="582" y="131.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ hasNext(): boolean</text>
  <rect x="362" y="86" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="410" y="106" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M362,100.5 L219,101" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="290.5" y="95" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">createIterator()</text>
  <path d="M458,100.5 L573,101" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="515.5" y="95" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">hasNext()、next()</text>
  <rect x="20" y="199" width="199" height="90" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="119.5" y="219" class="c b mono" style="font-size:12px;fill:#3F3F3F">ConcreteAggregate</text>
  <line x1="20" y1="228" x2="219" y2="228" stroke="#7FB2D6"/>
  <text x="29" y="243.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- items: Integer[]</text>
  <line x1="20" y1="251" x2="219" y2="251" stroke="#7FB2D6"/>
  <text x="29" y="266.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ ConcreteAggregate()</text>
  <text x="29" y="281.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ createIterator(): Iterator</text>
  <rect x="554" y="199" width="186" height="120" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="647" y="219" class="c b mono" style="font-size:12px;fill:#3F3F3F">ConcreteIterator&lt;Item&gt;</text>
  <line x1="554" y1="228" x2="740" y2="228" stroke="#7FB2D6"/>
  <text x="563" y="243.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- items: Item[]</text>
  <text x="563" y="258.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- position: int</text>
  <line x1="554" y1="266" x2="740" y2="266" stroke="#7FB2D6"/>
  <text x="563" y="281.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ ConcreteIterator(Item[])</text>
  <text x="563" y="296.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ next(): Object</text>
  <text x="563" y="311.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ hasNext(): boolean</text>
  <path d="M119.5,199 L119.5,125" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M647,199 L647,140" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M219,244 L554,244" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="386.5" y="238" class="c sub" style="font-size:10.5px">创建，传入 items</text>
  <line x1="30" y1="353" x2="64" y2="353" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="72" y="357" class="sub">实现</text>
  <line x1="116" y1="353" x2="150" y2="353" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="158" y="357" class="sub">依赖（创建、调用）</text>
  <rect x="279" y="346" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="303" y="357" class="sub">接口</text>
  <rect x="343" y="346" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="367" y="357" class="sub">类</text>
  <rect x="396" y="346" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="420" y="357" class="sub">客户端</text>
  <text x="475" y="357" class="sub">+ public，- private</text>
  <text x="30" y="379" class="sub" style="fill:#3F3F3F">Client 只认 Aggregate 和 Iterator 两个接口，不知道元素存放在 Integer 数组中；示例依次输出 0 到 9。</text>
</svg>
