<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">事务：要么全部提交，要么全部回滚</text>
  <text x="30" y="64" class="sub">从 A 账户向 B 账户转账 30 元</text>
  <rect x="30" y="84" width="140" height="58" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="100" y="102" class="c sub b">一致的状态</text>
  <text x="100" y="120" class="c sub mono">A = 100</text>
  <text x="100" y="136" class="c sub mono">B = 0</text>
  <rect x="220" y="84" width="140" height="58" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="290" y="102" class="c sub b">中间状态</text>
  <text x="290" y="120" class="c sub mono">A = 70</text>
  <text x="290" y="136" class="c sub mono">B = 0</text>
  <rect x="410" y="84" width="140" height="58" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="480" y="102" class="c sub b">中间状态</text>
  <text x="480" y="120" class="c sub mono">A = 70</text>
  <text x="480" y="136" class="c sub mono">B = 30</text>
  <rect x="600" y="84" width="140" height="58" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="670" y="102" class="c sub b">一致的状态</text>
  <text x="670" y="120" class="c sub mono">A = 70</text>
  <text x="670" y="136" class="c sub mono">B = 30</text>
  <line x1="172" y1="116" x2="216" y2="116" class="arrow "/>
  <text x="196" y="106" class="c sub mono" style="font-size:10px">A − 30</text>
  <line x1="362" y1="116" x2="406" y2="116" class="arrow "/>
  <text x="386" y="106" class="c sub mono" style="font-size:10px">B + 30</text>
  <line x1="552" y1="116" x2="596" y2="116" class="arrow "/>
  <text x="576" y="106" class="c sub mono" style="font-size:10px">COMMIT</text>
  <path d="M290,144 V186 H100 V148" class="arrow red dash"/>
  <path d="M480,144 V186 H100 V148" class="arrow red dash"/>
  <text x="250" y="206" class="sub note">出错或执行 ROLLBACK：用 undo log 撤销已做的修改，回到初始状态</text>
  <text x="30" y="254" class="sub">在提交读及以上的隔离级别下，中间状态只有当前事务看得到；提交后修改才对其它事务可见，并由 redo log 保证不会丢失。</text>
  <text x="30" y="274" class="sub">A、B 两个账户的余额总和在事务前后都是 100，这就是一致性。</text>
</svg>
