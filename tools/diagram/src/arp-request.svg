<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">ARP：A 查询 192.168.1.20 的 MAC 地址</text>
  <line x1="40" y1="196" x2="720" y2="196" stroke="#999" stroke-width="3" stroke-linecap="round"/>
  <rect x="60" y="128" width="40" height="27.2" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <rect x="64" y="132" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7DBCB7" stroke-width="0.8"/>
  <path d="M76,155.2 v5 M84,155.2 v5" stroke="#7DBCB7" stroke-width="1.4"/>
  <rect x="68" y="160.2" width="24" height="3.5" rx="1.5" fill="#7DBCB7"/>
  <line x1="80" y1="165" x2="80" y2="196" class="line"/>
  <text x="106" y="140" class="b">A</text>
  <text x="106" y="156" class="sub mono">192.168.1.10</text>
  <rect x="240" y="128" width="40" height="27.2" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="244" y="132" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M256,155.2 v5 M264,155.2 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="248" y="160.2" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <line x1="260" y1="165" x2="260" y2="196" class="line"/>
  <text x="286" y="140" class="b">B</text>
  <text x="286" y="156" class="sub mono">192.168.1.20</text>
  <rect x="420" y="128" width="40" height="27.2" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="424" y="132" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M436,155.2 v5 M444,155.2 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="428" y="160.2" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <line x1="440" y1="165" x2="440" y2="196" class="line"/>
  <text x="466" y="140" class="b">C</text>
  <text x="466" y="156" class="sub mono">192.168.1.30</text>
  <rect x="600" y="128" width="40" height="27.2" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="604" y="132" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M616,155.2 v5 M624,155.2 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="608" y="160.2" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <line x1="620" y1="165" x2="620" y2="196" class="line"/>
  <text x="646" y="140" class="b">D</text>
  <text x="646" y="156" class="sub mono">192.168.1.40</text>
  <path d="M36,52 h288 q6,0 6,6 v40 q0,6 -6,6 H48 l-8,8 l0,-8 H36 q-6,0 -6,-6 v-40 q0,-6 6,-6 z" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <text x="42" y="72" class="sub" style="fill:#555">① 广播 ARP 请求，目的 MAC ff:ff:ff:ff:ff:ff</text>
  <text x="42" y="90" class="sub" style="fill:#555">“谁是 192.168.1.20？请告诉 192.168.1.10”</text>
  <line x1="100" y1="188" x2="250" y2="188" class="arrow "/>
  <line x1="100" y1="188" x2="430" y2="188" class="arrow "/>
  <line x1="100" y1="188" x2="610" y2="188" class="arrow "/>
  <text x="440" y="230" class="c sub">不是自己的 IP，丢弃</text>
  <text x="620" y="230" class="c sub">丢弃</text>
  <path d="M260,204 C260,262 110,262 86,206" class="arrow green"/>
  <text x="40" y="284" class="sub ok">② B 单播 ARP 响应：192.168.1.20 的 MAC 是 52:54:00:aa:00:20</text>
  <rect x="40" y="300" width="330" height="50" rx="5" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <rect x="40" y="300" width="330" height="22" rx="5" fill="#7DBCB7" opacity="0.35"/>
  <text x="205" y="315" class="c b">③ A 的 ARP 缓存</text>
  <rect x="46" y="328" width="318" height="16" rx="3" fill="#E6E3FA" stroke="#7DBCB7" stroke-width="0.6"/>
  <text x="52" y="340" class="sub mono">192.168.1.20 → 52:54:00:aa:00:20</text>
  <text x="400" y="322" class="sub">A 之后发给 192.168.1.20 的帧，</text>
  <text x="400" y="340" class="sub">直接使用缓存中的 MAC 地址；</text>
  <text x="400" y="358" class="sub">B 收到请求时也顺便记下 A 的映射。</text>
  <text x="400" y="384" class="sub">缓存项有过期时间，过期后重新查询。</text>
</svg>
