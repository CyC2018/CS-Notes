<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">服务端推送：请求页面时一起发送样式</text>
  <rect x="80" y="46" width="140" height="32" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="150" y="66.5" class="c sub b">浏览器</text>
  <line x1="150" y1="80" x2="150" y2="230" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="500" y="46" width="140" height="32" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="570" y="66.5" class="c sub b">服务器</text>
  <line x1="570" y1="80" x2="570" y2="230" stroke="#BBB" stroke-dasharray="4 4"/>
  <line x1="150" y1="100" x2="570" y2="100" class="arrow "/>
  <text x="360" y="94" class="c sub mono" style="fill:#444">stream 1：GET /page.html</text>
  <line x1="570" y1="134" x2="150" y2="134" class="arrow dash"/>
  <text x="360" y="128" class="c sub mono" style="fill:#444">stream 1：PUSH_PROMISE /style.css</text>
  <line x1="570" y1="166" x2="150" y2="166" class="arrow dash"/>
  <text x="360" y="160" class="c sub mono" style="fill:#444">stream 1：page.html 的内容</text>
  <line x1="570" y1="198" x2="150" y2="198" class="arrow dash"/>
  <text x="360" y="192" class="c sub mono" style="fill:#444">stream 2：style.css 的内容</text>
  <text x="30" y="250" class="sub">服务器推送的流 ID 为偶数。浏览器解析到 style.css 时它已经在缓存里，省去一次请求的往返。</text>
</svg>
