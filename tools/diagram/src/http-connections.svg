<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">短连接、长连接与流水线：请求 3 个资源</text>
  <text x="108" y="90" class="sub b e" style="fill:#444">短连接</text>
  <rect x="122" y="70" width="86" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="165" y="90" class="c sub" style="fill:#444">握手</text>
  <rect x="212" y="70" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="255" y="90" class="c sub" style="fill:#444">请求 1</text>
  <rect x="302" y="70" width="86" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="345" y="90" class="c sub" style="fill:#444">握手</text>
  <rect x="392" y="70" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="435" y="90" class="c sub" style="fill:#444">请求 2</text>
  <rect x="482" y="70" width="86" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="525" y="90" class="c sub" style="fill:#444">握手</text>
  <rect x="572" y="70" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="615" y="90" class="c sub" style="fill:#444">请求 3</text>
  <text x="672" y="90" class="sub b" style="fill:#444">6 个 RTT</text>
  <text x="108" y="156" class="sub b e" style="fill:#444">长连接</text>
  <rect x="122" y="136" width="86" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="165" y="156" class="c sub" style="fill:#444">握手</text>
  <rect x="212" y="136" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="255" y="156" class="c sub" style="fill:#444">请求 1</text>
  <rect x="302" y="136" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="345" y="156" class="c sub" style="fill:#444">请求 2</text>
  <rect x="392" y="136" width="86" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="435" y="156" class="c sub" style="fill:#444">请求 3</text>
  <text x="672" y="156" class="sub b" style="fill:#444">4 个 RTT</text>
  <text x="108" y="222" class="sub b e" style="fill:#444">流水线</text>
  <rect x="122" y="202" width="86" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="165" y="222" class="c sub" style="fill:#444">握手</text>
  <rect x="212" y="202" width="113" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="268.5" y="222" class="c sub" style="fill:#444">请求 1、2、3 连续发出</text>
  <text x="672" y="222" class="sub b" style="fill:#444">约 2 个 RTT</text>
  <text x="120" y="280" class="c sub mono">0</text>
  <text x="210" y="280" class="c sub mono">1</text>
  <text x="300" y="280" class="c sub mono">2</text>
  <text x="390" y="280" class="c sub mono">3</text>
  <text x="480" y="280" class="c sub mono">4</text>
  <text x="570" y="280" class="c sub mono">5</text>
  <text x="660" y="280" class="c sub mono">6</text>
  <line x1="120" y1="268" x2="660" y2="268" class="line"/>
  <text x="660" y="298" class="c sub">RTT</text>
  <text x="30" y="316" class="sub">灰色是 TCP 三次握手，每段约 1 个 RTT。HTTP/1.1 默认使用长连接；流水线中响应仍需按顺序返回，前一个慢了会阻塞后面的。</text>
</svg>
