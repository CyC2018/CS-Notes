<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">CyclicBarrier：线程到齐后一起继续，然后自动开始下一轮</text>
  <text x="24" y="114" class="sub mono b">thread-0</text>
  <line x1="100" y1="110" x2="730" y2="110" stroke="#E2E2E2"/>
  <text x="24" y="164" class="sub mono b">thread-1</text>
  <line x1="100" y1="160" x2="730" y2="160" stroke="#E2E2E2"/>
  <text x="24" y="214" class="sub mono b">thread-2</text>
  <line x1="100" y1="210" x2="730" y2="210" stroke="#E2E2E2"/>
  <rect x="110" y="101" width="120" height="18" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="170" y="114" class="c sub" style="font-size:10.5px">第 1 轮</text>
  <rect x="230" y="101" width="120" height="18" rx="4" fill="#FFFFFF" stroke="#7FB2D6" stroke-dasharray="4 3"/>
  <text x="290" y="114" class="c sub" style="font-size:10.5px">await()</text>
  <rect x="354" y="101" width="120" height="18" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="414" y="114" class="c sub" style="font-size:10.5px">第 2 轮</text>
  <rect x="474" y="101" width="120" height="18" rx="4" fill="#FFFFFF" stroke="#7DBCB7" stroke-dasharray="4 3"/>
  <text x="534" y="114" class="c sub" style="font-size:10.5px">await()</text>
  <rect x="110" y="151" width="180" height="18" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="200" y="164" class="c sub" style="font-size:10.5px">第 1 轮</text>
  <rect x="290" y="151" width="60" height="18" rx="4" fill="#FFFFFF" stroke="#7FB2D6" stroke-dasharray="4 3"/>
  <text x="320" y="164" class="c sub" style="font-size:10.5px">await()</text>
  <rect x="354" y="151" width="180" height="18" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="444" y="164" class="c sub" style="font-size:10.5px">第 2 轮</text>
  <rect x="534" y="151" width="60" height="18" rx="4" fill="#FFFFFF" stroke="#7DBCB7" stroke-dasharray="4 3"/>
  <text x="564" y="164" class="c sub" style="font-size:10.5px">await()</text>
  <rect x="110" y="201" width="240" height="18" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="230" y="214" class="c sub" style="font-size:10.5px">第 1 轮</text>
  <rect x="354" y="201" width="240" height="18" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="474" y="214" class="c sub" style="font-size:10.5px">第 2 轮</text>
  <line x1="350" y1="80" x2="350" y2="232" stroke="#766AA8" stroke-width="2"/>
  <text x="350" y="74" class="c sub b" style="fill:#766AA8">屏障打开</text>
  <text x="350" y="250" class="c sub">执行 barrierAction</text>
  <line x1="594" y1="80" x2="594" y2="232" stroke="#766AA8" stroke-width="2"/>
  <text x="594" y="74" class="c sub b" style="fill:#766AA8">再次打开</text>
  <text x="594" y="250" class="c sub">执行 barrierAction</text>
  <text x="24" y="286" class="sub">new CyclicBarrier(3, barrierAction)：先到的线程在 await() 处等待，第 3 个线程到达时屏障打开；</text>
  <text x="24" y="304" class="sub">计数随即恢复为 3，同一个对象可以用于下一轮。在 JDK 21 上运行两轮，barrierAction 各执行了一次。</text>
</svg>
