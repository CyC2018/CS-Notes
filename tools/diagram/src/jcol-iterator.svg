<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">迭代器模式：Collection 继承 Iterable，可以产生 Iterator</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="424.0" y="51.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="480" y="66" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="480" y="81" class="c sub b mono" style="fill:#3F3F3F">Iterable</text>
  <rect x="84.0" y="51.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="140" y="66" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="140" y="81" class="c sub b mono" style="fill:#3F3F3F">Iterator</text>
  <rect x="424.0" y="141.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="480" y="156" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="480" y="171" class="c sub b mono" style="fill:#3F3F3F">Collection</text>
  <rect x="304.0" y="231.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="360" y="246" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="360" y="261" class="c sub b mono" style="fill:#3F3F3F">List</text>
  <rect x="444.0" y="231.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="500" y="246" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="500" y="261" class="c sub b mono" style="fill:#3F3F3F">Set</text>
  <rect x="584.0" y="231.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="640" y="246" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="640" y="261" class="c sub b mono" style="fill:#3F3F3F">Queue</text>
  <rect x="84.0" y="231.0" width="112" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="140" y="246" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="140" y="261" class="c sub b mono" style="fill:#3F3F3F">ListIterator</text>
  <path d="M480,141.0 L480,90.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M360,231.0 L480,180.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M500,231.0 L480,180.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M640,231.0 L480,180.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M140,231.0 L140,90.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <line x1="422" y1="70" x2="200" y2="70" class="arrow dash"/>
  <text x="311" y="62" class="c sub">iterator() 产生</text>
  <line x1="302" y1="250" x2="200" y2="250" class="arrow dash"/>
  <text x="251" y="242" class="c sub">listIterator() 产生</text>
</svg>
