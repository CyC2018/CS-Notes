<svg xmlns="http://www.w3.org/2000/svg" width="600" height="408" viewBox="0 0 600 408">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 13px; }
    .head { font-weight: bold; text-anchor: middle; }
    .msg { text-anchor: middle; font-size: 12px; }
    .note { font-size: 12px; fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .life { stroke: #BBB; stroke-width: 1; stroke-dasharray: 4 4; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .reply { stroke-dasharray: 5 4; }
    .lost { stroke: #C0605A; marker-end: url(#x); }
    .shadow { fill: #C0C0C0; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="300" y="28" class="title">RocketMQ 事务消息</text>
  <line x1="100" y1="76" x2="100" y2="388" class="life"/>
  <line x1="300" y1="76" x2="300" y2="388" class="life"/>
  <line x1="500" y1="76" x2="500" y2="388" class="life"/>
  <rect x="67" y="48" width="72" height="30" rx="6" class="shadow"/>
  <rect x="64" y="45" width="72" height="30" rx="6" fill="#B0E3E6"/>
  <text x="100" y="64.5" class="head">生产者</text>
  <rect x="267" y="48" width="72" height="30" rx="6" class="shadow"/>
  <rect x="264" y="45" width="72" height="30" rx="6" fill="#B1DDF0"/>
  <text x="300" y="64.5" class="head">Broker</text>
  <rect x="467" y="48" width="72" height="30" rx="6" class="shadow"/>
  <rect x="464" y="45" width="72" height="30" rx="6" fill="#B0E3E6"/>
  <text x="500" y="64.5" class="head">消费者</text>
  <line x1="104" y1="100" x2="296" y2="100" class="arrow"/>
  <text x="200" y="94" class="msg">① 发送半消息</text>
  <line x1="296" y1="138" x2="104" y2="138" class="arrow reply"/>
  <text x="200" y="132" class="msg">② 写入成功，消费者不可见</text>
  <text x="110" y="180" class="note" text-anchor="start">③ 执行本地事务</text>
  <line x1="104" y1="214" x2="296" y2="214" class="arrow"/>
  <text x="200" y="208" class="msg">④ 根据事务结果提交或回滚</text>
  <text x="300" y="256" class="note" text-anchor="middle">长时间没有收到 ④ 时：</text>
  <line x1="296" y1="290" x2="104" y2="290" class="arrow reply"/>
  <text x="200" y="284" class="msg">⑤ 回查本地事务状态</text>
  <line x1="104" y1="328" x2="296" y2="328" class="arrow"/>
  <text x="200" y="322" class="msg">⑥ 提交或回滚</text>
  <line x1="304" y1="366" x2="496" y2="366" class="arrow"/>
  <text x="400" y="360" class="msg">⑦ 提交后投递消息</text>
</svg>
