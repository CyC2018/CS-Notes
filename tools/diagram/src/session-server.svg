  <rect x="245" y="148" width="50" height="13" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <circle cx="252" cy="154.5" r="2" fill="#BFBEBA"/>
  <line x1="259" y1="154.5" x2="288" y2="154.5" stroke="#BFBEBA" stroke-width="1"/>
  <text x="270" y="176" class="c sub b">负载均衡器</text>
