  <path d="M615,138 a25,6 0 0 0 50,0" fill="none" stroke="#7DBCB7" stroke-width="1"/>
  <text x="640" y="184" class="c sub b">Redis</text>
  <rect x="580" y="196" width="130" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="645" y="212" class="c sub mono" style="fill:#444">sess:7f3a → alice</text>
  <rect x="580" y="220" width="130" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="645" y="236" class="c sub mono" style="fill:#444">sess:9c1d → bob</text>
  <text x="178" y="96" class="c sub mono" style="font-size:10px">Cookie: SESSIONID=7f3a</text>
  <text x="30" y="266" class="sub">请求带着 SESSIONID，任意一台服务器都到 Redis 中取会话。服务器可以随时增减，Redis 本身需要做主从或集群保证可用。</text>
</svg>
