<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="330" y="28" class="title">MCP 的组成</text>
  <rect x="15" y="50" width="250" height="240" rx="8" class="frame"/>
  <text x="25" y="68" class="b">主机 Host（AI 应用）</text>
  <rect x="47" y="87" width="190" height="40" rx="6" class="shadow"/>
  <rect x="45" y="85" width="190" height="40" rx="6" fill="#B0E3E6"/>
  <text x="140" y="109.5" class="b c">大模型</text>
  <rect x="47" y="167" width="190" height="36" rx="6" class="shadow"/>
  <rect x="45" y="165" width="190" height="36" rx="6" fill="#B1DDF0"/>
  <text x="140" y="187.5" class="b c">客户端 Client A</text>
  <rect x="47" y="237" width="190" height="36" rx="6" class="shadow"/>
  <rect x="45" y="235" width="190" height="36" rx="6" fill="#B1DDF0"/>
  <text x="140" y="257.5" class="b c">客户端 Client B</text>
  <line x1="125" y1="129" x2="125" y2="161" class="arrow"/>
  <line x1="155" y1="161" x2="155" y2="129" class="arrow"/>
  <text x="118" y="149" class="e sub">选择工具</text>
  <text x="162" y="149" class="sub">调用结果</text>
  <rect x="422" y="102" width="220" height="92" rx="6" class="shadow"/>
  <rect x="420" y="100" width="220" height="92" rx="6" fill="#B1DDF0"/>
  <text x="530" y="122" class="c b">服务端 Server：文件系统</text>
  <text x="530" y="142" class="c sub">本地进程</text>
  <text x="530" y="164" class="c sub mono">read_file、write_file、list_dir</text>
  <text x="530" y="181" class="c sub">Tools、Resources、Prompts</text>
  <line x1="238" y1="172" x2="416" y2="135" class="arrow "/>
  <text x="322" y="138" class="c sub">① tools/list 获取工具列表</text>
  <line x1="238" y1="192" x2="416" y2="175" class="arrow "/>
  <text x="330" y="202" class="c sub">② tools/call 调用</text>
  <text x="330" y="168" class="c b">stdio</text>
  <rect x="422" y="232" width="220" height="52" rx="6" class="shadow"/>
  <rect x="420" y="230" width="220" height="52" rx="6" fill="#B1DDF0"/>
  <text x="530" y="254" class="b c">服务端 Server：GitHub</text>
  <text x="530" y="269" class="sub c">远程服务</text>
  <line x1="238" y1="253" x2="416" y2="256" class="arrow "/>
  <text x="327" y="246" class="c b">Streamable HTTP</text>
  <text x="330" y="312" class="c sub">消息使用 JSON-RPC 2.0；一个客户端只连接一个服务端</text>
</svg>
