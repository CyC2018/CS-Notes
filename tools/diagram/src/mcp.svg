  <rect x="420" y="220" width="40" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="427" cy="226.5" r="2" fill="#7FB2D6"/>
  <line x1="434" y1="226.5" x2="453" y2="226.5" stroke="#7FB2D6" stroke-width="1"/>
