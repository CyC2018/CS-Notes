  <line x1="238" y1="194" x2="412" y2="140" class="arrow "/>
  <text x="332" y="184" class="c mono sub">② tools/call</text>
  <text x="332" y="199" class="c sub">name + arguments</text>
  <text x="380" y="108" class="c b">stdio</text>
  <line x1="238" y1="253" x2="412" y2="244" class="arrow "/>
  <text x="325" y="238" class="c b">Streamable HTTP</text>
