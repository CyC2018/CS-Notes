<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="350" y="28" class="title">量化粒度对困惑度的影响（Qwen2.5-7B，越低越好）</text>
  <text x="238" y="80" class="sub e">FP16（不量化）</text>
  <rect x="250" y="66" width="142.423" height="20" rx="2" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="400.423" y="81" class="sub mono">6.23</text>
  <text x="238" y="118" class="sub e">INT8，每个输出通道一个系数</text>
  <rect x="250" y="104" width="142.514" height="20" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="400.514" y="119" class="sub mono">6.24</text>
  <text x="238" y="156" class="sub e">INT4，每 128 个一组</text>
  <rect x="250" y="142" width="148.64" height="20" rx="2" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="406.64" y="157" class="sub mono">6.50</text>
  <text x="238" y="194" class="sub e">INT4，每个输出通道一个系数</text>
  <rect x="250" y="180" width="273.646" height="20" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="531.646" y="195" class="sub mono">11.97</text>
  <text x="238" y="232" class="sub e">INT4，整个矩阵一个系数</text>
  <rect x="250" y="218" width="320" height="20" rx="2" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <line x1="552" y1="215" x2="544" y2="241" stroke="#FFFFFF" stroke-width="4"/>
  <text x="578" y="233" class="sub mono note">82,877，输出乱码</text>
  <text x="40" y="268" class="sub">28 层中的全部线性层量化后立即还原（伪量化），嵌入层和输出层保持 FP16；</text>
  <text x="40" y="286" class="sub">文本为本仓库 MySQL.md 的前 6652 个 Token。INT4 每组用非对称量化（带零点），其余为对称量化。</text>
</svg>
