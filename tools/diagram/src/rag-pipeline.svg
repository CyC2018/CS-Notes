<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="340" y="28" class="title">RAG 的两个阶段</text>
  <rect x="15" y="45" width="650" height="120" rx="8" class="frame"/>
  <text x="25" y="63" class="b">离线：建立索引</text>
  <rect x="30" y="84" width="82" height="50" rx="6" class="shadow"/>
  <rect x="28" y="82" width="82" height="50" rx="6" fill="#B1DDF0"/>
  <text x="69" y="105" class="b c">员工手册</text>
  <text x="69" y="120" class="sub c">PDF、网页</text>
  <line x1="114" y1="107" x2="184" y2="107" class="arrow "/>
  <text x="149" y="98" class="c">解析、切片</text>
  <rect x="190" y="70" width="150" height="22" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="197" y="85" class="sub">第 3 章 年假：工作满 1 年…</text>
  <rect x="190" y="98" width="150" height="22" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="197" y="113" class="sub">第 4 章 病假：需提供…</text>
  <rect x="190" y="126" width="150" height="22" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="197" y="141" class="sub">第 5 章 报销：…</text>
  <line x1="346" y1="107" x2="416" y2="107" class="arrow "/>
  <text x="381" y="98" class="c">Embedding</text>
  <text x="422" y="85" class="mono sub">[0.12, -0.53, …]</text>
  <text x="422" y="113" class="mono sub">[0.80, 0.07, …]</text>
  <text x="422" y="141" class="mono sub">[-0.31, 0.44, …]</text>
  <line x1="533" y1="107" x2="549" y2="107" class="arrow "/>
  <rect x="555" y="84" width="102" height="50" rx="6" class="shadow"/>
  <rect x="553" y="82" width="102" height="50" rx="6" fill="#DDD7F6"/>
  <text x="604" y="105" class="b c">向量数据库</text>
  <text x="604" y="120" class="sub c">并建关键词索引</text>
  <rect x="15" y="180" width="650" height="185" rx="8" class="frame"/>
  <text x="25" y="198" class="b">在线：检索并生成</text>
  <rect x="30" y="222" width="112" height="44" rx="6" class="shadow"/>
  <rect x="28" y="220" width="112" height="44" rx="6" fill="#B0E3E6"/>
  <text x="84" y="240" class="b c">问题</text>
  <text x="84" y="255" class="sub c">工作两年有几天年假？</text>
  <rect x="168" y="222" width="100" height="44" rx="6" class="shadow"/>
  <rect x="166" y="220" width="100" height="44" rx="6" fill="#B1DDF0"/>
  <text x="216" y="240" class="b c">检索</text>
  <text x="216" y="255" class="sub c">召回、重排</text>
  <line x1="143" y1="242" x2="162" y2="242" class="arrow "/>
  <path d="M604,136 C604,190 216,172 216,216" class="arrow dash"/>
  <text x="612" y="160" class="sub">查询</text>
  <rect x="298" y="207" width="224" height="110" rx="4" class="shadow"/>
  <rect x="296" y="205" width="224" height="110" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="306" y="224" class="b">提示词</text>
  <text x="306" y="246" class="sub">根据以下资料回答，并标注来源：</text>
  <text x="306" y="263" class="sub">[1] 第 3 章 年假：工作满 1 年</text>
  <text x="325" y="280" class="sub">不满 10 年的，每年 5 天</text>
  <text x="306" y="297" class="sub">问题：工作两年有几天年假？</text>
  <line x1="269" y1="242" x2="292" y2="242" class="arrow "/>
  <rect x="550" y="222" width="100" height="44" rx="6" class="shadow"/>
  <rect x="548" y="220" width="100" height="44" rx="6" fill="#B0E3E6"/>
  <text x="598" y="246.5" class="b c">大模型</text>
  <line x1="524" y1="242" x2="544" y2="242" class="arrow "/>
  <rect x="540" y="292" width="120" height="44" rx="6" class="shadow"/>
  <rect x="538" y="290" width="120" height="44" rx="6" fill="#DDD7F6"/>
  <text x="598" y="310" class="b c">回答</text>
  <text x="598" y="325" class="sub c">5 天 [1]</text>
  <line x1="598" y1="268" x2="598" y2="286" class="arrow "/>
  <text x="296" y="342" class="sub">资料来自检索，回答附上来源，便于核对</text>
</svg>
