<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">ThreadLocal：值保存在每个线程自己的 ThreadLocalMap 中</text>
  <rect x="30" y="56" width="260" height="136" rx="8" class="frame"/>
  <text x="40" y="74" class="b">Thread1.threadLocals</text>
  <rect x="50" y="88" width="110" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="105" y="105" class="c sub" style="fill:#444">value</text>
  <rect x="50" y="114" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="105" y="133" class="c sub mono" style="fill:#444">1</text>
  <rect x="50" y="144" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="105" y="163" class="c sub mono" style="fill:#444">1</text>
  <rect x="160" y="88" width="110" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="215" y="105" class="c sub" style="fill:#444">key（弱引用）</text>
  <rect x="160" y="114" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="215" y="133" class="c sub mono" style="fill:#444">threadLocal1</text>
  <rect x="160" y="144" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="215" y="163" class="c sub mono" style="fill:#444">threadLocal2</text>
  <rect x="470" y="56" width="260" height="136" rx="8" class="frame"/>
  <text x="480" y="74" class="b">Thread2.threadLocals</text>
  <rect x="490" y="88" width="110" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="545" y="105" class="c sub" style="fill:#444">key（弱引用）</text>
  <rect x="490" y="114" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="545" y="133" class="c sub mono" style="fill:#444">threadLocal1</text>
  <rect x="490" y="144" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="545" y="163" class="c sub mono" style="fill:#444">threadLocal2</text>
  <rect x="600" y="88" width="110" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="655" y="105" class="c sub" style="fill:#444">value</text>
  <rect x="600" y="114" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="655" y="133" class="c sub mono" style="fill:#444">2</text>
  <rect x="600" y="144" width="110" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="655" y="163" class="c sub mono" style="fill:#444">2</text>
  <rect x="320" y="116" width="120" height="26" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="380" y="133.5" class="c sub mono b">threadLocal1</text>
  <line x1="270" y1="129" x2="318" y2="129" class="arrow dash"/>
  <line x1="490" y1="129" x2="442" y2="129" class="arrow dash"/>
  <rect x="320" y="146" width="120" height="26" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="380" y="163.5" class="c sub mono b">threadLocal2</text>
  <line x1="270" y1="159" x2="318" y2="159" class="arrow dash"/>
  <line x1="490" y1="159" x2="442" y2="159" class="arrow dash"/>
  <text x="380" y="100" class="c sub b">ThreadLocal 对象</text>
  <text x="24" y="226" class="sub">每个线程的 Map 以 ThreadLocal 对象为 key：同一个 threadLocal1，在两个线程中取到的值不同。</text>
  <text x="24" y="246" class="sub">Entry 对 key 是弱引用，对 value 是强引用；线程池中的线程一直存活，value 不 remove() 就一直留在 Map 中。</text>
</svg>
