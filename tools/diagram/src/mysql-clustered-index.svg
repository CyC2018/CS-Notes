  <text x="30" y="254" class="sub">InnoDB 的表数据就存放在主键索引中，按主键查询走到叶子节点就拿到了整行；一张表只能有一个聚簇索引。</text>
  <text x="30" y="272" class="sub">示例取自 orders 表的几行，省略了 create_time 等列；没有主键时 InnoDB 用唯一索引或隐藏的行 ID 作为聚簇索引。</text>
