<svg xmlns="http://www.w3.org/2000/svg" width="530" height="262" viewBox="0 0 530 262">
  <style>
    text { font-family: Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #666; font-weight: bold; text-anchor: middle; font-size: 11px; }
    .title { fill: #777; font-size: 17px; }
    .sub { fill: #888; font-size: 10px; }
    .label { fill: #C38F8A; }
    .ok { fill: #6A9F68; }
    .no { fill: #C0605A; }
    .box { fill: #9BC4CB; }
    .shadow { fill: #B8B8B8; }
    .guide { stroke: #999; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5F5F5"/>
  <text x="265" y="30" class="title">ReadView</text>
  <text x="265" y="50" class="sub">CyC</text>

  <!-- 创建 ReadView 时未提交的事务列表 -->
  <text x="262" y="80" class="label">TRX_IDs（创建 ReadView 时未提交的事务）</text>
  <rect x="140" y="88" width="244" height="50" rx="9" fill="#C1D8BF" stroke="#666" stroke-dasharray="3 2"/>
  <rect x="151.5" y="99.5" width="66" height="27" rx="3" class="shadow"/>
  <rect x="150" y="98" width="66" height="27" rx="3" class="box"/>
  <text x="183" y="115.5">TRX_ID_1</text>
  <rect x="230.5" y="99.5" width="66" height="27" rx="3" class="shadow"/>
  <rect x="229" y="98" width="66" height="27" rx="3" class="box"/>
  <text x="262" y="115.5">TRX_ID_2</text>
  <rect x="309.5" y="99.5" width="66" height="27" rx="3" class="shadow"/>
  <rect x="308" y="98" width="66" height="27" rx="3" class="box"/>
  <text x="341" y="115.5">TRX_ID_3</text>

  <!-- 下一个将要分配的事务 ID，不在列表中 -->
  <rect x="405" y="98" width="72" height="27" rx="3" fill="none" stroke="#666" stroke-dasharray="3 2"/>
  <text x="441" y="115.5" class="label">下一个 ID</text>

  <!-- 事务 ID 数轴，分成三个区间 -->
  <line x1="183" y1="125" x2="183" y2="170" class="guide"/>
  <line x1="441" y1="125" x2="441" y2="170" class="guide"/>
  <line x1="40" y1="170" x2="183" y2="170" stroke="#6A9F68" stroke-width="4"/>
  <line x1="183" y1="170" x2="441" y2="170" stroke="#D9B44A" stroke-width="4"/>
  <line x1="441" y1="170" x2="495" y2="170" stroke="#C0605A" stroke-width="4"/>
  <line x1="490" y1="170" x2="506" y2="170" stroke="#666" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="498" y="160" class="sub">事务 ID</text>
  <circle cx="183" cy="170" r="3.5" fill="#666"/>
  <circle cx="441" cy="170" r="3.5" fill="#666"/>
  <text x="183" y="189" class="label">TRX_ID_MIN</text>
  <text x="441" y="189" class="label">TRX_ID_MAX</text>

  <text x="111" y="214" class="ok">可以使用</text>
  <text x="312" y="214">在 TRX_IDs 中则不可使用，</text>
  <text x="312" y="230">否则可以使用</text>
  <text x="468" y="214" class="no">不可使用</text>
</svg>
