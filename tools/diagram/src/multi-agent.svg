<svg xmlns="http://www.w3.org/2000/svg" width="690" height="320" viewBox="0 0 690 320">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="345" y="28" class="title">多 Agent：主从模式</text>
  <rect x="32" y="52" width="630" height="50" rx="6" class="shadow"/>
  <rect x="30" y="50" width="630" height="50" rx="6" fill="#B0E3E6"/>
  <text x="345" y="73" class="b c">主 Agent</text>
  <text x="345" y="88" class="sub c">拆分任务、汇总结果，上下文中只有任务和结论</text>
  <rect x="32" y="162" width="190" height="40" rx="6" class="shadow"/>
  <rect x="30" y="160" width="190" height="40" rx="6" fill="#B1DDF0"/>
  <text x="125" y="184.5" class="b c">子 Agent：调研厂商 A</text>
  <rect x="30" y="214" width="190" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="40" y="234" class="sub">读取 30 个网页、反复搜索</text>
  <text x="40" y="252" class="sub">自己的上下文用了 8 万 Token</text>
  <line x1="85" y1="104" x2="85" y2="156" class="arrow "/>
  <line x1="165" y1="156" x2="165" y2="104" class="arrow green"/>
  <text x="79" y="134" class="e sub">子任务</text>
  <text x="171" y="134" class="ok">约 1500 Token</text>
  <text x="171" y="150" class="ok">的结论</text>
  <rect x="252" y="162" width="190" height="40" rx="6" class="shadow"/>
  <rect x="250" y="160" width="190" height="40" rx="6" fill="#B1DDF0"/>
  <text x="345" y="184.5" class="b c">子 Agent：调研厂商 B</text>
  <rect x="250" y="214" width="190" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="260" y="234" class="sub">读取 30 个网页、反复搜索</text>
  <text x="260" y="252" class="sub">自己的上下文用了 8 万 Token</text>
  <line x1="305" y1="104" x2="305" y2="156" class="arrow "/>
  <line x1="385" y1="156" x2="385" y2="104" class="arrow green"/>
  <rect x="472" y="162" width="190" height="40" rx="6" class="shadow"/>
  <rect x="470" y="160" width="190" height="40" rx="6" fill="#B1DDF0"/>
  <text x="565" y="184.5" class="b c">子 Agent：调研厂商 C</text>
  <rect x="470" y="214" width="190" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="480" y="234" class="sub">读取 30 个网页、反复搜索</text>
  <text x="480" y="252" class="sub">自己的上下文用了 8 万 Token</text>
  <line x1="525" y1="104" x2="525" y2="156" class="arrow "/>
  <line x1="605" y1="156" x2="605" y2="104" class="arrow green"/>
  <text x="345" y="296" class="c sub">子 Agent 的中间过程不进入主 Agent 的上下文；代价是 Token 消耗成倍增加</text>
</svg>
