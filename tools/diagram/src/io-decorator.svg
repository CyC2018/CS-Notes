<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">装饰者模式：FilterInputStream 持有一个 InputStream，在它外面增加功能</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="220.0" y="51" width="160" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="300" y="74" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">InputStream</text>
  <rect x="10.0" y="141" width="160" height="38" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="90" y="164" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">FileInputStream</text>
  <rect x="220.0" y="141" width="160" height="38" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="300" y="164" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">ByteArrayInputStream</text>
  <rect x="450.0" y="141" width="160" height="38" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="530" y="164" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">FilterInputStream</text>
  <rect x="360.0" y="231" width="160" height="38" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="440" y="254" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">BufferedInputStream</text>
  <rect x="540.0" y="231" width="160" height="38" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="620" y="254" class="c sub b mono" style="font-size:10.5px;fill:#3F3F3F">DataInputStream</text>
  <path d="M90,141.0 L300,90.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M300,141.0 L300,90.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M530,141.0 L300,90.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M440,231.0 L530,180.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M620,231.0 L530,180.0" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M612,152 C700,140 660,58 382,64" class="arrow dash"/>
  <text x="700" y="166" class="c sub">持有一个</text>
  <text x="700" y="182" class="c sub mono" style="font-size:10.5px">InputStream in</text>
  <text x="30" y="300" class="sub">紫色为抽象类。new BufferedInputStream(new FileInputStream(path)) 得到的是两层对象：</text>
  <rect x="30" y="314" width="360" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="42" y="338" class="sub mono" style="font-size:10.5px">BufferedInputStream（8 KB 缓冲）</text>
  <rect x="262" y="320" width="120" height="28" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="322" y="338.5" class="c sub mono">FileInputStream</text>
  <text x="404" y="330" class="sub">read() 先从缓冲区取，缓冲区空了</text>
  <text x="404" y="348" class="sub">才调用内层的 read() 一次读一批。</text>
</svg>
