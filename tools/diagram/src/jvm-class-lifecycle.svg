<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">类的生命周期</text>
  <rect x="30" y="90" width="86" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="73" y="114.5" class="b c">加载</text>
  <line x1="118" y1="110" x2="130" y2="110" class="arrow "/>
  <rect x="132" y="90" width="86" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="175" y="114.5" class="b c">验证</text>
  <line x1="220" y1="110" x2="232" y2="110" class="arrow "/>
  <rect x="234" y="90" width="86" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="277" y="114.5" class="b c">准备</text>
  <line x1="322" y1="110" x2="334" y2="110" class="arrow "/>
  <rect x="336" y="90" width="86" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="379" y="114.5" class="b c">解析</text>
  <line x1="424" y1="110" x2="436" y2="110" class="arrow "/>
  <rect x="438" y="90" width="86" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="481" y="114.5" class="b c">初始化</text>
  <line x1="526" y1="110" x2="538" y2="110" class="arrow "/>
  <rect x="540" y="90" width="86" height="40" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="583" y="114.5" class="b c">使用</text>
  <line x1="628" y1="110" x2="640" y2="110" class="arrow "/>
  <rect x="642" y="90" width="86" height="40" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="685" y="114.5" class="b c">卸载</text>
  <path d="M132,82 v-10 h290 v10" fill="none" stroke="#766AA8"/>
  <text x="277" y="66" class="c sub b" style="fill:#766AA8">连接（Linking）</text>
  <text x="30" y="160" class="sub">加载、验证、准备、初始化、卸载这五个阶段按顺序开始；解析可以推迟到初始化之后，</text>
  <text x="30" y="178" class="sub">在第一次用到某个符号引用时才进行，以支持动态绑定。</text>
</svg>
