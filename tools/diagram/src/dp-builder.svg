<svg xmlns="http://www.w3.org/2000/svg" width="760" height="402" viewBox="0 0 760 402">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">生成器的类图（简易 StringBuilder）</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="60" y="60" width="256" height="135" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="188" y="80" class="c b mono" style="font-size:12px;fill:#3F3F3F">AbstractStringBuilder</text>
  <line x1="60" y1="89" x2="316" y2="89" stroke="#7FB2D6"/>
  <text x="69" y="104.5" class="mono" style="font-size:10.5px;fill:#3F3F3F"># value: char[]</text>
  <text x="69" y="119.5" class="mono" style="font-size:10.5px;fill:#3F3F3F"># count: int</text>
  <line x1="60" y1="127" x2="316" y2="127" stroke="#7FB2D6"/>
  <text x="69" y="142.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ AbstractStringBuilder(int)</text>
  <text x="69" y="157.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ append(char): AbstractStringBuilder</text>
  <text x="69" y="172.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- ensureCapacityInternal(int)</text>
  <text x="69" y="187.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ expandCapacity(int)</text>
  <rect x="114" y="255" width="148" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="188" y="275" class="c b mono" style="font-size:12px;fill:#3F3F3F">StringBuilder</text>
  <line x1="114" y1="284" x2="262" y2="284" stroke="#7FB2D6"/>
  <text x="123" y="299.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ StringBuilder()</text>
  <text x="123" y="314.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ toString(): String</text>
  <path d="M188,255 L188,196" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <rect x="552" y="274" width="96" height="29" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="600" y="294" class="c b mono" style="font-size:12px;fill:#3F3F3F">String</text>
  <path d="M262,288.5 L552,288.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="407" y="282.5" class="c sub" style="font-size:10.5px">toString() 创建</text>
  <rect x="552" y="100" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="600" y="120" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M552,114.5 L316,114.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="434" y="108.5" class="c sub" style="font-size:10.5px">append() 26 次</text>
  <path d="M600,129 L600,235 L232,235 L232,255" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="608" y="182" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">new</text>
  <line x1="30" y1="356" x2="64" y2="356" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <text x="72" y="360" class="sub">继承</text>
  <line x1="116" y1="356" x2="150" y2="356" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="158" y="360" class="sub">依赖（创建、调用）</text>
  <rect x="279" y="349" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="303" y="360" class="sub">类</text>
  <rect x="332" y="349" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="356" y="360" class="sub">客户端</text>
  <text x="411" y="360" class="sub">+ public，- private，# protected，~ 包访问权限</text>
  <text x="30" y="382" class="sub" style="fill:#3F3F3F">append() 把字符写入 value 并返回 this，容量不够时扩容；toString() 用 value 中的 count 个字符生成最终的产品 String。</text>
</svg>
