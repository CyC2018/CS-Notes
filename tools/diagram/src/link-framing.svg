<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">封装成帧：在 IP 数据报前后加上首部和尾部</text>
  <text x="30" y="82" class="b">网络层交下来</text>
  <text x="30" y="98" class="b">的 IP 数据报</text>
  <rect x="240" y="66" width="340" height="36" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="410" y="88" class="c sub" style="fill:#444">IP 数据报（不超过 MTU，以太网为 1500 字节）</text>
  <path d="M240,104 L240,124" class="line dash"/>
  <path d="M580,104 L580,124" class="line dash"/>
  <text x="30" y="150" class="b">链路层的帧</text>
  <rect x="140" y="126" width="100" height="36" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="190" y="148" class="c sub b" style="fill:#444">帧首部</text>
  <rect x="240" y="126" width="340" height="36" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="410" y="148" class="c sub" style="fill:#444">数据部分</text>
  <rect x="580" y="126" width="100" height="36" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="630" y="148" class="c sub b" style="fill:#444">帧尾部</text>
  <text x="190" y="180" class="c sub">含帧开始符 SOH</text>
  <text x="630" y="180" class="c sub">含 FCS 和帧结束符 EOT</text>
  <text x="30" y="238" class="b">链路上的字节流</text>
  <text x="134" y="240" class="c sub">…</text>
  <rect x="150" y="220" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="167" y="239" class="c sub mono" style="fill:#444">01</text>
  <rect x="184" y="220" width="150" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="259" y="239" class="c sub" style="fill:#444">第 1 帧的数据</text>
  <rect x="334" y="220" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="351" y="239" class="c sub mono" style="fill:#444">04</text>
  <text x="386" y="240" class="c sub">空闲</text>
  <rect x="404" y="220" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="421" y="239" class="c sub mono" style="fill:#444">01</text>
  <rect x="438" y="220" width="150" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="513" y="239" class="c sub" style="fill:#444">第 2 帧的数据</text>
  <rect x="588" y="220" width="34" height="30" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="605" y="239" class="c sub mono" style="fill:#444">04</text>
  <text x="636" y="240" class="c sub">…</text>
  <text x="30" y="280" class="sub">接收端看到 SOH（0x01）就知道一帧开始，看到 EOT（0x04）就知道这一帧结束，从而在连续的字节流中把帧一个个分开。</text>
</svg>
