<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">本地方法：通过 JNI 调用 C/C++ 实现的方法</text>
  <rect x="40" y="70" width="220" height="70" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="150" y="103" class="b c">Java 代码</text>
  <text x="150" y="118" class="sub c">System.currentTimeMillis()</text>
  <rect x="320" y="80" width="120" height="50" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="380" y="109.5" class="b c">JNI</text>
  <rect x="500" y="70" width="220" height="70" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="610" y="103" class="b c">本地代码（C/C++）</text>
  <text x="610" y="118" class="sub c">调用操作系统获取当前时间</text>
  <line x1="262" y1="105" x2="318" y2="105" class="arrow "/>
  <line x1="442" y1="105" x2="498" y2="105" class="arrow "/>
  <text x="150" y="166" class="c sub">在 Java 虚拟机栈中执行</text>
  <text x="610" y="166" class="c sub">在本地方法栈中执行</text>
  <text x="30" y="210" class="sub">currentTimeMillis() 在 System 类中声明为 public static native long currentTimeMillis()，没有 Java 方法体。</text>
</svg>
