  <text x="540" y="87" class="c b">FCS</text>
  <text x="540" y="103" class="c sub">4 字节</text>
  <text x="30" y="142" class="b">加上 VLAN 标签后</text>
  <rect x="30" y="152" width="120" height="40" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="90" y="169" class="c b">目的地址</text>
  <text x="90" y="185" class="c sub">6 字节</text>
  <rect x="150" y="152" width="120" height="40" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="210" y="169" class="c b">源地址</text>
  <text x="210" y="185" class="c sub">6 字节</text>
  <rect x="270" y="152" width="130" height="40" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="335" y="169" class="c b">VLAN 标签</text>
  <text x="335" y="185" class="c sub">4 字节</text>
  <rect x="400" y="152" width="70" height="40" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="435" y="169" class="c b">类型</text>
  <text x="435" y="185" class="c sub">2 字节</text>
  <rect x="470" y="152" width="170" height="40" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="555" y="169" class="c b">数据</text>
  <text x="555" y="185" class="c sub">46～1500 字节</text>
  <rect x="640" y="152" width="60" height="40" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="670" y="169" class="c b">FCS</text>
  <text x="670" y="185" class="c sub">4 字节</text>
  <path d="M270,194 L240,214" class="line dash"/>
  <path d="M400,194 L520,214" class="line dash"/>
  <rect x="240" y="214" width="100" height="40" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="290" y="231" class="c sub b">TPID</text>
  <text x="290" y="247" class="c sub mono">0x8100</text>
  <rect x="340" y="214" width="42" height="40" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="361" y="231" class="c sub b">PCP</text>
  <text x="361" y="247" class="c sub">3 位</text>
  <rect x="382" y="214" width="36" height="40" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="400" y="231" class="c sub b">DEI</text>
  <text x="400" y="247" class="c sub">1 位</text>
  <rect x="418" y="214" width="102" height="40" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="469" y="231" class="c sub b">VID</text>
  <text x="469" y="247" class="c sub">12 位：10</text>
  <text x="534" y="230" class="sub">TPID 为 0x8100 表示带有标签；</text>
  <text x="534" y="248" class="sub">VID 是 VLAN 号，取值 1～4094。</text>
