  <rect x="562" y="207" width="90" height="32" rx="6" class="shadow"/>
  <rect x="560" y="205" width="90" height="32" rx="6" fill="#B1DDF0"/>
  <text x="605" y="225.5" class="b c">转人工</text>
  <line x1="555" y1="164" x2="585" y2="205" class="arrow dash" marker-start="url(#a)"/>
