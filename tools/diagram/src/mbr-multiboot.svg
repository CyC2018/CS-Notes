<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">MBR 与多重引导</text>
  <rect x="30" y="90" width="120" height="46" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="90" y="117" class="c sub b" style="fill:#444">第 1 个扇区</text>
  <rect x="150" y="90" width="230" height="46" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="265" y="117" class="c sub" style="fill:#444">分区 1：Windows</text>
  <rect x="380" y="90" width="340" height="46" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="550" y="117" class="c sub" style="fill:#444">分区 2：Linux</text>
  <text x="90" y="56" class="c sub">446 字节开机管理程序</text>
  <text x="90" y="72" class="c sub">+ 64 字节分区表</text>
  <rect x="380" y="136" width="90" height="24" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="425" y="152" class="c sub" style="fill:#444">启动扇区</text>
  <rect x="30" y="190" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="120" y="210" class="c sub b" style="fill:#444">开机菜单</text>
  <text x="120" y="228" class="c sub">M1：Windows  M2：转交</text>
  <line x1="90" y1="138" x2="90" y2="188" class="arrow "/>
  <path d="M150,218 C200,200 230,150 260,138" class="arrow"/>
  <text x="240" y="182" class="sub">M1 直接加载</text>
  <path d="M212,230 C330,240 410,200 425,172" class="arrow"/>
  <text x="330" y="254" class="c sub">M2 转交给 Linux 分区启动扇区中的 GRUB</text>
  <text x="30" y="286" class="sub">BIOS 读取第 1 个扇区并执行其中的开机管理程序；先装 Windows 再装 Linux，因为安装 Windows 会覆盖 MBR 中的开机管理程序。</text>
</svg>
