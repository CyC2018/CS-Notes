<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">FIFO：不相关的进程通过路径名通信</text>
  <rect x="30" y="60" width="140" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="100" y="82.5" class="c sub">客户进程 1</text>
  <line x1="172" y1="78" x2="296" y2="128" class="arrow "/>
  <rect x="30" y="116" width="140" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="100" y="138.5" class="c sub">客户进程 2</text>
  <line x1="172" y1="134" x2="296" y2="128" class="arrow "/>
  <rect x="30" y="172" width="140" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="100" y="194.5" class="c sub">客户进程 3</text>
  <line x1="172" y1="190" x2="296" y2="128" class="arrow "/>
  <path d="M300,100 h35 l9,9 v47 h-44 z" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M335,100 v9 h9" fill="none" stroke="#7FB2D6" stroke-width="1"/>
  <line x1="306" y1="117" x2="337" y2="117" stroke="#7FB2D6" stroke-width="1"/>
  <line x1="306" y1="124" x2="337" y2="124" stroke="#7FB2D6" stroke-width="1"/>
  <line x1="306" y1="131" x2="337" y2="131" stroke="#7FB2D6" stroke-width="1"/>
  <text x="322" y="176" class="c sub mono">/tmp/server.fifo</text>
  <line x1="350" y1="128" x2="476" y2="128" class="arrow "/>
  <rect x="480" y="110" width="140" height="36" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="550" y="132.5" class="c sub b">服务器进程</text>
  <text x="30" y="240" class="sub">mkfifo 在文件系统中创建一个特殊文件，任何有权限的进程都可以打开它读写，数据仍然经过内核，不写入磁盘。</text>
</svg>
