<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">100 GB 日志中出现次数最多的 10 个 URL（内存 4 GB）</text>
  <rect x="22" y="112" width="110" height="70" rx="6" class="shadow"/>
  <rect x="20" y="110" width="110" height="70" rx="6" fill="#E6E6E6"/>
  <text x="75" y="143" class="b c">100 GB 日志</text>
  <text x="75" y="158" class="sub c">每行一个 URL</text>
  <text x="75" y="204" class="c sub mono">hash(url) % 100</text>
  <rect x="197" y="58" width="80" height="34" rx="6" class="shadow"/>
  <rect x="195" y="56" width="80" height="34" rx="6" fill="#B1DDF0"/>
  <text x="235" y="77.5" class="b c">文件 0</text>
  <line x1="133" y1="145" x2="191" y2="73" class="arrow "/>
  <rect x="320" y="56" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="395" y="77.5" class="c sub">HashMap 计数</text>
  <line x1="278" y1="73" x2="316" y2="73" class="arrow "/>
  <rect x="507" y="58" width="70" height="34" rx="6" class="shadow"/>
  <rect x="505" y="56" width="70" height="34" rx="6" fill="#DDD7F6"/>
  <text x="540" y="77.5" class="b c">前 10</text>
  <line x1="473" y1="73" x2="501" y2="73" class="arrow "/>
  <line x1="578" y1="73" x2="618" y2="145" class="arrow "/>
  <rect x="197" y="110" width="80" height="34" rx="6" class="shadow"/>
  <rect x="195" y="108" width="80" height="34" rx="6" fill="#B1DDF0"/>
  <text x="235" y="129.5" class="b c">文件 1</text>
  <line x1="133" y1="145" x2="191" y2="125" class="arrow "/>
  <rect x="320" y="108" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="395" y="129.5" class="c sub">HashMap 计数</text>
  <line x1="278" y1="125" x2="316" y2="125" class="arrow "/>
  <rect x="507" y="110" width="70" height="34" rx="6" class="shadow"/>
  <rect x="505" y="108" width="70" height="34" rx="6" fill="#DDD7F6"/>
  <text x="540" y="129.5" class="b c">前 10</text>
  <line x1="473" y1="125" x2="501" y2="125" class="arrow "/>
  <line x1="578" y1="125" x2="618" y2="145" class="arrow "/>
  <text x="235" y="182" class="c b">⋮</text>
  <rect x="197" y="214" width="80" height="34" rx="6" class="shadow"/>
  <rect x="195" y="212" width="80" height="34" rx="6" fill="#B1DDF0"/>
  <text x="235" y="233.5" class="b c">文件 99</text>
  <line x1="133" y1="145" x2="191" y2="229" class="arrow "/>
  <rect x="320" y="212" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8"/>
  <text x="395" y="233.5" class="c sub">HashMap 计数</text>
  <line x1="278" y1="229" x2="316" y2="229" class="arrow "/>
  <rect x="507" y="214" width="70" height="34" rx="6" class="shadow"/>
  <rect x="505" y="212" width="70" height="34" rx="6" fill="#DDD7F6"/>
  <text x="540" y="233.5" class="b c">前 10</text>
  <line x1="473" y1="229" x2="501" y2="229" class="arrow "/>
  <line x1="578" y1="229" x2="618" y2="145" class="arrow "/>
  <rect x="624" y="118" width="80" height="58" rx="6" class="shadow"/>
  <rect x="622" y="116" width="80" height="58" rx="6" fill="#B0E3E6"/>
  <text x="662" y="143" class="b c">小顶堆</text>
  <text x="662" y="158" class="sub c">全局前 10</text>
  <text x="235" y="262" class="c sub">① 约 1 GB / 份</text>
  <text x="395" y="262" class="c sub">② 每次只把一份读入内存</text>
  <text x="560" y="262" class="c sub">③ 合并 100 × 10 个候选</text>
  <text x="360" y="288" class="c note">相同的 URL 一定落在同一份中，所以每份单独统计的次数就是它的总次数</text>
</svg>
