<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">轻量级锁：加锁就是一次 CAS</text>
  <rect x="30" y="50" width="250" height="160" rx="8" class="frame"/>
  <text x="40" y="68" class="b">线程 T1 的栈</text>
  <rect x="50" y="80" width="210" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="155" y="99.5" class="c sub">其它栈帧</text>
  <rect x="50" y="120" width="210" height="60" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="155" y="140" class="c sub b" style="fill:#444">Lock Record</text>
  <text x="155" y="160" class="c sub">保存原来的 Mark Word …01</text>
  <rect x="400" y="50" width="290" height="160" rx="8" class="frame"/>
  <text x="410" y="68" class="b">锁对象</text>
  <rect x="420" y="80" width="250" height="34" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="545" y="102" class="c sub" style="fill:#444">Mark Word：Lock Record 的地址 …00</text>
  <rect x="420" y="122" width="250" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="545" y="141.5" class="c sub">类型指针</text>
  <rect x="420" y="158" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="545" y="177.5" class="c sub">字段</text>
  <line x1="418" y1="97" x2="262" y2="150" class="arrow "/>
  <text x="340" y="108" class="c sub ok">CAS 成功</text>
  <text x="30" y="236" class="sub">CAS 期望 Mark Word 仍是原来的 …01，成功就加锁完成；失败说明已被其它线程持有（或是当前线程重入），竞争时膨胀为重量级锁。</text>
</svg>
