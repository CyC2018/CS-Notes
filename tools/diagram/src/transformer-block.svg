<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">Decoder-only Transformer</text>
  <rect x="200" y="50" width="56" height="28" rx="4" fill="#DDD7F6"/>
  <text x="228" y="68.5" class="c">小猫</text>
  <rect x="270" y="50" width="56" height="28" rx="4" fill="#DDD7F6"/>
  <text x="298" y="68.5" class="c">很</text>
  <rect x="340" y="50" width="56" height="28" rx="4" fill="#DDD7F6"/>
  <text x="368" y="68.5" class="c">饿</text>
  <line x1="298" y1="82" x2="298" y2="100" class="arrow "/>
  <rect x="192" y="106" width="216" height="36" rx="6" class="shadow"/>
  <rect x="190" y="104" width="216" height="36" rx="6" fill="#B1DDF0"/>
  <text x="298" y="126.5" class="b c">词嵌入</text>
  <text x="420" y="120" class="sub">每个 Token 转为一个向量</text>
  <text x="420" y="136" class="sub">Qwen2.5-7B 中为 3584 维</text>
  <line x1="298" y1="144" x2="298" y2="166" class="arrow "/>
  <rect x="150" y="170" width="296" height="170" rx="8" class="frame"/>
  <text x="440" y="190" class="e b">× 28 层</text>
  <rect x="192" y="198" width="216" height="36" rx="6" class="shadow"/>
  <rect x="190" y="196" width="216" height="36" rx="6" fill="#B0E3E6"/>
  <text x="298" y="218.5" class="b c">注意力</text>
  <rect x="192" y="274" width="216" height="36" rx="6" class="shadow"/>
  <rect x="190" y="272" width="216" height="36" rx="6" fill="#B0E3E6"/>
  <text x="298" y="294.5" class="b c">前馈网络 FFN</text>
  <line x1="298" y1="236" x2="298" y2="268" class="arrow "/>
  <text x="470" y="210" class="sub">Token 之间交换信息</text>
  <text x="470" y="226" class="sub">只能看到前面的 Token</text>
  <text x="470" y="286" class="sub">对每个位置单独加工</text>
  <path d="M190,186 C165,186 165,250 186,252" class="arrow"/>
  <path d="M190,262 C165,262 165,322 186,324" class="arrow"/>
  <text x="160" y="222" class="e sub">残差</text>
  <text x="160" y="296" class="e sub">残差</text>
  <line x1="298" y1="312" x2="298" y2="360" class="arrow "/>
  <text x="306" y="330" class="sub">每个子层后都有归一化</text>
  <rect x="192" y="366" width="216" height="36" rx="6" class="shadow"/>
  <rect x="190" y="364" width="216" height="36" rx="6" fill="#B1DDF0"/>
  <text x="298" y="386.5" class="b c">线性层 + softmax</text>
  <text x="420" y="378" class="sub">用最后一个位置的向量</text>
  <text x="420" y="394" class="sub">给词表中每个 Token 打分</text>
  <line x1="298" y1="404" x2="298" y2="420" class="arrow "/>
  <text x="220" y="444" class="c b">了</text>
  <text x="240" y="444" class="sub">0.41</text>
  <text x="280" y="444" class="c b">。</text>
  <text x="300" y="444" class="sub">0.23</text>
  <text x="340" y="444" class="c b">吗</text>
  <text x="360" y="444" class="sub">0.12</text>
  <text x="400" y="444" class="sub">……下一个 Token 的概率</text>
</svg>
