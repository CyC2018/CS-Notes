<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="280" y="28" class="title">文章信息：一篇文章是一个 HASH</text>
  <text x="30" y="86" class="sub b"></text>
  <rect x="30" y="92" width="110" height="28" rx="4" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="85" y="110" class="c sub mono" style="fill:#444">article:1001</text>
  <text x="42" y="140" class="sub mono" style="fill:#296898">article</text>
  <text x="42" y="156" class="sub">命名空间</text>
  <text x="104" y="140" class="sub mono" style="fill:#296898">1001</text>
  <text x="104" y="156" class="sub">ID</text>
  <line x1="144" y1="106" x2="180" y2="106" class="arrow "/>
  <rect x="184" y="46" width="80" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="224" y="62" class="c sub" style="fill:#444">字段</text>
  <rect x="264" y="46" width="260" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="394" y="62" class="c sub" style="fill:#444">值</text>
  <rect x="184" y="70" width="80" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="224" y="87" class="c sub mono" style="fill:#444">title</text>
  <rect x="264" y="70" width="260" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="394" y="87" class="c sub" style="fill:#444">Redis 为什么快</text>
  <rect x="184" y="96" width="80" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="224" y="113" class="c sub mono" style="fill:#444">author</text>
  <rect x="264" y="96" width="260" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="394" y="113" class="c sub mono" style="fill:#444">user:2001</text>
  <rect x="184" y="122" width="80" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="224" y="139" class="c sub mono" style="fill:#444">time</text>
  <rect x="264" y="122" width="260" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="394" y="139" class="c sub" style="fill:#444">1760923800（2025-10-20 09:30）</text>
  <rect x="184" y="148" width="80" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="224" y="165" class="c sub mono" style="fill:#444">votes</text>
  <rect x="264" y="148" width="260" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="394" y="165" class="c sub mono" style="fill:#444">3</text>
  <text x="30" y="202" class="sub">相当于关系型数据库中 article 表里 id = 1001 的一行。</text>
</svg>
