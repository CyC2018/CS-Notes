<svg xmlns="http://www.w3.org/2000/svg" width="690" height="320" viewBox="0 0 690 320">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="345" y="28" class="title">Skill 的渐进式加载</text>
  <text x="30" y="60" class="b">上下文窗口</text>
  <rect x="30" y="70" width="380" height="92" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="40" y="88" class="sub">① 启动时：每个 Skill 只加载名称和描述，约 100 Token</text>
  <text x="40" y="111" class="sub">pdf-processing：提取 PDF 中的文字和表格……</text>
  <rect x="36" y="117" width="368" height="19" fill="#DDD7F6" opacity="0.6"/>
  <text x="40" y="131" class="sub">weekly-report：按团队模板生成周报，用户要求写周报时使用</text>
  <text x="40" y="151" class="sub">sql-review：检查 SQL 的性能和规范……</text>
  <rect x="30" y="176" width="380" height="50" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="40" y="196" class="sub">② 用户说“写一下本周周报”，匹配后读取 SKILL.md 正文：</text>
  <text x="40" y="216" class="sub">周报的结构、数据来源、写作规范，通常不超过 5K Token</text>
  <rect x="30" y="240" width="380" height="50" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="40" y="260" class="sub">③ 按需读取模板、运行脚本：</text>
  <text x="40" y="280" class="sub">脚本的代码不进入上下文，只有运行结果进入</text>
  <rect x="462" y="72" width="210" height="150" rx="6" class="shadow"/>
  <rect x="460" y="70" width="210" height="150" rx="6" fill="#B1DDF0"/>
  <text x="472" y="92" class="b mono">weekly-report/</text>
  <text x="484" y="120" class="sub mono">SKILL.md</text>
  <text x="484" y="136" class="sub">名称、描述和操作步骤</text>
  <text x="484" y="162" class="sub mono">template.md</text>
  <text x="484" y="178" class="sub">周报模板</text>
  <text x="484" y="196" class="sub mono">scripts/fetch_jira.py</text>
  <text x="484" y="212" class="sub">拉取本周完成的任务</text>
  <path d="M458,124 C436,124 432,200 414,200" class="arrow dash"/>
  <path d="M458,186 C436,186 432,265 414,265" class="arrow dash"/>
  <text x="460" y="250" class="sub">没用到的文件不占用上下文，</text>
  <text x="460" y="268" class="sub">所以可以安装很多 Skill</text>
</svg>
