  <text x="190" y="224" class="sub">新容量 = 10 + (10 &gt;&gt; 1) = 15，再用 Arrays.copyOf() 把旧数组的元素复制过来</text>
  <text x="30" y="262" class="sub">在 JDK 21 上用反射查看 elementData 的长度：new ArrayList&lt;&gt;() 时为 0，添加第 1 个元素后为 10，</text>
  <text x="30" y="280" class="sub">第 11 个元素后为 15，第 16 个后为 22，第 23 个后为 33。</text>
