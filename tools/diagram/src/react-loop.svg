<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="340" y="28" class="title">ReAct：根据上一步的结果决定下一步</text>
  <rect x="20" y="50" width="640" height="32" rx="6" fill="#DDD7F6"/>
  <text x="340" y="70.5" class="b c">问题：订单 1024 到哪了？</text>
  <text x="115" y="104" class="c b">思考</text>
  <text x="345" y="104" class="c b">行动</text>
  <text x="560" y="104" class="c b">观察</text>
  <rect x="22" y="117" width="190" height="36" rx="6" class="shadow"/>
  <rect x="20" y="115" width="190" height="36" rx="6" fill="#B1DDF0"/>
  <text x="115" y="137.5" class="c">需要先查订单，拿到快递单号</text>
  <rect x="252" y="117" width="190" height="36" rx="6" class="shadow"/>
  <rect x="250" y="115" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#BBB"/>
  <text x="345" y="137.5" class="c mono">query_order(1024)</text>
  <line x1="213" y1="133" x2="246" y2="133" class="arrow "/>
  <rect x="467" y="117" width="195" height="36" rx="6" class="shadow"/>
  <rect x="465" y="115" width="195" height="36" rx="6" fill="#E6E6E6"/>
  <text x="562.5" y="137.5" class="c">快递单号 SF123，已发货</text>
  <line x1="443" y1="133" x2="461" y2="133" class="arrow "/>
  <path d="M560,155 C560,171 115,159 115,174" class="arrow dash"/>
  <rect x="22" y="179" width="190" height="36" rx="6" class="shadow"/>
  <rect x="20" y="177" width="190" height="36" rx="6" fill="#B1DDF0"/>
  <text x="115" y="199.5" class="c">用快递单号查物流</text>
  <rect x="252" y="179" width="190" height="36" rx="6" class="shadow"/>
  <rect x="250" y="177" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#BBB"/>
  <text x="345" y="199.5" class="c mono">track("SF123")</text>
  <line x1="213" y1="195" x2="246" y2="195" class="arrow "/>
  <rect x="467" y="179" width="195" height="36" rx="6" class="shadow"/>
  <rect x="465" y="177" width="195" height="36" rx="6" fill="#E6E6E6"/>
  <text x="562.5" y="199.5" class="c">已到达杭州转运中心</text>
  <line x1="443" y1="195" x2="461" y2="195" class="arrow "/>
  <path d="M560,217 C560,233 115,221 115,236" class="arrow dash"/>
  <rect x="22" y="241" width="190" height="36" rx="6" class="shadow"/>
  <rect x="20" y="239" width="190" height="36" rx="6" fill="#B1DDF0"/>
  <text x="115" y="261.5" class="c">信息足够，可以回答</text>
  <rect x="252" y="241" width="410" height="36" rx="6" class="shadow"/>
  <rect x="250" y="239" width="410" height="36" rx="6" fill="#B0E3E6"/>
  <text x="455" y="261.5" class="c">最终回答：订单 1024 已发货，目前在杭州转运中心</text>
  <line x1="213" y1="257" x2="246" y2="257" class="arrow green"/>
  <text x="660" y="168" class="e sub">结果放回上下文</text>
  <text x="20" y="300" class="sub">第 2 步的参数 SF123 来自第 1 步的结果，无法事先写死在代码里</text>
  <text x="20" y="322" class="note">终止条件：最大轮数、超时、重复调用、连续失败</text>
</svg>
