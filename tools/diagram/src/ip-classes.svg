<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="370" y="28" class="title">分类的 IP 地址</text>
  <text x="73" y="60" class="sub mono">0</text>
  <text x="451" y="60" class="sub mono e">31</text>
  <text x="56" y="91" class="b e">A 类</text>
  <rect x="70" y="70" width="12" height="32" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="76" y="90.5" class="c sub mono">0</text>
  <rect x="82" y="70" width="84" height="32" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="124" y="90.5" class="c sub">网络号 7 位</text>
  <rect x="166" y="70" width="288" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="310" y="90.5" class="c sub">主机号 24 位</text>
  <text x="470" y="83" class="sub" style="fill:#555">首字节 1～126</text>
  <text x="470" y="99" class="sub">每个网络 2²⁴ − 2 台主机，例如 10.1.2.3</text>
  <text x="56" y="139" class="b e">B 类</text>
  <rect x="70" y="118" width="24" height="32" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="82" y="138.5" class="c sub mono">10</text>
  <rect x="94" y="118" width="168" height="32" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="178" y="138.5" class="c sub">网络号 14 位</text>
  <rect x="262" y="118" width="192" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="358" y="138.5" class="c sub">主机号 16 位</text>
  <text x="470" y="131" class="sub" style="fill:#555">首字节 128～191</text>
  <text x="470" y="147" class="sub">每个网络 65534 台主机，例如 172.16.5.4</text>
  <text x="56" y="187" class="b e">C 类</text>
  <rect x="70" y="166" width="36" height="32" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="88" y="186.5" class="c sub mono">110</text>
  <rect x="106" y="166" width="252" height="32" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="232" y="186.5" class="c sub">网络号 21 位</text>
  <rect x="358" y="166" width="96" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="406" y="186.5" class="c sub">主机号 8 位</text>
  <text x="470" y="179" class="sub" style="fill:#555">首字节 192～223</text>
  <text x="470" y="195" class="sub">每个网络 254 台主机，例如 192.168.1.10</text>
  <text x="56" y="235" class="b e">D 类</text>
  <rect x="70" y="214" width="48" height="32" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="94" y="234.5" class="c sub mono">1110</text>
  <rect x="118" y="214" width="336" height="32" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="286" y="234.5" class="c sub">多播组号</text>
  <text x="470" y="227" class="sub" style="fill:#555">首字节 224～239</text>
  <text x="470" y="243" class="sub">多播地址</text>
  <text x="56" y="283" class="b e">E 类</text>
  <rect x="70" y="262" width="48" height="32" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="94" y="282.5" class="c sub mono">1111</text>
  <rect x="118" y="262" width="336" height="32" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="286" y="282.5" class="c sub">保留</text>
  <text x="470" y="275" class="sub" style="fill:#555">首字节 240～255</text>
  <text x="470" y="291" class="sub">保留</text>
  <text x="20" y="318" class="sub">A 类中 0 开头和 127 开头的网络保留不分配，127.0.0.1 是本机回环地址。</text>
</svg>
