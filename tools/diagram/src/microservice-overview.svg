<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="370" y="28" class="title">一次下单请求经过的组件</text>
  <rect x="22" y="172" width="90" height="56" rx="6" class="shadow"/>
  <rect x="20" y="170" width="90" height="56" rx="6" fill="#DDD7F6"/>
  <text x="65" y="196" class="b c">App</text>
  <text x="65" y="211" class="sub c">带上令牌</text>
  <rect x="162" y="160" width="150" height="80" rx="6" class="shadow"/>
  <rect x="160" y="158" width="150" height="80" rx="6" fill="#B1DDF0"/>
  <text x="235" y="182" class="c b">网关 :8080</text>
  <text x="235" y="202" class="c sub">校验令牌，加上 X-User-Id</text>
  <text x="235" y="220" class="c sub">/api/orders/** → 订单服务</text>
  <rect x="362" y="160" width="150" height="80" rx="6" class="shadow"/>
  <rect x="360" y="158" width="150" height="80" rx="6" fill="#B1DDF0"/>
  <text x="435" y="182" class="c b">订单服务 :8090</text>
  <text x="435" y="202" class="c sub">OpenFeign 调用库存服务</text>
  <text x="435" y="220" class="c sub">读取 order.max-items</text>
  <rect x="582" y="132" width="140" height="50" rx="6" class="shadow"/>
  <rect x="580" y="130" width="140" height="50" rx="6" fill="#B0E3E6"/>
  <text x="650" y="159.5" class="b c">库存服务 :8081</text>
  <rect x="582" y="212" width="140" height="50" rx="6" class="shadow"/>
  <rect x="580" y="210" width="140" height="50" rx="6" fill="#B0E3E6"/>
  <text x="650" y="239.5" class="b c">库存服务 :8082</text>
  <line x1="113" y1="198" x2="156" y2="198" class="arrow "/>
  <line x1="313" y1="198" x2="356" y2="198" class="arrow "/>
  <line x1="513" y1="190" x2="576" y2="158" class="arrow "/>
  <line x1="513" y1="206" x2="576" y2="232" class="arrow "/>
  <text x="545" y="200" class="c sub">轮询</text>
  <rect x="262" y="52" width="360" height="60" rx="6" class="shadow"/>
  <rect x="260" y="50" width="360" height="60" rx="6" fill="#E6E6E6"/>
  <text x="440" y="72" class="c b">Nacos :8848</text>
  <text x="440" y="92" class="c sub">注册中心：服务名 → 实例列表；配置中心：order-service.yaml</text>
  <path d="M235,154 C235,130 300,118 330,113" class="arrow dash"/>
  <text x="180" y="128" class="sub">查询实例</text>
  <path d="M435,114 L435,154" class="arrow dash"/>
  <text x="441" y="138" class="sub">实例列表、配置推送</text>
  <path d="M650,126 C650,100 640,90 624,86" class="arrow dash"/>
  <text x="656" y="108" class="sub">注册</text>
  <line x1="160" y1="300" x2="720" y2="300" stroke="#9188D8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="292" class="sub">traceId 6ade5947…74b 随请求头 traceparent 传递，各服务的日志中都带上它</text>
  <text x="160" y="324" class="sub">订单服务调用库存服务时加上超时和熔断（Sentinel），跨服务的事务用 Seata 或消息保证一致</text>
  <text x="20" y="380" class="sub">本机实际运行：Nacos 2.5.4，Spring Boot 3.3，Spring Cloud 2023.0，Spring Cloud Alibaba 2023.0.3.4</text>
</svg>
