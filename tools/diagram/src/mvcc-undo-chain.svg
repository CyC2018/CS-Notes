<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Undo 版本链：每次修改都把旧版本写入 undo log，用回滚指针连起来</text>
  <text x="40" y="70" class="sub b">当前的数据行</text>
  <rect x="40" y="76" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="62" y="92" class="c sub b" style="fill:#444">id</text>
  <rect x="84" y="76" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="106" y="92" class="c sub b" style="fill:#444">x</text>
  <rect x="128" y="76" width="92" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="174" y="92" class="c sub b" style="fill:#444">DB_TRX_ID</text>
  <rect x="220" y="76" width="104" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="272" y="92" class="c sub b" style="fill:#444">DB_ROLL_PTR</text>
  <rect x="40" y="100" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="62" y="116" class="c sub mono" style="fill:#444">1</text>
  <rect x="84" y="100" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="106" y="116" class="c sub mono" style="fill:#444">c</text>
  <rect x="128" y="100" width="92" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="174" y="116" class="c sub mono" style="fill:#444">103</text>
  <rect x="220" y="100" width="104" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="272" y="116" class="c sub mono" style="fill:#444">→ 版本 2</text>
  <text x="350" y="106" class="sub mono">UPDATE t SET x = 'c'（事务 103）</text>
  <line x1="272" y1="125" x2="272" y2="152" class="arrow "/>
  <text x="40" y="148" class="sub b">undo log 中的版本 2</text>
  <rect x="40" y="154" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="62" y="170" class="c sub b" style="fill:#444">id</text>
  <rect x="84" y="154" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="106" y="170" class="c sub b" style="fill:#444">x</text>
  <rect x="128" y="154" width="92" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="174" y="170" class="c sub b" style="fill:#444">DB_TRX_ID</text>
  <rect x="220" y="154" width="104" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="272" y="170" class="c sub b" style="fill:#444">DB_ROLL_PTR</text>
  <rect x="40" y="178" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="62" y="194" class="c sub mono" style="fill:#444">1</text>
  <rect x="84" y="178" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="106" y="194" class="c sub mono" style="fill:#444">b</text>
  <rect x="128" y="178" width="92" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="174" y="194" class="c sub mono" style="fill:#444">102</text>
  <rect x="220" y="178" width="104" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="272" y="194" class="c sub mono" style="fill:#444">→ 版本 1</text>
  <text x="350" y="184" class="sub mono">UPDATE t SET x = 'b'（事务 102）</text>
  <line x1="272" y1="203" x2="272" y2="230" class="arrow "/>
  <text x="40" y="226" class="sub b">undo log 中的版本 1</text>
  <rect x="40" y="232" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="62" y="248" class="c sub b" style="fill:#444">id</text>
  <rect x="84" y="232" width="44" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="106" y="248" class="c sub b" style="fill:#444">x</text>
  <rect x="128" y="232" width="92" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="174" y="248" class="c sub b" style="fill:#444">DB_TRX_ID</text>
  <rect x="220" y="232" width="104" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="272" y="248" class="c sub b" style="fill:#444">DB_ROLL_PTR</text>
  <rect x="40" y="256" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="62" y="272" class="c sub mono" style="fill:#444">1</text>
  <rect x="84" y="256" width="44" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="106" y="272" class="c sub mono" style="fill:#444">a</text>
  <rect x="128" y="256" width="92" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="174" y="272" class="c sub mono" style="fill:#444">101</text>
  <rect x="220" y="256" width="104" height="24" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="272" y="272" class="c sub mono" style="fill:#444">无更早版本</text>
  <text x="350" y="262" class="sub mono">INSERT INTO t VALUES (1, 'a')（事务 101）</text>
  <text x="40" y="314" class="sub">DB_TRX_ID 是最后修改这一行的事务 ID，DB_ROLL_PTR 指向上一个版本；事务 ID 为示意。</text>
</svg>
