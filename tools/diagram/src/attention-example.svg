<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="340" y="28" class="title">注意力的计算：以“饿”为例</text>
  <rect x="30" y="50" width="70" height="24" fill="#E6E6E6" stroke="#CCC"/>
  <text x="65" y="66" class="c b">Token</text>
  <rect x="100" y="50" width="70" height="24" fill="#E6E6E6" stroke="#CCC"/>
  <text x="135" y="66" class="c b">Q</text>
  <rect x="170" y="50" width="70" height="24" fill="#E6E6E6" stroke="#CCC"/>
  <text x="205" y="66" class="c b">K</text>
  <rect x="240" y="50" width="70" height="24" fill="#E6E6E6" stroke="#CCC"/>
  <text x="275" y="66" class="c b">V</text>
  <rect x="30" y="74" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="65" y="90" class="c sub">小猫</text>
  <rect x="100" y="74" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="135" y="90" class="c sub mono">(1, 0)</text>
  <rect x="170" y="74" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="205" y="90" class="c sub mono">(2, 0)</text>
  <rect x="240" y="74" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="275" y="90" class="c sub mono">(1, 0)</text>
  <rect x="30" y="98" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="65" y="114" class="c sub">很</text>
  <rect x="100" y="98" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="135" y="114" class="c sub mono">(0, 1)</text>
  <rect x="170" y="98" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="205" y="114" class="c sub mono">(0, 1)</text>
  <rect x="240" y="98" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="275" y="114" class="c sub mono">(0, 1)</text>
  <rect x="30" y="122" width="70" height="24" fill="#DDD7F6" stroke="#CCC"/>
  <text x="65" y="138" class="c sub">饿</text>
  <rect x="100" y="122" width="70" height="24" fill="#DDD7F6" stroke="#CCC"/>
  <text x="135" y="138" class="c sub mono">(2, 0.5)</text>
  <rect x="170" y="122" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="205" y="138" class="c sub mono">(1, 1)</text>
  <rect x="240" y="122" width="70" height="24" fill="#FFFFFF" stroke="#CCC"/>
  <text x="275" y="138" class="c sub mono">(0.5, 0.5)</text>
  <text x="30" y="172" class="sub">向量维度 d = 2，实际模型中每个头通常为 128 维</text>
  <text x="350" y="66" class="b">“饿”的 Q 与每个 K 做点积，再除以 √2：</text>
  <text x="350" y="92" class="sub mono">小猫  2×2 + 0.5×0 = 4.0  → 2.83</text>
  <text x="350" y="112" class="sub mono">很    2×0 + 0.5×1 = 0.5  → 0.35</text>
  <text x="350" y="132" class="sub mono">饿    2×1 + 0.5×1 = 2.5  → 1.77</text>
  <text x="135" y="200" class="c b">① 分数（行：查询，列：键）</text>
  <rect x="90" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="115" y="225" class="c sub">小猫</text>
  <rect x="140" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="165" y="225" class="c sub">很</text>
  <rect x="190" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="215" y="225" class="c sub">饿</text>
  <rect x="30" y="232" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="60" y="247" class="c sub">小猫</text>
  <rect x="90" y="232" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="115" y="247" class="c sub">1.41</text>
  <rect x="140" y="232" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="165" y="247" class="c sub">-∞</text>
  <rect x="190" y="232" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="215" y="247" class="c sub">-∞</text>
  <rect x="30" y="254" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="60" y="269" class="c sub">很</text>
  <rect x="90" y="254" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="115" y="269" class="c sub">0.00</text>
  <rect x="140" y="254" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="165" y="269" class="c sub">0.71</text>
  <rect x="190" y="254" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="215" y="269" class="c sub">-∞</text>
  <rect x="30" y="276" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="60" y="291" class="c sub">饿</text>
  <rect x="90" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="115" y="291" class="c sub">2.83</text>
  <rect x="140" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="165" y="291" class="c sub">0.35</text>
  <rect x="190" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="215" y="291" class="c sub">1.77</text>
  <text x="375" y="200" class="c b">② 每行做 softmax 得到权重</text>
  <rect x="330" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="355" y="225" class="c sub">小猫</text>
  <rect x="380" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="405" y="225" class="c sub">很</text>
  <rect x="430" y="210" width="50" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="455" y="225" class="c sub">饿</text>
  <rect x="270" y="232" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="300" y="247" class="c sub">小猫</text>
  <rect x="330" y="232" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="355" y="247" class="c sub">1.00</text>
  <rect x="380" y="232" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="405" y="247" class="c sub">0</text>
  <rect x="430" y="232" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="455" y="247" class="c sub">0</text>
  <rect x="270" y="254" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="300" y="269" class="c sub">很</text>
  <rect x="330" y="254" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="355" y="269" class="c sub">0.33</text>
  <rect x="380" y="254" width="50" height="22" fill="#FFFFFF" stroke="#CCC"/>
  <text x="405" y="269" class="c sub">0.67</text>
  <rect x="430" y="254" width="50" height="22" fill="#F2F2F2" stroke="#CCC"/>
  <text x="455" y="269" class="c sub">0</text>
  <rect x="270" y="276" width="60" height="22" fill="#E6E6E6" stroke="#CCC"/>
  <text x="300" y="291" class="c sub">饿</text>
  <rect x="330" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="355" y="291" class="c sub">0.70</text>
  <rect x="380" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="405" y="291" class="c sub">0.06</text>
  <rect x="430" y="276" width="50" height="22" fill="#DDD7F6" stroke="#CCC"/>
  <text x="455" y="291" class="c sub">0.24</text>
  <text x="590" y="200" class="c b">③ 按权重对 V 求和</text>
  <text x="590" y="232" class="c sub mono">0.70 × (1, 0)</text>
  <text x="590" y="252" class="c sub mono">+ 0.06 × (0, 1)</text>
  <text x="590" y="272" class="c sub mono">+ 0.24 × (0.5, 0.5)</text>
  <line x1="520" y1="282" x2="660" y2="282" class="line"/>
  <text x="590" y="302" class="c b mono">= (0.82, 0.18)</text>
  <text x="30" y="326" class="sub">灰色为因果掩码：看不到后面的 Token，分数设为 -∞，权重为 0</text>
  <text x="30" y="356" class="sub">“饿”的输出主要来自“小猫”，模型由此知道饿的是谁。</text>
  <text x="30" y="378" class="sub">所有 Token 一起计算时可以写成矩阵运算：softmax(QKᵀ / √d) V。</text>
</svg>
