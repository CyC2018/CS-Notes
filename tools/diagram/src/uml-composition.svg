<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">组合：部门由公司创建，公司不存在了部门也不存在</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker><marker id="dia" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="17" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker><marker id="diaf" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="17" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#555" stroke="#555" stroke-width="1"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#555" stroke-width="1.2"/></marker></defs>
  <rect x="95" y="56" width="150" height="74" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="95" y="84" width="150" height="46" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="95" y1="120" x2="245" y2="120" stroke="#7FB2D6"/>
  <text x="170" y="74" class="c sub b mono" style="fill:#3F3F3F">Company</text>
  <text x="103" y="99" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">- a: DepartmentA</text>
  <text x="103" y="114" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">- b: DepartmentB</text>
  <rect x="30" y="180" width="120" height="48" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="30" y="208" width="120" height="20" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="30" y1="218" x2="150" y2="218" stroke="#7FB2D6"/>
  <text x="90" y="198" class="c sub b mono" style="fill:#3F3F3F">DepartmentA</text>
  <path d="M146,130 L90,180" fill="none" stroke="#555" stroke-width="1.1" marker-start="url(#diaf)"/>
  <rect x="190" y="180" width="120" height="48" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="190" y="208" width="120" height="20" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="190" y1="218" x2="310" y2="218" stroke="#7FB2D6"/>
  <text x="250" y="198" class="c sub b mono" style="fill:#3F3F3F">DepartmentB</text>
  <path d="M194,130 L250,180" fill="none" stroke="#555" stroke-width="1.1" marker-start="url(#diaf)"/>
  <rect x="350" y="60" width="270" height="102" rx="5" fill="#FAFAF8" stroke="#BFBEBA"/>
  <text x="360" y="78" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">class Company {</text>
  <text x="360" y="93" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">    private final DepartmentA a</text>
  <text x="360" y="108" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">            = new DepartmentA();</text>
  <text x="360" y="123" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">    private final DepartmentB b</text>
  <text x="360" y="138" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">            = new DepartmentB();</text>
  <text x="360" y="153" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">}</text>
  <text x="350" y="186" class="sub">实线加实心菱形，菱形在整体一端。</text>
  <text x="350" y="204" class="sub">部门在 Company 内部创建，外部没有引用，</text>
  <text x="350" y="222" class="sub">公司对象被回收时部门也一起被回收。</text>
</svg>
