  <line x1="246" y1="513" x2="280" y2="513" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="288" y="517" class="sub">依赖（创建、调用）</text>
  <rect x="409" y="506" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="433" y="517" class="sub">接口</text>
  <rect x="473" y="506" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="497" y="517" class="sub">类</text>
  <text x="530" y="517" class="sub">+ public，- private，~ 包访问权限</text>
  <text x="30" y="539" class="sub" style="fill:#3F3F3F">customers.accept(visitor) 沿 CustomerGroup → Customer → Order → Item 依次调用 visitor.visit(this)，</text>
  <text x="30" y="557" class="sub" style="fill:#3F3F3F">GeneralReport 统计出 2 个客户、4 个订单、6 个商品；新增一种报表只需要再实现一个 Visitor。</text>
