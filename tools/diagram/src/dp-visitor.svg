  <text x="598.75" y="259" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">0..*</text>
  <rect x="207" y="376" width="193" height="103" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="303.5" y="396" class="c b mono" style="font-size:12px;fill:#3F3F3F">CustomerGroup</text>
  <text x="303.5" y="409" class="c sub" style="font-size:10px">（ObjectStructure）</text>
  <line x1="207" y1="418" x2="400" y2="418" stroke="#7FB2D6"/>
  <text x="216" y="433.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- customers: List&lt;Customer&gt;</text>
