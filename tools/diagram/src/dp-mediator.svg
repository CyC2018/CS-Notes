  <text x="39" y="301.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doAlarmEvent()</text>
  <text x="39" y="316.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doCoffeePotEvent()</text>
  <text x="39" y="331.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doCalenderEvent()</text>
  <text x="39" y="346.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doSprinklerEvent()</text>
  <path d="M110.5,174 L110.5,125" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <rect x="489" y="60" width="142" height="64" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="77" class="c sub" style="font-size:9.5px">«abstract»</text>
  <text x="560" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F;font-style:italic">Colleague</text>
  <line x1="489" y1="101" x2="631" y2="101" stroke="#7FB2D6"/>
  <text x="498" y="116.5" class="mono" style="font-size:10.5px;fill:#3F3F3F;font-style:italic">+ onEvent(Mediator)</text>
  <path d="M489,92 L175,92" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="332" y="86" class="c sub" style="font-size:10.5px">onEvent() 中调用 doEvent("alarm") 等</text>
  <rect x="475" y="174" width="170" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="194" class="c b mono" style="font-size:12px;fill:#3F3F3F">Alarm</text>
  <line x1="475" y1="203" x2="645" y2="203" stroke="#7FB2D6"/>
  <text x="484" y="218.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ onEvent(Mediator)</text>
  <text x="484" y="233.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doAlarm()</text>
  <rect x="475" y="257" width="170" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="277" class="c b mono" style="font-size:12px;fill:#3F3F3F">CoffeePot</text>
  <line x1="475" y1="286" x2="645" y2="286" stroke="#7FB2D6"/>
  <text x="484" y="301.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ onEvent(Mediator)</text>
  <text x="484" y="316.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doCoffeePot()</text>
  <rect x="475" y="340" width="170" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="360" class="c b mono" style="font-size:12px;fill:#3F3F3F">Calender</text>
  <line x1="475" y1="369" x2="645" y2="369" stroke="#7FB2D6"/>
  <text x="484" y="384.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ onEvent(Mediator)</text>
  <text x="484" y="399.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doCalender()</text>
  <rect x="475" y="423" width="170" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="560" y="443" class="c b mono" style="font-size:12px;fill:#3F3F3F">Sprinkler</text>
  <line x1="475" y1="452" x2="645" y2="452" stroke="#7FB2D6"/>
  <text x="484" y="467.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ onEvent(Mediator)</text>
  <text x="484" y="482.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doSprinkler()</text>
  <path d="M645,290.5 L663,290.5" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M645,373.5 L663,373.5" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M645,456.5 L663,456.5" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M663,456.5 L663,149 L560,149" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M560,174 L560,125" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <path d="M191,204 L435,204" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M435,204 L435,456.5" fill="none" stroke="#555" stroke-width="1.1"/>
  <path d="M435,207.5 L475,207.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <path d="M435,290.5 L475,290.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <path d="M435,373.5 L475,373.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <path d="M435,456.5 L475,456.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="313" y="198" class="c sub">alarm 等 4 个字段</text>
  <line x1="30" y1="524" x2="64" y2="524" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <text x="72" y="528" class="sub">继承</text>
  <line x1="116" y1="524" x2="150" y2="524" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="158" y="528" class="sub">关联（字段）</text>
  <line x1="246" y1="524" x2="280" y2="524" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="288" y="528" class="sub">依赖（创建、调用）</text>
  <rect x="409" y="517" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="433" y="528" class="sub">类</text>
  <text x="466" y="528" class="sub">+ public，- private；斜体为抽象</text>
  <text x="30" y="550" class="sub" style="fill:#3F3F3F">同事之间互不引用：闹钟事件到达时 Alarm 只调用 mediator.doEvent("alarm")，由 ConcreteMediator 依次调用四个对象。</text>
</svg>
