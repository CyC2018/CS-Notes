<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">中介者的类图</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="46" y="60" width="129" height="64" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="110.5" y="77" class="c sub" style="font-size:9.5px">«abstract»</text>
  <text x="110.5" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F;font-style:italic">Mediator</text>
  <line x1="46" y1="101" x2="175" y2="101" stroke="#7FB2D6"/>
  <text x="55" y="116.5" class="mono" style="font-size:10.5px;fill:#3F3F3F;font-style:italic">+ doEvent(String)</text>
  <rect x="30" y="174" width="161" height="180" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="110.5" y="194" class="c b mono" style="font-size:12px;fill:#3F3F3F">ConcreteMediator</text>
  <line x1="30" y1="203" x2="191" y2="203" stroke="#7FB2D6"/>
  <text x="39" y="218.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- alarm: Alarm</text>
  <text x="39" y="233.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- coffeePot: CoffeePot</text>
  <text x="39" y="248.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- calender: Calender</text>
  <text x="39" y="263.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- sprinkler: Sprinkler</text>
  <line x1="30" y1="271" x2="191" y2="271" stroke="#7FB2D6"/>
