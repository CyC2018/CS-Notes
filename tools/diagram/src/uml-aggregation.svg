<svg xmlns="http://www.w3.org/2000/svg" width="640" height="268" viewBox="0 0 640 268">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">聚合：电脑由键盘、鼠标、显示器组成，部分可以独立存在</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker><marker id="dia" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="17" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker><marker id="diaf" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="17" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#555" stroke="#555" stroke-width="1"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#555" stroke-width="1.2"/></marker></defs>
  <rect x="95" y="56" width="150" height="89" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="95" y="84" width="150" height="61" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="95" y1="135" x2="245" y2="135" stroke="#7FB2D6"/>
  <text x="170" y="74" class="c sub b mono" style="fill:#3F3F3F">Computer</text>
  <text x="103" y="99" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">- keyboard: Keyboard</text>
  <text x="103" y="114" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">- mouse: Mouse</text>
  <text x="103" y="129" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">- screen: Screen</text>
  <rect x="11" y="196" width="98" height="48" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="11" y="224" width="98" height="20" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="11" y1="234" x2="109" y2="234" stroke="#7FB2D6"/>
  <text x="60" y="214" class="c sub b mono" style="fill:#3F3F3F">Keyboard</text>
  <path d="M137,145 L60,196" fill="none" stroke="#555" stroke-width="1.1" marker-start="url(#dia)"/>
  <rect x="121" y="196" width="98" height="48" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="121" y="224" width="98" height="20" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="121" y1="234" x2="219" y2="234" stroke="#7FB2D6"/>
  <text x="170" y="214" class="c sub b mono" style="fill:#3F3F3F">Mouse</text>
  <path d="M170,145 L170,196" fill="none" stroke="#555" stroke-width="1.1" marker-start="url(#dia)"/>
  <rect x="231" y="196" width="98" height="48" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <rect x="231" y="224" width="98" height="20" fill="#FFFFFF" stroke="#7FB2D6"/>
  <line x1="231" y1="234" x2="329" y2="234" stroke="#7FB2D6"/>
  <text x="280" y="214" class="c sub b mono" style="fill:#3F3F3F">Screen</text>
  <path d="M203,145 L280,196" fill="none" stroke="#555" stroke-width="1.1" marker-start="url(#dia)"/>
  <rect x="350" y="60" width="270" height="132" rx="5" fill="#FAFAF8" stroke="#BFBEBA"/>
  <text x="360" y="78" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">class Computer {</text>
  <text x="360" y="93" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">    private Keyboard keyboard; ...</text>
  <text x="360" y="108" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">    Computer(Keyboard k, Mouse m,</text>
  <text x="360" y="123" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">             Screen s) { ... }</text>
  <text x="360" y="138" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">}</text>
  <text x="360" y="153" class="mono" style="font-size:11px;fill:#8A8A8A" xml:space="preserve">// 键盘在外部创建后传入</text>
  <text x="360" y="168" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">Keyboard k = new Keyboard();</text>
  <text x="360" y="183" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">Computer c = new Computer(k, ...);</text>
  <text x="350" y="214" class="sub">实线加空心菱形，菱形在整体一端。</text>
  <text x="350" y="232" class="sub">电脑不存在了，k 指向的键盘仍然可以使用。</text>
</svg>
