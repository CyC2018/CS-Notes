<svg xmlns="http://www.w3.org/2000/svg" width="760" height="258" viewBox="0 0 760 258">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">分支与 HEAD：都是指针</text>
  <circle cx="80" cy="160" r="13" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="80" y="188" class="c sub mono" style="fill:#3F3F3F">3c6d6d5</text>
  <text x="80" y="202" class="c sub">add a.txt</text>
  <circle cx="200" cy="160" r="13" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="200" y="188" class="c sub mono" style="fill:#3F3F3F">8c4423a</text>
  <text x="200" y="202" class="c sub">add b.txt</text>
  <circle cx="320" cy="160" r="13" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="320" y="188" class="c sub mono" style="fill:#3F3F3F">72f2299</text>
  <text x="320" y="202" class="c sub">add c.txt</text>
  <line x1="306" y1="160" x2="216" y2="160" class="arrow "/>
  <line x1="186" y1="160" x2="96" y2="160" class="arrow "/>
  <rect x="289.4" y="97" width="61.2" height="22" rx="5" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="320" y="112" class="c sub mono" style="fill:#3F3F3F">master</text>
  <line x1="320" y1="119" x2="320" y2="145" class="arrow "/>
  <rect x="296.6" y="51" width="46.8" height="22" rx="5" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="320" y="66" class="c sub mono" style="fill:#3F3F3F">HEAD</text>
  <line x1="320" y1="73" x2="320" y2="95" class="arrow "/>
  <rect x="410" y="52" width="330" height="132" rx="5" fill="#FAFAF8" stroke="#BFBEBA"/>
  <text x="420" y="70" class="mono" style="font-size:11px;fill:#296898" xml:space="preserve">$ git log --graph --oneline --all --decorate</text>
  <text x="420" y="85" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">* 72f2299 (HEAD -&gt; master) add c.txt</text>
  <text x="420" y="100" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">* 8c4423a add b.txt</text>
  <text x="420" y="115" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">* 3c6d6d5 add a.txt</text>
  <text x="420" y="130" class="mono" style="font-size:11px;fill:#296898" xml:space="preserve">$ cat .git/HEAD</text>
  <text x="420" y="145" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">ref: refs/heads/master</text>
  <text x="420" y="160" class="mono" style="font-size:11px;fill:#296898" xml:space="preserve">$ cat .git/refs/heads/master</text>
  <text x="420" y="175" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">72f2299c5907dcad8526fc98989d24249292d10f</text>
  <circle cx="37" cy="236" r="7" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="50" y="240" class="sub">提交（箭头指向父提交）</text>
  <rect x="200" y="229" width="22" height="14" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="228" y="240" class="sub">分支</text>
  <rect x="270" y="229" width="22" height="14" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="298" y="240" class="sub">HEAD</text>
</svg>
