  <text x="30" y="428" class="sub">交换机的每个接口配置了所属的 VLAN（小方块的颜色）。A1 的广播帧经过干线时带上 VLAN 标签 10，</text>
  <text x="30" y="448" class="sub">各交换机只把它转发到 VLAN 10 的接口，所以 A2、A3、A4 收到，同一层的 B、C 收不到。</text>
