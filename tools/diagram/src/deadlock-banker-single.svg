<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">单个资源的银行家算法：共 12 个，分配前先检查分配后是否安全</text>
  <text x="140" y="58" class="c sub b" style="fill:#444">(a) 当前状态</text>
  <text x="52" y="91" class="sub b e" style="fill:#444">A</text>
  <rect x="60" y="78" width="104" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="60" y="78" width="39" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="170" y="91" class="sub mono">3 / 8</text>
  <text x="52" y="123" class="sub b e" style="fill:#444">B</text>
  <rect x="60" y="110" width="52" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="60" y="110" width="26" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="118" y="123" class="sub mono">2 / 4</text>
  <text x="52" y="155" class="sub b e" style="fill:#444">C</text>
  <rect x="60" y="142" width="117" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="60" y="142" width="52" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="183" y="155" class="sub mono">4 / 9</text>
  <rect x="60" y="180" width="80" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="100" y="197" class="c sub" style="fill:#444">Free 3</text>
  <text x="60" y="228" class="sub ok">安全：B → A → C</text>
  <text x="380" y="58" class="c sub b" style="fill:#444">(b) C 再申请 2 个</text>
  <text x="292" y="91" class="sub b e" style="fill:#444">A</text>
  <rect x="300" y="78" width="104" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="300" y="78" width="39" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="410" y="91" class="sub mono">3 / 8</text>
  <text x="292" y="123" class="sub b e" style="fill:#444">B</text>
  <rect x="300" y="110" width="52" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="300" y="110" width="26" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="358" y="123" class="sub mono">2 / 4</text>
  <text x="292" y="155" class="sub b e" style="fill:#444">C</text>
  <rect x="300" y="142" width="117" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="300" y="142" width="78" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="423" y="155" class="sub mono">6 / 9</text>
  <rect x="300" y="180" width="80" height="26" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="340" y="197" class="c sub" style="fill:#444">Free 1</text>
  <text x="300" y="228" class="sub note">不安全：谁都补不齐，拒绝</text>
  <text x="620" y="58" class="c sub b" style="fill:#444">(c) B 再申请 1 个</text>
  <text x="532" y="91" class="sub b e" style="fill:#444">A</text>
  <rect x="540" y="78" width="104" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="540" y="78" width="39" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="650" y="91" class="sub mono">3 / 8</text>
  <text x="532" y="123" class="sub b e" style="fill:#444">B</text>
  <rect x="540" y="110" width="52" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="540" y="110" width="39" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="598" y="123" class="sub mono">3 / 4</text>
  <text x="532" y="155" class="sub b e" style="fill:#444">C</text>
  <rect x="540" y="142" width="117" height="18" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="540" y="142" width="52" height="18" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="663" y="155" class="sub mono">4 / 9</text>
  <rect x="540" y="180" width="80" height="26" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="580" y="197" class="c sub" style="fill:#444">Free 2</text>
  <text x="540" y="228" class="sub ok">安全：B → A → C，分配</text>
  <text x="40" y="270" class="sub">(b) 中 A、B、C 分别还需要 5、2、3 个，Free 只有 1，任何进程都无法运行完，可能发生死锁，所以拒绝这次申请，</text>
  <text x="40" y="288" class="sub">让 C 等待；(c) 中 B 只差 1 个，运行完归还 4 个后 Free = 5，A 和 C 也能依次完成，所以可以分配。</text>
</svg>
