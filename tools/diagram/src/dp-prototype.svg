<svg xmlns="http://www.w3.org/2000/svg" width="760" height="369" viewBox="0 0 760 369">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">原型模式的类图</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="249.5" y="60" width="161" height="64" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="330" y="77" class="c sub" style="font-size:9.5px">«abstract»</text>
  <text x="330" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F;font-style:italic">Prototype</text>
  <line x1="249.5" y1="101" x2="410.5" y2="101" stroke="#7FB2D6"/>
  <text x="258.5" y="116.5" class="mono" style="font-size:10.5px;fill:#3F3F3F;font-style:italic">~ myClone(): Prototype</text>
  <rect x="233.5" y="184" width="193" height="105" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="330" y="204" class="c b mono" style="font-size:12px;fill:#3F3F3F">ConcretePrototype</text>
  <line x1="233.5" y1="213" x2="426.5" y2="213" stroke="#7FB2D6"/>
  <text x="242.5" y="228.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- filed: String</text>
  <line x1="233.5" y1="236" x2="426.5" y2="236" stroke="#7FB2D6"/>
  <text x="242.5" y="251.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ ConcretePrototype(String)</text>
  <text x="242.5" y="266.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ myClone(): Prototype</text>
  <text x="242.5" y="281.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ toString(): String</text>
  <path d="M330,184 L330,125" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <rect x="42" y="77" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="90" y="97" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M138,91.5 L249.5,92" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="193.75" y="86" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">myClone()</text>
  <path d="M426.5,262.75 L466.5,262.75 L466.5,215.5 L426.5,215.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="474.5" y="242.6" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">new ConcretePrototype(filed)</text>
  <line x1="30" y1="323" x2="64" y2="323" stroke="#555" stroke-width="1.1" marker-end="url(#tri)"/>
  <text x="72" y="327" class="sub">继承</text>
  <line x1="116" y1="323" x2="150" y2="323" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="158" y="327" class="sub">依赖（创建、调用）</text>
  <rect x="279" y="316" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="303" y="327" class="sub">类</text>
  <rect x="332" y="316" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="356" y="327" class="sub">客户端</text>
  <text x="411" y="327" class="sub">+ public，- private，~ 包访问权限；斜体为抽象</text>
  <text x="30" y="349" class="sub" style="fill:#3F3F3F">Client 只认 Prototype，调用 myClone() 就得到一个字段相同的新对象，不需要知道它的具体类；示例输出 abc。</text>
</svg>
