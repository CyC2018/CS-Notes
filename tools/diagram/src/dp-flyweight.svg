<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">享元的类图</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="219.5" y="60" width="275" height="75" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="357" y="80" class="c b mono" style="font-size:12px;fill:#3F3F3F">FlyweightFactory</text>
  <line x1="219.5" y1="89" x2="494.5" y2="89" stroke="#7FB2D6"/>
  <text x="228.5" y="104.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- flyweights: HashMap&lt;String, Flyweight&gt;</text>
  <line x1="219.5" y1="112" x2="494.5" y2="112" stroke="#7FB2D6"/>
  <text x="228.5" y="127.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ getFlyweight(String): Flyweight</text>
  <rect x="572.5" y="65.5" width="155" height="64" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="650" y="82.5" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="650" y="97.5" class="c b mono" style="font-size:12px;fill:#3F3F3F">Flyweight</text>
  <line x1="572.5" y1="106.5" x2="727.5" y2="106.5" stroke="#B8B0DE"/>
  <text x="581.5" y="122" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doOperation(String)</text>
  <path d="M494.5,97.5 L572.5,97.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="533.5" y="91.5" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">flyweights</text>
  <rect x="553.5" y="195" width="193" height="90" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="650" y="215" class="c b mono" style="font-size:12px;fill:#3F3F3F">ConcreteFlyweight</text>
  <line x1="553.5" y1="224" x2="746.5" y2="224" stroke="#7FB2D6"/>
  <text x="562.5" y="239.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- intrinsicState: String</text>
  <line x1="553.5" y1="247" x2="746.5" y2="247" stroke="#7FB2D6"/>
  <text x="562.5" y="262.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ ConcreteFlyweight(String)</text>
  <text x="562.5" y="277.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ doOperation(String)</text>
  <path d="M650,195 L650,130.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M357,135 L357,240 L553.5,240" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="365" y="234" class="sub" style="font-size:10.5px">不存在时创建并放入 HashMap</text>
  <rect x="20" y="82.5" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="68" y="102.5" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M116,97 L219.5,97.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="167.75" y="91.5" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">getFlyweight()</text>
  <line x1="30" y1="319" x2="64" y2="319" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="72" y="323" class="sub">实现</text>
  <line x1="116" y1="319" x2="150" y2="319" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="158" y="323" class="sub">关联（字段）</text>
  <line x1="246" y1="319" x2="280" y2="319" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="288" y="323" class="sub">依赖（创建、调用）</text>
  <rect x="409" y="312" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="433" y="323" class="sub">接口</text>
  <rect x="473" y="312" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="497" y="323" class="sub">类</text>
  <rect x="526" y="312" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="550" y="323" class="sub">客户端</text>
  <text x="30" y="343" class="sub">+ public，- private，~ 包访问权限</text>
  <text x="30" y="365" class="sub" style="fill:#3F3F3F">两次 getFlyweight("aa") 返回同一个对象：内部状态 intrinsicState 存在享元中共享，外部状态由 doOperation("x") 的参数传入。</text>
</svg>
