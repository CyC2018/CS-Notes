<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="390" y="28" class="title">NAPT：两台主机共用一个全球地址</text>
  <rect x="20" y="50" width="200" height="210" rx="8" class="frame"/>
  <text x="30" y="68" class="b">专用网 192.168.0.0/24</text>
  <rect x="60" y="84" width="40" height="27.2" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="64" y="88" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M76,111.2 v5 M84,111.2 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="68" y="116.2" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <text x="80" y="136" class="c b">H1</text>
  <text x="80" y="152" class="c sub mono">192.168.0.3</text>
  <rect x="60" y="172" width="40" height="27.2" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <rect x="64" y="176" width="32" height="19.2" rx="1.5" fill="#FFFFFF" stroke="#7FB2D6" stroke-width="0.8"/>
  <path d="M76,199.2 v5 M84,199.2 v5" stroke="#7FB2D6" stroke-width="1.4"/>
  <rect x="68" y="204.2" width="24" height="3.5" rx="1.5" fill="#7FB2D6"/>
  <text x="80" y="224" class="c b">H2</text>
  <text x="80" y="240" class="c sub mono">192.168.0.4</text>
  <circle cx="290" cy="160" r="20" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <line x1="295" y1="165" x2="304" y2="174" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="285" y1="155" x2="276" y2="146" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="295" y1="155" x2="304" y2="146" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="285" y1="165" x2="276" y2="174" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M300,174 L304,174 L304,170" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M280,146 L276,146 L276,150" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M299,155 L295,155 L295,151" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M281,165 L285,165 L285,169" fill="none" stroke="#7FB2D6" stroke-width="1.6" stroke-linecap="round"/>
  <text x="290" y="206" class="c b">NAT 路由器</text>
  <text x="290" y="222" class="c sub mono">203.0.113.5</text>
  <rect x="697" y="136" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="704" cy="142.5" r="2" fill="#7FB2D6"/>
  <line x1="711" y1="142.5" x2="736" y2="142.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="697" y="152" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="704" cy="158.5" r="2" fill="#7FB2D6"/>
  <line x1="711" y1="158.5" x2="736" y2="158.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="697" y="168" width="46" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="704" cy="174.5" r="2" fill="#7FB2D6"/>
  <line x1="711" y1="174.5" x2="736" y2="174.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="720" y="200" class="c b">服务器</text>
  <text x="720" y="216" class="c sub mono">198.51.100.7</text>
  <line x1="102" y1="98" x2="272" y2="152" class="line"/>
  <line x1="102" y1="186" x2="272" y2="168" class="line"/>
  <line x1="310" y1="160" x2="696" y2="160" class="line"/>
  <text x="500" y="66" class="c sub">① H1 的请求经过 NAT，源地址和端口被改写</text>
  <rect x="336" y="76" width="330" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.2"/>
  <path d="M336,77 L350,87 L364,77" fill="none" stroke="#BBBBBB" stroke-width="1"/>
  <text x="370" y="94" class="sub mono">192.168.0.3:30000 → 198.51.100.7:443</text>
  <rect x="336" y="112" width="330" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <path d="M336,113 L350,123 L364,113" fill="none" stroke="#B8B0DE" stroke-width="1"/>
  <text x="370" y="130" class="sub mono">203.0.113.5:40001 → 198.51.100.7:443</text>
  <rect x="20" y="280" width="330" height="70" rx="5" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <rect x="20" y="280" width="330" height="22" rx="5" fill="#7DBCB7" opacity="0.35"/>
  <text x="185" y="295" class="c b">NAPT 转换表：内部地址 ↔ 外部地址</text>
  <rect x="26" y="308" width="318" height="16" rx="3" fill="#E6E3FA" stroke="#7DBCB7" stroke-width="0.6"/>
  <text x="32" y="320" class="sub mono">192.168.0.3:30000  ↔  203.0.113.5:40001</text>
  <rect x="26" y="328" width="318" height="16" rx="3" fill="#FFFFFF" stroke="#7DBCB7" stroke-width="0.6"/>
  <text x="32" y="340" class="sub mono">192.168.0.4:30000  ↔  203.0.113.5:40002</text>
  <text x="500" y="196" class="c sub">② 响应按目的端口 40001 查表，改回 H1</text>
  <rect x="336" y="206" width="330" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <path d="M336,207 L350,217 L364,207" fill="none" stroke="#B8B0DE" stroke-width="1"/>
  <text x="370" y="224" class="sub mono">198.51.100.7:443 → 203.0.113.5:40001</text>
  <rect x="336" y="242" width="330" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.2"/>
  <path d="M336,243 L350,253 L364,243" fill="none" stroke="#BBBBBB" stroke-width="1"/>
  <text x="370" y="260" class="sub mono">198.51.100.7:443 → 192.168.0.3:30000</text>
  <text x="380" y="306" class="sub">H1、H2 的源端口都是 30000，NAT 为它们分配</text>
  <text x="380" y="324" class="sub">不同的外部端口，响应回来时靠外部端口区分。</text>
  <text x="20" y="384" class="sub">外部主机无法主动连接 H1：转换表中没有对应的表项，除非在 NAT 上配置端口映射。</text>
</svg>
