<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">Paxos 的三类角色</text>
  <rect x="40" y="70" width="130" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="105" y="92.5" class="c sub b">Proposer A</text>
  <rect x="40" y="150" width="130" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="105" y="172.5" class="c sub b">Proposer B</text>
  <rect x="300" y="50" width="130" height="36" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="365" y="72.5" class="c sub b">Acceptor X</text>
  <rect x="300" y="110" width="130" height="36" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="365" y="132.5" class="c sub b">Acceptor Y</text>
  <rect x="300" y="170" width="130" height="36" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="365" y="192.5" class="c sub b">Acceptor Z</text>
  <rect x="560" y="110" width="120" height="36" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="620" y="132.5" class="c sub b">Learner</text>
  <line x1="172" y1="88" x2="298" y2="68" class="arrow "/>
  <line x1="172" y1="88" x2="298" y2="128" class="arrow "/>
  <line x1="172" y1="88" x2="298" y2="188" class="arrow "/>
  <line x1="172" y1="168" x2="298" y2="68" class="arrow "/>
  <line x1="172" y1="168" x2="298" y2="128" class="arrow "/>
  <line x1="172" y1="168" x2="298" y2="188" class="arrow "/>
  <line x1="432" y1="68" x2="558" y2="128" class="arrow dash"/>
  <line x1="432" y1="128" x2="558" y2="128" class="arrow dash"/>
  <line x1="432" y1="188" x2="558" y2="128" class="arrow dash"/>
  <text x="235" y="46" class="c sub">Prepare、Accept</text>
  <text x="495" y="66" class="c sub">接受的提议</text>
  <text x="30" y="236" class="sub">Proposer 向所有 Acceptor 发请求，超过一半 Acceptor 接受同一个提议，这个值就被选定；Learner 只负责得知结果。</text>
</svg>
