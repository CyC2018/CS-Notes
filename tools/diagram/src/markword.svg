<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">64 位 HotSpot 的 Mark Word（JDK 8）</text>
  <text x="695" y="58" class="c sub" style="fill:#766AA8">是否偏向</text>
  <text x="721" y="72" class="c sub" style="fill:#207773">锁标志</text>
  <text x="110" y="99" class="sub b e" style="fill:#444">无锁</text>
  <rect x="120" y="80" width="219.643" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="229.821" y="98" class="c sub" style="fill:#444">unused 25</text>
  <rect x="339.643" y="80" width="272.357" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="475.821" y="98" class="c sub" style="fill:#444">hashCode 31</text>
  <rect x="612" y="80" width="26" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="625" y="98" class="c sub" style="fill:#444">1</text>
  <rect x="638" y="80" width="44" height="28" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="660" y="98" class="c sub" style="fill:#444">age 4</text>
  <rect x="682" y="80" width="26" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="695" y="98" class="c sub" style="fill:#444">0</text>
  <rect x="708" y="80" width="26" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="721" y="98" class="c sub" style="fill:#444">01</text>
  <text x="110" y="133" class="sub b e" style="fill:#444">偏向锁</text>
  <rect x="120" y="114" width="448" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="344" y="132" class="c sub" style="fill:#444">线程 ID 54</text>
  <rect x="568" y="114" width="44" height="28" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="590" y="132" class="c sub" style="fill:#444">epoch 2</text>
  <rect x="612" y="114" width="26" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="625" y="132" class="c sub" style="fill:#444">1</text>
  <rect x="638" y="114" width="44" height="28" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="660" y="132" class="c sub" style="fill:#444">age 4</text>
  <rect x="682" y="114" width="26" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="695" y="132" class="c sub" style="fill:#444">1</text>
  <rect x="708" y="114" width="26" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="721" y="132" class="c sub" style="fill:#444">01</text>
  <text x="110" y="167" class="sub b e" style="fill:#444">轻量级锁</text>
  <rect x="120" y="148" width="588" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="414" y="166" class="c sub" style="fill:#444">指向栈中 Lock Record 的指针 62</text>
  <rect x="708" y="148" width="26" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="721" y="166" class="c sub" style="fill:#444">00</text>
  <text x="110" y="201" class="sub b e" style="fill:#444">重量级锁</text>
  <rect x="120" y="182" width="588" height="28" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="414" y="200" class="c sub" style="fill:#444">指向 ObjectMonitor 的指针 62</text>
  <rect x="708" y="182" width="26" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="721" y="200" class="c sub" style="fill:#444">10</text>
  <text x="110" y="235" class="sub b e" style="fill:#444">GC 标记</text>
  <rect x="120" y="216" width="588" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="414" y="234" class="c sub" style="fill:#444"></text>
  <rect x="708" y="216" width="26" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="721" y="234" class="c sub" style="fill:#444">11</text>
  <text x="30" y="268" class="sub">末尾两位是锁标志，01 时再看倒数第 3 位区分无锁和偏向锁。偏向锁在 JDK 15 默认禁用（JEP 374），之后被移除，</text>
  <text x="30" y="286" class="sub">现在对象只在无锁、轻量级锁、重量级锁之间转换。依据 jdk8u 的 markOop.hpp。</text>
</svg>
