<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">五种 I/O 模型的比较</text>
  <text x="108" y="129" class="sub b e" style="fill:#444">① 等待数据</text>
  <text x="108" y="224" class="sub b e" style="fill:#444">② 复制数据</text>
  <line x1="110" y1="180" x2="720" y2="180" stroke="#DDD" stroke-dasharray="4 4"/>
  <text x="180" y="58" class="c b" style="fill:#444">阻塞式</text>
  <rect x="172.0" y="76" width="16" height="98" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="194" y="129" class="sub">阻塞</text>
  <rect x="172.0" y="186" width="16" height="68" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="194" y="224" class="sub">阻塞</text>
  <text x="300" y="58" class="c b" style="fill:#444">非阻塞式</text>
  <rect x="292.0" y="76" width="16" height="98" rx="3" fill="#FFFFFF" stroke="#D99A94" stroke-dasharray="4 3"/>
  <text x="314" y="129" class="sub">反复轮询</text>
  <rect x="292.0" y="186" width="16" height="68" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="314" y="224" class="sub">阻塞</text>
  <text x="420" y="58" class="c b" style="fill:#444">I/O 复用</text>
  <rect x="412.0" y="76" width="16" height="98" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="434" y="129" class="sub">阻塞在 select</text>
  <rect x="412.0" y="186" width="16" height="68" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="434" y="224" class="sub">阻塞</text>
  <text x="540" y="58" class="c b" style="fill:#444">信号驱动</text>
  <rect x="532.0" y="76" width="16" height="98" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="554" y="129" class="sub">不阻塞</text>
  <rect x="532.0" y="186" width="16" height="68" rx="3" fill="#F3C6C2" stroke="#D99A94"/>
  <text x="554" y="224" class="sub">阻塞</text>
  <text x="660" y="58" class="c b" style="fill:#444">异步</text>
  <rect x="652.0" y="76" width="16" height="98" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="674" y="129" class="sub">不阻塞</text>
  <rect x="652.0" y="186" width="16" height="68" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="674" y="224" class="sub">不阻塞</text>
  <path d="M126,272 q0,8 8,8 H592 q8,0 8,-8" class="line"/>
  <text x="360" y="296" class="c sub">同步 I/O：第二阶段由进程自己 recvfrom，都会阻塞</text>
  <text x="660" y="296" class="c sub">异步 I/O</text>
  <text x="30" y="320" class="sub">红色表示进程阻塞，浅青色表示进程可以做别的事。前四种的区别只在第一阶段。</text>
</svg>
