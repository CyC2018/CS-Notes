  <rect x="312" y="270" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="329" y="290" class="c mono" style="font-size:13px;fill:#333">3</text>
  <rect x="346" y="270" width="34" height="30" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="363" y="290" class="c mono" style="font-size:13px;fill:#333">2</text>
  <text x="91" y="316" class="sub c">不用</text>
  <text x="230" y="334" class="sub c">k = 2：父节点 k/2 = 1，子节点 2k = 4、2k+1 = 5</text>
</svg>
