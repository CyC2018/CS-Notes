  <text x="310" y="133" class="c sub mono" style="font-size:9px;fill:#999">3</text>
  <circle cx="110" cy="154" r="14" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="110" y="158.5" class="c mono" style="font-size:13px;fill:#333">4</text>
  <text x="110" y="179" class="c sub mono" style="font-size:9px;fill:#999">4</text>
  <circle cx="190" cy="154" r="14" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
