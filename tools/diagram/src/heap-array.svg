  <text x="90" y="225" class="c sub mono" style="font-size:9px;fill:#999">8</text>
  <text x="91" y="262" class="c sub mono">0</text>
  <text x="125" y="262" class="c sub mono">1</text>
  <text x="159" y="262" class="c sub mono">2</text>
  <text x="193" y="262" class="c sub mono">3</text>
  <text x="227" y="262" class="c sub mono">4</text>
  <text x="261" y="262" class="c sub mono">5</text>
  <text x="295" y="262" class="c sub mono">6</text>
  <text x="329" y="262" class="c sub mono">7</text>
  <text x="363" y="262" class="c sub mono">8</text>
  <rect x="74" y="270" width="34" height="30" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="91" y="290" class="c mono" style="font-size:13px;fill:#333">–</text>
  <rect x="108" y="270" width="34" height="30" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
