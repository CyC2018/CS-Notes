<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">频分复用：每个用户一直占用自己的频带</text>
  <text x="30" y="60" class="sub" style="fill:#444">4 个用户在 4 个时间段内要发送的数据：第 1 段 A、C，第 2 段 C，第 3 段 B、D，第 4 段 A、C，共 7 份。</text>
  <line x1="90" y1="282" x2="90" y2="78" class="arrow "/>
  <line x1="90" y1="282" x2="660" y2="282" class="arrow "/>
  <text x="654" y="304" class="sub e">时间</text>
  <text x="80" y="86" class="sub e">频率</text>
  <rect x="92" y="236" width="136" height="40" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="160" y="260" class="c sub" style="">A 的数据</text>
  <rect x="232" y="236" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="300" y="260" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="372" y="236" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="440" y="260" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="512" y="236" width="136" height="40" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="580" y="260" class="c sub" style="">A 的数据</text>
  <text x="662" y="260" class="sub">A 的频带</text>
  <rect x="92" y="188" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="160" y="212" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="232" y="188" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="300" y="212" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="372" y="188" width="136" height="40" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="440" y="212" class="c sub" style="">B 的数据</text>
  <rect x="512" y="188" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="580" y="212" class="c sub" style="fill:#AAA">空闲</text>
  <text x="662" y="212" class="sub">B 的频带</text>
  <rect x="92" y="140" width="136" height="40" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="160" y="164" class="c sub" style="">C 的数据</text>
  <rect x="232" y="140" width="136" height="40" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="300" y="164" class="c sub" style="">C 的数据</text>
  <rect x="372" y="140" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="440" y="164" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="512" y="140" width="136" height="40" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="580" y="164" class="c sub" style="">C 的数据</text>
  <text x="662" y="164" class="sub">C 的频带</text>
  <rect x="92" y="92" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="160" y="116" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="232" y="92" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="300" y="116" class="c sub" style="fill:#AAA">空闲</text>
  <rect x="372" y="92" width="136" height="40" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="440" y="116" class="c sub" style="">D 的数据</text>
  <rect x="512" y="92" width="136" height="40" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="580" y="116" class="c sub" style="fill:#AAA">空闲</text>
  <text x="662" y="116" class="sub">D 的频带</text>
  <text x="160" y="302" class="c sub">第 1 段</text>
  <text x="300" y="302" class="c sub">第 2 段</text>
  <text x="440" y="302" class="c sub">第 3 段</text>
  <text x="580" y="302" class="c sub">第 4 段</text>
  <text x="30" y="334" class="sub">频带之间留有保护频带。用户没有数据时，分给它的频带也不能给别人用：16 格中只有 7 格在传数据。</text>
</svg>
