<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="345" y="28" class="title">大模型的训练过程</text>
  <rect x="22" y="52" width="200" height="34" rx="6" class="shadow"/>
  <rect x="20" y="50" width="200" height="34" rx="6" fill="#B0E3E6"/>
  <text x="120" y="71.5" class="b c">预训练</text>
  <text x="120" y="104" class="c sub">数万亿 Token 的网页、书籍、代码</text>
  <rect x="20" y="114" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="30" y="134" class="sub">……杭州是浙江省的省会，</text>
  <text x="30" y="154" class="sub">位于钱塘江下游……</text>
  <line x1="120" y1="170" x2="120" y2="192" class="arrow "/>
  <rect x="22" y="198" width="200" height="32" rx="6" class="shadow"/>
  <rect x="20" y="196" width="200" height="32" rx="6" fill="#B1DDF0"/>
  <text x="120" y="216.5" class="b c">基座模型：只会续写</text>
  <rect x="20" y="242" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="30" y="262" class="sub">输入：中国的首都是</text>
  <text x="30" y="282" class="sub">输出：哪个城市？A. 上海 B. 北京</text>
  <line x1="223" y1="67" x2="242" y2="67" class="arrow "/>
  <rect x="247" y="52" width="200" height="34" rx="6" class="shadow"/>
  <rect x="245" y="50" width="200" height="34" rx="6" fill="#B0E3E6"/>
  <text x="345" y="71.5" class="b c">监督微调 SFT</text>
  <text x="345" y="104" class="c sub">上万条人工编写的指令和回答</text>
  <rect x="245" y="114" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="255" y="134" class="sub">指令：把“你好”翻译成英文</text>
  <text x="255" y="154" class="sub">回答：Hello</text>
  <line x1="345" y1="170" x2="345" y2="192" class="arrow "/>
  <rect x="247" y="198" width="200" height="32" rx="6" class="shadow"/>
  <rect x="245" y="196" width="200" height="32" rx="6" fill="#B1DDF0"/>
  <text x="345" y="216.5" class="b c">对话模型：能遵循指令</text>
  <rect x="245" y="242" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="255" y="262" class="sub">输入：中国的首都是？</text>
  <text x="255" y="282" class="sub">输出：北京。</text>
  <line x1="448" y1="67" x2="467" y2="67" class="arrow "/>
  <rect x="472" y="52" width="200" height="34" rx="6" class="shadow"/>
  <rect x="470" y="50" width="200" height="34" rx="6" fill="#B0E3E6"/>
  <text x="570" y="71.5" class="b c">偏好对齐 RLHF / DPO</text>
  <text x="570" y="104" class="c sub">同一问题的两个回答，标注哪个更好</text>
  <rect x="470" y="114" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="480" y="134" class="sub">回答 A：……（较好）</text>
  <text x="480" y="154" class="sub">回答 B：……（较差）</text>
  <line x1="570" y1="170" x2="570" y2="192" class="arrow "/>
  <rect x="472" y="198" width="200" height="32" rx="6" class="shadow"/>
  <rect x="470" y="196" width="200" height="32" rx="6" fill="#B1DDF0"/>
  <text x="570" y="216.5" class="b c">更有帮助、更安全</text>
  <rect x="470" y="242" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="480" y="262" class="sub">输入：帮我写一条诈骗短信</text>
  <text x="480" y="282" class="sub">输出：拒绝，并说明原因</text>
  <text x="345" y="318" class="c sub">知识主要来自预训练，后两个阶段主要调整模型回答的方式</text>
</svg>
