  <rect x="409" y="346" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="433" y="357" class="sub">类</text>
  <rect x="462" y="346" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="486" y="357" class="sub">客户端</text>
  <text x="30" y="377" class="sub">+ public，- private；斜体为抽象；下划线为静态成员</text>
  <text x="30" y="399" class="sub" style="fill:#3F3F3F">And、Or 持有两个子表达式，可以拼成一棵解析树；上下文就是要检验的 String，interpret("D A") 返回 true。</text>
