<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Linux 进程状态（ps 的 STAT 列）</text>
  <circle cx="380" cy="185" r="34" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1.2"/>
  <text x="380" y="186" class="c b mono" style="font-size:16px;fill:#3F3F3F">R</text>
  <text x="380" y="203" class="c sub" style="font-size:9.5px">运行或就绪</text>
  <circle cx="140" cy="80" r="34" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="140" y="81" class="c b mono" style="font-size:16px;fill:#3F3F3F">S</text>
  <text x="140" y="98" class="c sub" style="font-size:9.5px">可中断睡眠</text>
  <circle cx="140" cy="290" r="34" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="140" y="291" class="c b mono" style="font-size:16px;fill:#3F3F3F">D</text>
  <text x="140" y="308" class="c sub" style="font-size:9.5px">不可中断睡眠</text>
  <circle cx="620" cy="80" r="34" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="620" y="81" class="c b mono" style="font-size:16px;fill:#3F3F3F">T</text>
  <text x="620" y="98" class="c sub" style="font-size:9.5px">停止</text>
  <circle cx="620" cy="290" r="34" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <text x="620" y="291" class="c b mono" style="font-size:16px;fill:#3F3F3F">Z</text>
  <text x="620" y="308" class="c sub" style="font-size:9.5px">僵死</text>
  <path d="M352.3,163.6 Q260.0,92.5 177.8,83.9" class="arrow"/>
  <text x="262" y="70" class="c sub">等待事件，例如 sleep、读管道</text>
  <path d="M167.7,101.4 Q260.0,172.5 342.2,181.1" class="arrow"/>
  <text x="190" y="168" class="c sub">事件发生或收到信号</text>
  <path d="M167.7,268.6 Q260.0,197.5 342.2,188.9" class="arrow"/>
  <text x="180" y="212" class="c sub">事件完成（信号不能唤醒）</text>
  <path d="M352.3,206.4 Q260.0,277.5 177.8,286.1" class="arrow"/>
  <text x="268" y="314" class="c sub">等待不能被打断的事件，例如磁盘 I/O</text>
  <path d="M407.7,163.6 Q500.0,92.5 582.2,83.9" class="arrow"/>
  <text x="500" y="70" class="c sub">SIGSTOP、Ctrl+Z</text>
  <path d="M592.3,101.4 Q500.0,172.5 417.8,181.1" class="arrow"/>
  <text x="566" y="190" class="c sub">SIGCONT</text>
  <path d="M412.1,199.0 Q500.0,237.5 585.2,274.8" class="arrow"/>
  <text x="520" y="228" class="c sub">exit()</text>
  <line x1="380" y1="340" x2="380" y2="220" class="arrow "/>
  <text x="388" y="334" class="sub">fork() 创建</text>
  <line x1="656" y1="290" x2="734" y2="290" class="arrow dash"/>
  <text x="694" y="282" class="c sub mono" style="fill:#3F3F3F">wait()</text>
  <text x="694" y="308" class="c sub">后被回收</text>
  <rect x="30" y="372" width="420" height="117" rx="5" fill="#FAFAF8" stroke="#BFBEBA"/>
  <text x="40" y="390" class="mono" style="font-size:11px;fill:#296898" xml:space="preserve">$ ps -e -o pid,ppid,stat,wchan:16,cmd</text>
  <text x="40" y="405" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">  PID  PPID STAT WCHAN            CMD</text>
  <text x="40" y="420" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">   13     1 R    -                /tmp/st R</text>
  <text x="40" y="435" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">   14     1 S    hrtimer_nanoslee /tmp/st S</text>
  <text x="40" y="450" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">   15     1 D    kernel_clone     /tmp/st D</text>
  <text x="40" y="465" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">   17     1 T    do_signal_stop   /tmp/st S</text>
  <text x="40" y="480" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">   20    16 Z    -                [st] &lt;defunct&gt;</text>
  <text x="466" y="405" class="sub" style="font-size:11px">Ubuntu 24.04 容器中实测：</text>
  <text x="466" y="420" class="sub" style="font-size:11px">R：for (;;); 一直占用 CPU</text>
  <text x="466" y="435" class="sub" style="font-size:11px">S：sleep(1000) 等待定时器</text>
  <text x="466" y="450" class="sub" style="font-size:11px">D：vfork() 后等待子进程</text>
  <text x="466" y="465" class="sub" style="font-size:11px">T：收到 SIGSTOP</text>
  <text x="466" y="480" class="sub" style="font-size:11px">Z：已退出，父进程没有调用 wait()</text>
  <text x="30" y="511" class="sub">WCHAN 是进程在内核中等待的函数：S 状态的进程睡在 hrtimer_nanosleep，T 状态的进程停在 do_signal_stop。</text>
</svg>
