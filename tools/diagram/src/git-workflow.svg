<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">在三个区域之间移动修改</text>
  <rect x="40" y="118" width="180" height="92" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="130" y="142" class="c b">工作区</text>
  <rect x="62" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7DBCB7"/>
  <text x="130" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v3</text>
  <rect x="290" y="118" width="180" height="92" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="380" y="142" class="c b">暂存区（Stage）</text>
  <rect x="312" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7FB2D6"/>
  <text x="380" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v2</text>
  <rect x="540" y="118" width="180" height="92" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="630" y="142" class="c b">History</text>
  <text x="630" y="159" class="c sub">HEAD 所指的提交</text>
  <rect x="562" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7FB2D6"/>
  <text x="630" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v1</text>
  <path d="M120,116 Q245.0,68 370,118" class="arrow "/>
  <text x="245" y="58" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git add readme.txt</text>
  <text x="245" y="76" class="c sub">暂存区变为 v3</text>
  <path d="M390,116 Q505.0,68 620,118" class="arrow "/>
  <text x="505" y="58" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git commit</text>
  <text x="505" y="76" class="c sub">生成新提交，内容为暂存区的 v2</text>
  <path d="M370,212 Q245.0,260 120,210" class="arrow "/>
  <text x="245" y="266" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git checkout -- readme.txt</text>
  <text x="245" y="284" class="c sub">工作区变为暂存区的 v2，丢弃未 add 的修改</text>
  <path d="M620,212 Q505.0,260 390,210" class="arrow "/>
  <text x="505" y="266" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git reset -- readme.txt</text>
  <text x="505" y="284" class="c sub">暂存区变为 HEAD 中的 v1，撤销 add</text>
  <text x="30" y="320" class="sub">方框中是执行命令前的状态，四条命令分别从这个状态执行。Git 2.23 起，下面两条命令也可以写成</text>
  <text x="30" y="338" class="sub" text-anchor="start" xml:space="preserve"><tspan class="mono" style="font-size:11px;fill:#3F3F3F">git restore readme.txt</tspan><tspan> 和 </tspan><tspan class="mono" style="font-size:11px;fill:#3F3F3F">git restore --staged readme.txt</tspan><tspan>。</tspan></text>
</svg>
