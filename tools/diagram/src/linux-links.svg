<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">实体链接与符号链接</text>
  <rect x="30" y="46" width="700" height="72" rx="5" fill="#FAFAF8" stroke="#BFBEBA"/>
  <text x="40" y="64" class="mono" style="font-size:11px;fill:#296898" xml:space="preserve">$ echo hello &gt; a.txt; ln a.txt hard.txt; ln -s a.txt soft.txt; ls -li</text>
  <text x="40" y="79" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">835891 -rw-r--r-- 2 root root 6 Oct 27 14:46 a.txt</text>
  <text x="40" y="94" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">835891 -rw-r--r-- 2 root root 6 Oct 27 14:46 hard.txt</text>
  <text x="40" y="109" class="mono" style="font-size:11px;fill:#3F3F3F" xml:space="preserve">835906 lrwxrwxrwx 1 root root 5 Oct 27 14:46 soft.txt -&gt; a.txt</text>
  <text x="30" y="142" class="b">rm a.txt 之前</text>
  <rect x="30" y="154" width="150" height="92" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="105" y="172" class="c sub b">目录 /tmp/w 的内容</text>
  <text x="44" y="196" class="sub mono" style="fill:#3F3F3F">a.txt</text>
  <text x="166" y="196" class="e sub mono" style="fill:#3F3F3F">835891</text>
  <text x="44" y="218" class="sub mono" style="fill:#3F3F3F">hard.txt</text>
  <text x="166" y="218" class="e sub mono" style="fill:#3F3F3F">835891</text>
  <text x="44" y="240" class="sub mono" style="fill:#3F3F3F">soft.txt</text>
  <text x="166" y="240" class="e sub mono" style="fill:#3F3F3F">835906</text>
  <rect x="230" y="154" width="140" height="52" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="300" y="174" class="c sub mono" style="fill:#3F3F3F">inode 835891</text>
  <text x="300" y="194" class="c sub">链接数 2，内容 hello</text>
  <rect x="230" y="222" width="140" height="52" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="300" y="242" class="c sub mono" style="fill:#3F3F3F">inode 835906</text>
  <text x="300" y="262" class="c sub">内容是路径 “a.txt”</text>
  <path d="M180,192 C205,192 205,180 228,180" class="arrow"/>
  <path d="M180,214 C205,214 205,180 228,180" class="arrow"/>
  <path d="M180,236 C205,236 205,248 228,248" class="arrow"/>
  <text x="30" y="300" class="sub ">访问 soft.txt 时再按路径 a.txt 找到 inode 835891</text>
  <text x="400" y="142" class="b">rm a.txt 之后</text>
  <rect x="400" y="154" width="150" height="70" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="475" y="172" class="c sub b">目录 /tmp/w 的内容</text>
  <text x="414" y="196" class="sub mono" style="fill:#3F3F3F">hard.txt</text>
  <text x="536" y="196" class="e sub mono" style="fill:#3F3F3F">835891</text>
  <text x="414" y="218" class="sub mono" style="fill:#3F3F3F">soft.txt</text>
  <text x="536" y="218" class="e sub mono" style="fill:#3F3F3F">835906</text>
  <rect x="600" y="154" width="140" height="52" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="670" y="174" class="c sub mono" style="fill:#3F3F3F">inode 835891</text>
  <text x="670" y="194" class="c sub">链接数 1，内容 hello</text>
  <rect x="600" y="222" width="140" height="52" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="670" y="242" class="c sub mono" style="fill:#3F3F3F">inode 835906</text>
  <text x="670" y="262" class="c sub">内容是路径 “a.txt”</text>
  <path d="M550,192 C575,192 575,180 598,180" class="arrow"/>
  <path d="M550,214 C575,214 575,248 598,248" class="arrow"/>
  <text x="400" y="300" class="sub note">按路径 a.txt 已找不到文件</text>
  <text x="30" y="336" class="sub">实体链接是目录中又一个指向同一 inode 的名字，删除 a.txt 只让链接数从 2 变为 1，cat hard.txt 仍输出 hello；</text>
  <text x="30" y="354" class="sub">符号链接是一个独立的文件（有自己的 inode，大小 5 字节，正是 “a.txt” 的长度），a.txt 删除后，</text>
  <text x="30" y="372" class="sub" text-anchor="start" xml:space="preserve"><tspan class="mono" style="font-size:11px;fill:#3F3F3F">cat soft.txt</tspan><tspan> 输出 </tspan><tspan class="mono" style="font-size:11px;fill:#3F3F3F">cat: soft.txt: No such file or directory</tspan><tspan>。</tspan></text>
</svg>
