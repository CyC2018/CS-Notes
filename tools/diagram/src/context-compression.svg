<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="345" y="28" class="title">上下文压缩</text>
  <text x="30" y="62" class="b">压缩前</text>
  <text x="640" y="62" class="e note">合计 147.5K，超过 128K 的窗口</text>
  <rect x="30" y="70" width="60" height="40" fill="#B0E3E6" stroke="#FFF" stroke-width="2"/>
  <text x="60" y="87" class="c sub">系统</text>
  <text x="60" y="103" class="c sub">2K</text>
  <rect x="90" y="70" width="70" height="40" fill="#B0E3E6" stroke="#FFF" stroke-width="2"/>
  <text x="125" y="87" class="c sub">工具定义</text>
  <text x="125" y="103" class="c sub">3K</text>
  <rect x="160" y="70" width="150" height="40" fill="#B1DDF0" stroke="#FFF" stroke-width="2"/>
  <text x="235" y="87" class="c sub">第 1～25 轮对话</text>
  <text x="235" y="103" class="c sub">60K</text>
  <rect x="310" y="70" width="150" height="40" fill="#E6E6E6" stroke="#FFF" stroke-width="2"/>
  <text x="385" y="87" class="c sub">工具返回的原始数据</text>
  <text x="385" y="103" class="c sub">70K</text>
  <rect x="460" y="70" width="110" height="40" fill="#B1DDF0" stroke="#FFF" stroke-width="2"/>
  <text x="515" y="87" class="c sub">第 26～30 轮</text>
  <text x="515" y="103" class="c sub">12K</text>
  <rect x="570" y="70" width="60" height="40" fill="#DDD7F6" stroke="#FFF" stroke-width="2"/>
  <text x="600" y="87" class="c sub">问题</text>
  <text x="600" y="103" class="c sub">0.5K</text>
  <text x="30" y="202" class="b">压缩后</text>
  <text x="640" y="202" class="e ok">合计 20K</text>
  <rect x="30" y="210" width="60" height="40" fill="#B0E3E6" stroke="#FFF" stroke-width="2"/>
  <text x="60" y="227" class="c sub">系统</text>
  <text x="60" y="243" class="c sub">2K</text>
  <rect x="90" y="210" width="70" height="40" fill="#B0E3E6" stroke="#FFF" stroke-width="2"/>
  <text x="125" y="227" class="c sub">工具定义</text>
  <text x="125" y="243" class="c sub">3K</text>
  <rect x="160" y="210" width="150" height="40" fill="#DDD7F6" stroke="#FFF" stroke-width="2"/>
  <text x="235" y="227" class="c sub">前 25 轮的摘要</text>
  <text x="235" y="243" class="c sub">2K</text>
  <rect x="310" y="210" width="150" height="40" fill="#DDD7F6" stroke="#FFF" stroke-width="2"/>
  <text x="385" y="227" class="c sub">说明 + 存储路径</text>
  <text x="385" y="243" class="c sub">0.5K</text>
  <rect x="460" y="210" width="110" height="40" fill="#B1DDF0" stroke="#FFF" stroke-width="2"/>
  <text x="515" y="227" class="c sub">第 26～30 轮</text>
  <text x="515" y="243" class="c sub">12K</text>
  <rect x="570" y="210" width="60" height="40" fill="#DDD7F6" stroke="#FFF" stroke-width="2"/>
  <text x="600" y="227" class="c sub">问题</text>
  <text x="600" y="243" class="c sub">0.5K</text>
  <line x1="205" y1="114" x2="205" y2="204" class="arrow "/>
  <text x="211" y="162" class="sub">摘要</text>
  <line x1="355" y1="114" x2="355" y2="204" class="arrow "/>
  <text x="361" y="162" class="sub">清理工具结果</text>
  <line x1="485" y1="114" x2="485" y2="204" class="arrow "/>
  <text x="491" y="162" class="sub">原样保留</text>
  <text x="30" y="280" class="sub">摘要保留已确定的结论、未解决的问题和用户的要求；工具结果需要时按路径重新读取。</text>
  <text x="30" y="302" class="sub">截断时，工具调用和它的结果要成对保留或成对删除。</text>
</svg>
