<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="330" y="28" class="title">召回与重排</text>
  <polygon points="20.0,52 280.0,52 250.0,108 50.0,108" fill="#B1DDF0" stroke="#FFF" stroke-width="3"/>
  <text x="150" y="76" class="c b">知识库</text>
  <text x="150" y="93" class="c sub">100 万个切片</text>
  <polygon points="50.0,112 250.0,112 210.0,168 90.0,168" fill="#B1DDF0" stroke="#FFF" stroke-width="3"/>
  <text x="150" y="136" class="c b">召回</text>
  <text x="150" y="153" class="c sub">向量 + 关键词，约 50 条</text>
  <polygon points="90.0,172 210.0,172 190.0,228 110.0,228" fill="#B0E3E6" stroke="#FFF" stroke-width="3"/>
  <text x="150" y="196" class="c b">重排</text>
  <text x="150" y="213" class="c sub">约 5 条</text>
  <rect x="110" y="236" width="80" height="34" rx="6" fill="#DDD7F6"/>
  <text x="150" y="257.5" class="b c">提示词</text>
  <line x1="238" y1="140" x2="300" y2="140" class="line dash"/>
  <text x="310" y="122" class="b">Embedding 模型：问题和文档分别编码</text>
  <rect x="310" y="134" width="46" height="24" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="333" y="150.5" class="c sub">问题</text>
  <line x1="360" y1="146" x2="378" y2="146" class="arrow "/>
  <rect x="382" y="134" width="46" height="24" rx="3" fill="#E6E6E6"/>
  <text x="405" y="150.5" class="c sub">向量</text>
  <line x1="432" y1="146" x2="470" y2="146" class="line dash"/>
  <text x="451" y="141" class="c sub">比较</text>
  <rect x="474" y="134" width="128" height="24" rx="3" fill="#E6E6E6"/>
  <text x="538" y="150.5" class="c sub">文档向量（提前算好）</text>
  <text x="612" y="151" class="ok">快</text>
  <line x1="208" y1="200" x2="300" y2="200" class="line dash"/>
  <text x="310" y="182" class="b">重排模型：问题和候选拼在一起编码</text>
  <rect x="310" y="194" width="118" height="24" rx="3" fill="#FFFFFF" stroke="#BBB"/>
  <text x="369" y="210.5" class="c sub">问题 + 候选 i</text>
  <line x1="432" y1="206" x2="450" y2="206" class="arrow "/>
  <rect x="454" y="194" width="48" height="24" rx="3" fill="#E6E6E6"/>
  <text x="478" y="210.5" class="c sub">分数</text>
  <text x="612" y="211" class="note">准</text>
  <text x="310" y="238" class="sub">每条候选都要算一遍，只适合少量候选</text>
</svg>
