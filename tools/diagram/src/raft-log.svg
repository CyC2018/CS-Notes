<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Raft 日志复制：SET x = 5</text>
  <text x="162" y="56" class="c sub b" style="fill:#444">① 写入 Leader 的日志</text>
  <text x="80" y="91" class="sub b e" style="fill:#444">Leader</text>
  <rect x="90" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="126" y="90" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="162" y="72" width="72" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="198" y="90" class="c sub mono" style="fill:#444">1 x=5</text>
  <text x="80" y="133" class="sub b e" style="fill:#444">B</text>
  <rect x="90" y="114" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="126" y="132" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="162" y="114" width="72" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="80" y="175" class="sub b e" style="fill:#444">C</text>
  <rect x="90" y="156" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="126" y="174" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="162" y="156" width="72" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="332" y="56" class="c sub b" style="fill:#444">② 复制给 Follower</text>
  <rect x="260" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="296" y="90" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="332" y="72" width="72" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="368" y="90" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="260" y="114" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="296" y="132" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="332" y="114" width="72" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="368" y="132" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="260" y="156" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="296" y="174" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="332" y="156" width="72" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="502" y="56" class="c sub b" style="fill:#444">③ 多数写入后提交</text>
  <rect x="430" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="466" y="90" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="502" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="538" y="90" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="430" y="114" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="466" y="132" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="502" y="114" width="72" height="28" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="538" y="132" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="430" y="156" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="466" y="174" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="502" y="156" width="72" height="28" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="672" y="56" class="c sub b" style="fill:#444">④ 心跳通知 Follower 提交</text>
  <rect x="600" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="636" y="90" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="672" y="72" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="708" y="90" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="600" y="114" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="636" y="132" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="672" y="114" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="708" y="132" class="c sub mono" style="fill:#444">1 x=5</text>
  <rect x="600" y="156" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="636" y="174" class="c sub mono" style="fill:#444">1 y=1</text>
  <rect x="672" y="156" width="72" height="28" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="708" y="174" class="c sub mono" style="fill:#444">1 x=5</text>
  <text x="30" y="236" class="sub">格子中是任期号和命令。浅青色已提交，淡紫色已写入日志但未提交。</text>
  <text x="30" y="254" class="sub">第 ③ 步时 C 还没有写入，但 Leader 和 B 已经构成 3 个节点中的多数，Leader 就可以提交、执行并回复客户端；</text>
  <text x="30" y="272" class="sub">已提交的日志一定在多数节点上，新 Leader 也一定包含它，所以不会丢失。C 落后或宕机恢复后，Leader 再把缺少的日志补给它。</text>
</svg>
