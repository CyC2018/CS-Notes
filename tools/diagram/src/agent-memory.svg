<svg xmlns="http://www.w3.org/2000/svg" width="690" height="340" viewBox="0 0 690 340">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #666; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #777; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #888; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #666; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #666; stroke-width: 1.3; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C0605A" stroke-width="1.6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6A9F68" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="345" y="28" class="title">Agent 的长期记忆</text>
  <rect x="20" y="46" width="300" height="150" rx="8" class="frame"/>
  <text x="30" y="64" class="b">10 月 1 日的会话</text>
  <rect x="35" y="76" width="270" height="30" rx="6" fill="#DDD7F6"/>
  <text x="170" y="95.5" class="c sub">用户：我对花生过敏，推荐个早餐</text>
  <rect x="35" y="116" width="270" height="30" rx="6" fill="#FFFFFF" stroke="#BBB"/>
  <text x="170" y="135.5" class="c sub">助手：推荐燕麦粥和鸡蛋……</text>
  <text x="170" y="176" class="c sub">会话结束后，用模型提取值得保存的信息</text>
  <rect x="402" y="58" width="270" height="110" rx="6" class="shadow"/>
  <rect x="400" y="56" width="270" height="110" rx="6" fill="#B1DDF0"/>
  <text x="410" y="76" class="b">长期记忆（数据库 / 向量库）</text>
  <text x="410" y="100" class="sub">· 用户对花生过敏（10-01）</text>
  <text x="410" y="120" class="sub">· 用户住在杭州（09-12）</text>
  <text x="410" y="140" class="sub">· 用户喜欢简短的回答（08-30）</text>
  <line x1="320" y1="120" x2="396" y2="110" class="arrow "/>
  <text x="358" y="106" class="c">写入</text>
  <rect x="20" y="214" width="650" height="112" rx="8" class="frame"/>
  <text x="30" y="232" class="b">10 月 8 日的新会话</text>
  <rect x="35" y="246" width="160" height="30" rx="6" fill="#DDD7F6"/>
  <text x="115" y="265.5" class="c sub">用户：推荐一款零食</text>
  <rect x="250" y="238" width="190" height="60" rx="4" fill="#FFFFFF" stroke="#BBB"/>
  <text x="260" y="258" class="b">上下文</text>
  <text x="260" y="276" class="sub">相关记忆：用户对花生过敏</text>
  <text x="260" y="292" class="sub">问题：推荐一款零食</text>
  <line x1="198" y1="261" x2="246" y2="261" class="arrow "/>
  <path d="M535,170 C535,200 345,205 345,234" class="arrow dash"/>
  <text x="450" y="210" class="sub">按当前问题检索相关的记忆</text>
  <rect x="490" y="246" width="165" height="30" rx="6" fill="#B0E3E6"/>
  <text x="572.5" y="265.5" class="c sub">推荐海苔，不含花生</text>
  <line x1="443" y1="261" x2="486" y2="261" class="arrow "/>
</svg>
