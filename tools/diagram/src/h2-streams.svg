<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">多路复用：三个请求共用一个 TCP 连接</text>
  <rect x="40" y="70" width="680" height="64" rx="32" fill="#FFFFFF" stroke="#BBBBBB"/>
  <rect x="80" y="86" width="60" height="32" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="110" y="106" class="c sub" style="fill:#444">HEADERS 1</text>
  <rect x="150" y="86" width="60" height="32" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="180" y="106" class="c sub" style="fill:#444">HEADERS 3</text>
  <rect x="220" y="86" width="60" height="32" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="250" y="106" class="c sub" style="fill:#444">DATA 1</text>
  <rect x="290" y="86" width="60" height="32" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="320" y="106" class="c sub" style="fill:#444">HEADERS 5</text>
  <rect x="360" y="86" width="60" height="32" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="390" y="106" class="c sub" style="fill:#444">DATA 3</text>
  <rect x="430" y="86" width="60" height="32" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="460" y="106" class="c sub" style="fill:#444">DATA 1</text>
  <rect x="500" y="86" width="60" height="32" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="530" y="106" class="c sub" style="fill:#444">DATA 5</text>
  <rect x="570" y="86" width="60" height="32" rx="3" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="600" y="106" class="c sub" style="fill:#444">DATA 3</text>
  <rect x="640" y="86" width="60" height="32" rx="3" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="670" y="106" class="c sub" style="fill:#444">DATA 5</text>
  <line x1="700" y1="102" x2="728" y2="102" class="arrow "/>
  <text x="40" y="60" class="sub b" style="fill:#444">一个 TCP 连接</text>
  <text x="40" y="162" class="sub" style="fill:#296898">stream 1：/index.html</text>
  <text x="260" y="162" class="sub" style="fill:#207773">stream 3：/style.css</text>
  <text x="470" y="162" class="sub" style="fill:#766AA8">stream 5：/app.js</text>
  <text x="40" y="196" class="sub">帧可以交错发送，一个响应慢不会挡住其它响应；但 TCP 丢包时所有流都要等重传，这是 HTTP/3 改用 QUIC 的原因。</text>
  <text x="40" y="214" class="sub">客户端发起的流 ID 为奇数。</text>
</svg>
