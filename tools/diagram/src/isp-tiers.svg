  <text x="30" y="370" class="sub">实线：下层 ISP 向上层 ISP 购买接入服务；虚线：对等互连，彼此交换流量、通常不付费。最下面的小圆点是用户。</text>
  <text x="30" y="390" class="sub">两个区域 ISP 通过互联网交换点 IXP 直接相连，流量不必绕经第一层 ISP；大型内容提供商也会自建网络直接与各级 ISP 互连。</text>
