<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="240" y="28" class="title">HASH</text>
  <text x="30" y="58" class="sub b"></text>
  <rect x="30" y="64" width="100" height="28" rx="4" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="80" y="82" class="c sub mono" style="fill:#444">user:1001</text>
  <line x1="134" y1="78" x2="170" y2="78" class="arrow "/>
  <rect x="174" y="50" width="90" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="219" y="66" class="c sub" style="fill:#444">字段</text>
  <rect x="264" y="50" width="120" height="24" rx="3" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="324" y="66" class="c sub" style="fill:#444">值</text>
  <rect x="174" y="74" width="90" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="219" y="91" class="c sub mono" style="fill:#444">name</text>
  <rect x="264" y="74" width="120" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="324" y="91" class="c sub mono" style="fill:#444">alice</text>
  <rect x="174" y="100" width="90" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="219" y="117" class="c sub mono" style="fill:#444">age</text>
  <rect x="264" y="100" width="120" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="324" y="117" class="c sub mono" style="fill:#444">25</text>
  <rect x="174" y="126" width="90" height="26" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="219" y="143" class="c sub mono" style="fill:#444">city</text>
  <rect x="264" y="126" width="120" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="324" y="143" class="c sub mono" style="fill:#444">hangzhou</text>
  <text x="396" y="116" class="sub mono">HGET、HINCRBY</text>
  <text x="396" y="132" class="sub">只读写一个字段</text>
  <text x="30" y="186" class="sub">一个键下存放多个字段和值，适合存储对象，修改一个字段不用读出整个对象。</text>
