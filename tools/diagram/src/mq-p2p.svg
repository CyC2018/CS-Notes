  <circle cx="519" cy="156.5" r="2" fill="#7FB2D6"/>
  <line x1="526" y1="156.5" x2="541" y2="156.5" stroke="#7FB2D6" stroke-width="1"/>
  <rect x="512" y="166" width="36" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <circle cx="519" cy="172.5" r="2" fill="#7FB2D6"/>
  <line x1="526" y1="172.5" x2="541" y2="172.5" stroke="#7FB2D6" stroke-width="1"/>
  <text x="560" y="168" class="b">物流服务 2</text>
  <text x="560" y="186" class="sub mono">收到 1025</text>
  <line x1="404" y1="108" x2="508" y2="170" class="arrow "/>
  <text x="30" y="228" class="sub">多个消费者从同一个队列取消息，分担处理工作；一条消息被某个消费者确认后就从队列中删除。</text>
