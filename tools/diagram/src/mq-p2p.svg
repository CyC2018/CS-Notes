  <text x="70" y="186" class="c sub">生产者</text>
  <text x="310" y="82" class="c sub mono">队列 order.created</text>
  <rect x="230" y="94" width="170" height="28" rx="14" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.2"/>
  <rect x="240" y="98" width="47.3333" height="20" rx="3" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
