<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">Java 内存模型：线程读写自己的工作内存，通过主内存交换数据</text>
  <rect x="30" y="60" width="110" height="44" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="85" y="86.5" class="c sub b">线程 1</text>
  <rect x="220" y="60" width="170" height="44" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="305" y="80" class="b c">工作内存</text>
  <text x="305" y="95" class="sub c">cnt = 1</text>
  <line x1="140" y1="82" x2="220" y2="82" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="390" y1="82" x2="520" y2="162" stroke="#888" stroke-dasharray="4 3"/>
  <text x="305" y="120" class="c sub note">已修改，还没写回</text>
  <rect x="30" y="130" width="110" height="44" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="85" y="156.5" class="c sub b">线程 2</text>
  <rect x="220" y="130" width="170" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="305" y="150" class="b c">工作内存</text>
  <text x="305" y="165" class="sub c">cnt = 0</text>
  <line x1="140" y1="152" x2="220" y2="152" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="390" y1="152" x2="520" y2="162" stroke="#888" stroke-dasharray="4 3"/>
  <text x="305" y="190" class="c sub ">读到的是旧值</text>
  <rect x="30" y="200" width="110" height="44" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="85" y="226.5" class="c sub b">线程 3</text>
  <rect x="220" y="200" width="170" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="305" y="220" class="b c">工作内存</text>
  <text x="305" y="235" class="sub c">cnt = 0</text>
  <line x1="140" y1="222" x2="220" y2="222" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="390" y1="222" x2="520" y2="162" stroke="#888" stroke-dasharray="4 3"/>
  <rect x="520" y="140" width="190" height="44" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="615" y="160" class="b c">主内存</text>
  <text x="615" y="175" class="sub c">cnt = 0</text>
  <text x="24" y="280" class="sub">工作内存是对寄存器、缓存等的抽象。线程 1 把 cnt 改为 1 但还没有写回主内存，线程 2 读到的仍然是 0。</text>
</svg>
