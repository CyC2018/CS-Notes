  <text x="30" y="352" class="sub">4 KB 的页需要 12 位偏移量，16 位地址剩下的 4 位就是页号，页表一共 16 项。</text>
  <text x="30" y="370" class="sub">如果查到的“存在”位是 0（例如页 4），说明这一页不在内存中，CPU 触发缺页中断。</text>
