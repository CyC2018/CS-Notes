<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">LoRA：只训练两个小矩阵</text>
  <rect x="40" y="60" width="160" height="160" fill="#EAE9E7" stroke="#BBB"/>
  <text x="120" y="136" class="c b">W</text>
  <text x="120" y="154" class="c sub">4096 × 4096</text>
  <text x="120" y="240" class="c sub">冻结，不更新</text>
  <text x="230" y="146" class="c b">+</text>
  <rect x="260" y="60" width="12" height="160" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="266" y="240" class="c b">B</text>
  <text x="266" y="256" class="c sub">4096 × 8</text>
  <text x="290" y="146" class="c b">×</text>
  <rect x="306" y="134" width="160" height="12" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="386" y="124" class="c sub">A：8 × 4096</text>
  <text x="386" y="240" class="c sub">只训练 B 和 A</text>
  <text x="500" y="80" class="b">参数量（r = 8）</text>
  <text x="500" y="104" class="sub">全量微调：16,777,216</text>
  <text x="500" y="124" class="sub">LoRA：2 × 4096 × 8</text>
  <text x="530" y="144" class="sub">= 65,536（0.39%）</text>
  <text x="500" y="184" class="b">训练完成后：</text>
  <text x="500" y="204" class="sub mono">W' = W + BA</text>
  <text x="500" y="224" class="ok">合并后推理没有额外开销</text>
  <text x="40" y="278" class="sub">输出 h = Wx + BAx。B 初始化为 0，训练开始时模型与原模型完全相同</text>
</svg>
