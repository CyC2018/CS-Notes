<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">虚拟机与容器</text>
  <text x="190" y="56" class="c b">虚拟机</text>
  <rect x="40" y="66" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="112.5" y="85.5" class="c sub">App A</text>
  <rect x="195" y="66" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="267.5" y="85.5" class="c sub">App B</text>
  <rect x="40" y="102" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="112.5" y="121.5" class="c sub">依赖库</text>
  <rect x="195" y="102" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="267.5" y="121.5" class="c sub">依赖库</text>
  <rect x="40" y="138" width="145" height="30" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="112.5" y="157.5" class="c sub">客户机 OS</text>
  <rect x="195" y="138" width="145" height="30" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="267.5" y="157.5" class="c sub">客户机 OS</text>
  <rect x="40" y="174" width="300" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="190" y="193.5" class="c sub">Hypervisor</text>
  <rect x="40" y="210" width="300" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="190" y="229.5" class="c sub">宿主机 OS</text>
  <rect x="40" y="246" width="300" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="190" y="265.5" class="c sub">服务器</text>
  <text x="560" y="56" class="c b">容器</text>
  <rect x="410" y="66" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="482.5" y="85.5" class="c sub">App A</text>
  <rect x="565" y="66" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="637.5" y="85.5" class="c sub">App B</text>
  <rect x="410" y="102" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="482.5" y="121.5" class="c sub">依赖库</text>
  <rect x="565" y="102" width="145" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="637.5" y="121.5" class="c sub">依赖库</text>
  <rect x="410" y="138" width="300" height="30" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="560" y="157.5" class="c sub">容器运行时（Docker Engine）</text>
  <rect x="410" y="174" width="300" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="560" y="193.5" class="c sub">宿主机 OS（共享一个内核）</text>
  <rect x="410" y="210" width="300" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="560" y="229.5" class="c sub">服务器</text>
  <text x="30" y="296" class="sub">虚拟机为每个应用运行一个完整的操作系统，启动要几十秒、占用 GB 级内存；容器只是宿主机上隔离的进程，</text>
  <text x="30" y="314" class="sub">共享宿主机的内核，启动通常在 1 秒以内。代价是隔离性不如虚拟机，也不能在 Linux 宿主机上直接运行 Windows 容器。</text>
</svg>
