  <path d="M488,192 V198 L492.5,201" fill="none" stroke="#888" stroke-width="1.4" stroke-linecap="round"/>
  <text x="504" y="202" class="sub">EXPIRE 604800：7 天后自动删除</text>
  <text x="470" y="222" class="sub">超过一周不能再点赞，也不再占用内存</text>
