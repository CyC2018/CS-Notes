<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">OSI 七层、五层协议与 TCP/IP 四层</text>
  <text x="90" y="66" class="c b">OSI</text>
  <text x="230" y="66" class="c b">五层协议</text>
  <text x="370" y="66" class="c b">TCP/IP</text>
  <text x="520" y="66" class="c b">例子</text>
  <text x="680" y="66" class="c b">数据单位</text>
  <rect x="30" y="80" width="120" height="30" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="90" y="99.5" class="c sub b">应用层</text>
  <rect x="30" y="114" width="120" height="30" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="90" y="133.5" class="c sub b">表示层</text>
  <rect x="30" y="148" width="120" height="30" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="90" y="167.5" class="c sub b">会话层</text>
  <rect x="30" y="182" width="120" height="30" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="90" y="201.5" class="c sub b">传输层</text>
  <rect x="30" y="216" width="120" height="30" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="90" y="235.5" class="c sub b">网络层</text>
  <rect x="30" y="250" width="120" height="30" rx="4" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="90" y="269.5" class="c sub b">数据链路层</text>
  <rect x="30" y="284" width="120" height="30" rx="4" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="90" y="303.5" class="c sub b">物理层</text>
  <rect x="170" y="80" width="120" height="98" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="230" y="133.5" class="c sub b">应用层</text>
  <rect x="170" y="182" width="120" height="30" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="230" y="201.5" class="c sub b">传输层</text>
  <rect x="170" y="216" width="120" height="30" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="230" y="235.5" class="c sub b">网络层</text>
  <rect x="170" y="250" width="120" height="30" rx="4" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="230" y="269.5" class="c sub b">数据链路层</text>
  <rect x="170" y="284" width="120" height="30" rx="4" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="230" y="303.5" class="c sub b">物理层</text>
  <rect x="310" y="80" width="120" height="98" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="370" y="133.5" class="c sub b">应用层</text>
  <rect x="310" y="182" width="120" height="30" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="370" y="201.5" class="c sub b">传输层</text>
  <rect x="310" y="216" width="120" height="30" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="370" y="235.5" class="c sub b">网际层</text>
  <rect x="310" y="250" width="120" height="64" rx="4" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="370" y="286.5" class="c sub b">网络接口层</text>
  <text x="520" y="133" class="c sub" style="fill:#444">HTTP、DNS、SMTP</text>
  <text x="680" y="133" class="c sub">报文</text>
  <text x="520" y="201" class="c sub" style="fill:#444">TCP、UDP</text>
  <text x="680" y="201" class="c sub">报文段、用户数据报</text>
  <line x1="450" y1="180" x2="750" y2="180" stroke="#E5E5E5"/>
  <text x="520" y="235" class="c sub" style="fill:#444">IP、ICMP</text>
  <text x="680" y="235" class="c sub">分组（IP 数据报）</text>
  <line x1="450" y1="214" x2="750" y2="214" stroke="#E5E5E5"/>
  <text x="520" y="269" class="c sub" style="fill:#444">以太网、PPP</text>
  <text x="680" y="269" class="c sub">帧</text>
  <line x1="450" y1="248" x2="750" y2="248" stroke="#E5E5E5"/>
  <text x="520" y="303" class="c sub" style="fill:#444">双绞线、光纤上的信号</text>
  <text x="680" y="303" class="c sub">比特</text>
  <line x1="450" y1="282" x2="750" y2="282" stroke="#E5E5E5"/>
  <text x="30" y="336" class="sub">五层协议把 OSI 的应用层、表示层、会话层合并为应用层；TCP/IP 再把数据链路层和物理层合并为网络接口层。</text>
</svg>
