<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">以太网帧：一个 ARP 请求帧</text>
  <rect x="6" y="96" width="60" height="46" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/>
  <text x="36" y="116" class="c sub">前同步码</text>
  <text x="36" y="132" class="c sub">8 字节</text>
  <rect x="70" y="96" width="150" height="46" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="145" y="116" class="c b">目的地址</text>
  <text x="145" y="132" class="c sub mono">ff:ff:ff:ff:ff:ff</text>
  <text x="145" y="86" class="c sub">6 字节</text>
  <rect x="220" y="96" width="150" height="46" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1"/>
  <text x="295" y="116" class="c b">源地址</text>
  <text x="295" y="132" class="c sub mono">00:1a:2b:3c:4d:0a</text>
  <text x="295" y="86" class="c sub">6 字节</text>
  <rect x="370" y="96" width="70" height="46" fill="#E6E3FA" stroke="#B8B0DE" stroke-width="1"/>
  <text x="405" y="116" class="c b">类型</text>
  <text x="405" y="132" class="c sub mono">0x0806</text>
  <text x="405" y="86" class="c sub">2 字节</text>
  <rect x="440" y="96" width="140" height="46" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1"/>
  <text x="510" y="116" class="c b">数据</text>
  <text x="510" y="132" class="c sub">ARP 请求 28 字节</text>
  <rect x="580" y="96" width="90" height="46" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="625" y="116" class="c b">填充</text>
  <text x="625" y="132" class="c sub">18 个 0</text>
  <rect x="670" y="96" width="70" height="46" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1"/>
  <text x="705" y="116" class="c b">FCS</text>
  <text x="705" y="132" class="c sub">CRC-32</text>
  <text x="705" y="86" class="c sub">4 字节</text>
  <path d="M442,88 q0,-8 8,-8 H549 q6,0 6,-6 q0,6 6,6 H660 q8,0 8,8" class="line"/>
  <text x="555" y="70" class="c sub">46 字节（数据部分的最小值）</text>
  <path d="M72,152 q0,8 8,8 H399.0 q6,0 6,6 q0,-6 6,-6 H730 q8,0 8,-8" class="line"/>
  <text x="405" y="184" class="c sub b">帧长 6 + 6 + 2 + 46 + 4 = 64 字节，正好是最短帧长</text>
  <text x="30" y="220" class="sub">目的地址全 1 表示广播；类型 0x0806 表示数据部分是 ARP 分组，IPv4 数据报是 0x0800。</text>
  <text x="30" y="240" class="sub">ARP 请求只有 28 字节，不足 46 字节，发送时补 18 个字节的 0，接收端根据上层协议中的长度去掉填充。</text>
  <text x="30" y="260" class="sub">FCS 是对目的地址到数据部分计算的 CRC-32；前同步码由物理层加上，用于同步时钟，不算在帧长内。</text>
  <text x="30" y="280" class="sub">数据部分最多 1500 字节，所以帧长在 64～1518 字节之间。</text>
</svg>
