<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="370" y="28" class="title">setMeasurements(1, 1, 1) 之后发生了什么</text>
  <rect x="30" y="46" width="160" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="110" y="65.5" class="c sub b">WeatherStation</text>
  <line x1="110" y1="78" x2="110" y2="250" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="220" y="46" width="160" height="30" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="300" y="65.5" class="c sub b">WeatherData</text>
  <line x1="300" y1="78" x2="300" y2="250" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="400" y="46" width="160" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="480" y="65.5" class="c sub b">CurrentConditionsDisplay</text>
  <line x1="480" y1="78" x2="480" y2="250" stroke="#BBB" stroke-dasharray="4 4"/>
  <rect x="570" y="46" width="160" height="30" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="650" y="65.5" class="c sub b">StatisticsDisplay</text>
  <line x1="650" y1="78" x2="650" y2="250" stroke="#BBB" stroke-dasharray="4 4"/>
  <line x1="110" y1="104" x2="300" y2="104" class="arrow "/>
  <text x="205" y="98" class="c sub mono" style="fill:#444">setMeasurements(1, 1, 1)</text>
  <path d="M300,126 h26 v18 h-24" class="arrow"/>
  <text x="332" y="140" class="sub mono" style="fill:#444">notifyObserver()</text>
  <line x1="300" y1="170" x2="480" y2="170" class="arrow "/>
  <text x="390" y="164" class="c sub mono" style="fill:#444">update(1.0, 1.0, 1.0)</text>
  <line x1="300" y1="210" x2="650" y2="210" class="arrow "/>
  <text x="515" y="204" class="c sub mono" style="fill:#444">update(1.0, 1.0, 1.0)</text>
  <text x="30" y="276" class="sub">实际输出：CurrentConditionsDisplay.update: 1.0 1.0 1.0，接着是 StatisticsDisplay.update: 1.0 1.0 1.0，顺序与注册的顺序相同。</text>
</svg>
