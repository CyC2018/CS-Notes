<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="320" y="28" class="title">中介者：网状依赖变成星形</text>
  <rect x="70" y="58" width="140" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="140" y="84.5" class="c sub b">Alarm</text>
  <rect x="430" y="58" width="140" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="500" y="84.5" class="c sub b">CoffeePot</text>
  <rect x="70" y="208" width="140" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="140" y="234.5" class="c sub b">Calendar</text>
  <rect x="430" y="208" width="140" height="44" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="500" y="234.5" class="c sub b">Sprinkler</text>
  <rect x="250" y="133" width="140" height="44" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="320" y="159.5" class="c sub b">Mediator</text>
  <line x1="212" y1="90" x2="248" y2="143" class="arrow "/>
  <line x1="428" y1="90" x2="392" y2="143" class="arrow "/>
  <line x1="212" y1="220" x2="248" y2="167" class="arrow "/>
  <line x1="428" y1="220" x2="392" y2="167" class="arrow "/>
  <text x="320" y="286" class="c sub">每个对象只把事件交给 Mediator，由它决定通知谁，例如闹钟响了就调用咖啡壶、日历和喷头。</text>
</svg>
