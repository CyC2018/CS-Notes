<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="360" y="28" class="title">每种资源只有一个：在资源分配图中找环</text>
  <circle cx="110" cy="90" r="20" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <text x="110" y="94" class="c sub b" style="fill:#444">P1</text>
  <circle cx="390" cy="90" r="20" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <text x="390" y="94" class="c sub b" style="fill:#444">P2</text>
  <circle cx="250" cy="250" r="20" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <text x="250" y="254" class="c sub b" style="fill:#444">P3</text>
  <circle cx="560" cy="250" r="20" fill="#C6ECE9" stroke="#7DBCB7" stroke-width="1.2"/>
  <text x="560" y="254" class="c sub b" style="fill:#444">P4</text>
  <rect x="231" y="71" width="38" height="38" rx="4" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="250" y="94" class="c sub b" style="fill:#444">R1</text>
  <rect x="461" y="151" width="38" height="38" rx="4" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="480" y="174" class="c sub b" style="fill:#444">R2</text>
  <rect x="91" y="231" width="38" height="38" rx="4" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="110" y="254" class="c sub b" style="fill:#444">R3</text>
  <rect x="621" y="91" width="38" height="38" rx="4" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <text x="640" y="114" class="c sub b" style="fill:#444">R4</text>
  <line x1="131" y1="90" x2="229" y2="90" class="arrow red"/>
  <line x1="271" y1="90" x2="369" y2="90" class="arrow red"/>
  <line x1="405.696" y1="103.952" x2="464.304" y2="156.048" class="arrow red"/>
  <line x1="460.166" y1="176.899" x2="269.834" y2="243.101" class="arrow red"/>
  <line x1="229" y1="250" x2="131" y2="250" class="arrow red"/>
  <line x1="110" y1="229" x2="110" y2="111" class="arrow red"/>
  <line x1="545.151" y1="235.151" x2="494.849" y2="184.849" class="arrow "/>
  <line x1="629.581" y1="128.233" x2="570.419" y2="231.767" class="arrow "/>
  <text x="360" y="312" class="c sub">资源指向进程表示已分配，进程指向资源表示正在请求。红色的边构成环 P1 → R1 → P2 → R2 → P3 → R3 → P1，</text>
  <text x="360" y="328" class="c sub">三个进程互相等待，发生死锁；P4 不在环上，但它请求的 R2 被 P2 持有，也会一直等下去。</text>
</svg>
