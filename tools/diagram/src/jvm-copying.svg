  <path d="M266,104 C300,130 400,120 440,138" class="arrow"/>
  <text x="120" y="200" class="sub">只需要处理存活的对象，复制后自然是连续的；代价是始终有一半内存空着。</text>
  <text x="120" y="218" class="sub">新生代的对象大多很快死亡，所以 HotSpot 用 Eden 和两个 Survivor（默认 8:1:1）代替两个等大的半区。</text>
  <rect x="30" y="240" width="18" height="14" rx="3" fill="#C6ECE9" stroke="#BBB"/>
  <text x="54" y="252" class="sub">存活对象</text>
