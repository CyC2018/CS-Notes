<svg xmlns="http://www.w3.org/2000/svg" width="760" height="739" viewBox="0 0 760 739">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">备忘录的类图（计算器）</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="30" y="60" width="401" height="137" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="230.5" y="77" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="230.5" y="92" class="c b mono" style="font-size:12px;fill:#3F3F3F">Calculator</text>
  <text x="230.5" y="105" class="c sub" style="font-size:10px">（Originator）</text>
  <line x1="30" y1="114" x2="431" y2="114" stroke="#B8B0DE"/>
  <text x="39" y="129.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ backupLastCalculation(): PreviousCalculationToCareTaker</text>
  <text x="39" y="144.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ restorePreviousCalculation(PreviousCalculationToCareTaker)</text>
  <text x="39" y="159.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ getCalculationResult(): int</text>
  <text x="39" y="174.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ setFirstNumber(int)</text>
  <text x="39" y="189.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ setSecondNumber(int)</text>
  <rect x="119" y="247" width="142" height="67" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="190" y="267" class="c b mono" style="font-size:12px;fill:#3F3F3F">CalculatorImp</text>
  <line x1="119" y1="276" x2="261" y2="276" stroke="#7FB2D6"/>
  <text x="128" y="291.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- firstNumber: int</text>
  <text x="128" y="306.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- secondNumber: int</text>
  <path d="M190,247 L190,198" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <rect x="562" y="100" width="96" height="42" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="610" y="120" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <text x="610" y="133" class="c sub" style="font-size:10px">（Caretaker）</text>
  <path d="M562,121 L431,121" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="496.5" y="115" class="c sub" style="font-size:10.5px">backup、restore</text>
  <rect x="65" y="374" width="250" height="92" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="190" y="391" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="190" y="406" class="c b mono" style="font-size:12px;fill:#3F3F3F">PreviousCalculationToOriginator</text>
  <text x="190" y="419" class="c sub" style="font-size:10px">（宽接口）</text>
  <line x1="65" y1="428" x2="315" y2="428" stroke="#B8B0DE"/>
  <text x="74" y="443.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ getFirstNumber(): int</text>
  <text x="74" y="458.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ getSecondNumber(): int</text>
  <rect x="488.5" y="374" width="243" height="54" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="610" y="391" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="610" y="406" class="c b mono" style="font-size:12px;fill:#3F3F3F">PreviousCalculationToCareTaker</text>
  <text x="610" y="419" class="c sub" style="font-size:10px">（窄接口，没有方法）</text>
  <path d="M190,314 L190,374" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="198" y="348" class="sub" style="font-size:10.5px">restore 时强转为宽接口</text>
  <path d="M610,142 L610,374" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="618" y="262" class="sub" style="font-size:10.5px">只保存，不能读取</text>
  <rect x="281.5" y="526" width="237" height="133" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="400" y="546" class="c b mono" style="font-size:12px;fill:#3F3F3F">PreviousCalculationImp</text>
  <text x="400" y="559" class="c sub" style="font-size:10px">（Memento）</text>
  <line x1="281.5" y1="568" x2="518.5" y2="568" stroke="#7FB2D6"/>
  <text x="290.5" y="583.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- firstNumber: int</text>
  <text x="290.5" y="598.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">- secondNumber: int</text>
  <line x1="281.5" y1="606" x2="518.5" y2="606" stroke="#7FB2D6"/>
  <text x="290.5" y="621.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ PreviousCalculationImp(int, int)</text>
  <text x="290.5" y="636.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ getFirstNumber(): int</text>
  <text x="290.5" y="651.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ getSecondNumber(): int</text>
  <path d="M352.6,526 L352.6,496 L190,496 L190,467" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M447.4,526 L447.4,496 L610,496 L610,429" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M119,280.5 L16,280.5 L16,592.5 L281.5,592.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="24" y="586.5" class="sub" style="font-size:10.5px">backup 时创建</text>
  <line x1="30" y1="693" x2="64" y2="693" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="72" y="697" class="sub">实现</text>
  <line x1="116" y1="693" x2="150" y2="693" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="158" y="697" class="sub">依赖（创建、调用）</text>
  <rect x="279" y="686" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="303" y="697" class="sub">接口</text>
  <rect x="343" y="686" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="367" y="697" class="sub">类</text>
  <rect x="396" y="686" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="420" y="697" class="sub">客户端</text>
  <text x="475" y="697" class="sub">+ public，- private</text>
  <text x="30" y="719" class="sub" style="fill:#3F3F3F">备份时得到的 memento 声明为窄接口，Client 只能保存和传回；只有 CalculatorImp 会把它强转为宽接口读出两个数。</text>
</svg>
