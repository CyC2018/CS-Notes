<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">跳过暂存区：git commit -a 与 git checkout HEAD --</text>
  <rect x="40" y="118" width="180" height="92" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="130" y="142" class="c b">工作区</text>
  <rect x="62" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7DBCB7"/>
  <text x="130" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v3</text>
  <rect x="290" y="118" width="180" height="92" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="380" y="142" class="c b">暂存区（Stage）</text>
  <rect x="312" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7FB2D6"/>
  <text x="380" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v2</text>
  <rect x="540" y="118" width="180" height="92" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="630" y="142" class="c b">History</text>
  <text x="630" y="159" class="c sub">HEAD 所指的提交</text>
  <rect x="562" y="172" width="136" height="28" rx="4" fill="#FFFFFF" stroke="#7FB2D6"/>
  <text x="630" y="190" class="c sub mono" style="fill:#3F3F3F">readme.txt: v1</text>
  <path d="M130,116 Q380.0,56 630,118" class="arrow "/>
  <text x="380" y="52" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git commit -a</text>
  <text x="380" y="70" class="c sub">已跟踪文件的修改先写入暂存区再提交，新提交中是 v3</text>
  <path d="M600,212 Q495.0,252 390,210" class="arrow "/>
  <path d="M660,212 Q395.0,300 130,210" class="arrow "/>
  <text x="395" y="286" class="c mono" style="font-size:11.5px;fill:#3F3F3F">git checkout HEAD -- readme.txt</text>
  <text x="395" y="304" class="c sub">用 HEAD 中的 v1 同时覆盖暂存区和工作区，v2、v3 都被丢弃</text>
  <text x="30" y="340" class="sub" text-anchor="start" xml:space="preserve"><tspan class="mono" style="font-size:11px;fill:#3F3F3F">git commit -a</tspan><tspan> 不会提交未跟踪的文件：同时新建的 new.txt 提交后仍显示为 </tspan><tspan class="mono" style="font-size:11px;fill:#3F3F3F">?? new.txt</tspan><tspan>。</tspan></text>
</svg>
