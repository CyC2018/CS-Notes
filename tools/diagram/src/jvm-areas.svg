<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">运行时数据区域（JDK 8 及以后）</text>
  <rect x="24" y="52" width="712" height="274" rx="8" class="frame"/>
  <text x="34" y="70" class="b">JVM 进程</text>
  <rect x="44" y="86" width="156" height="170" rx="6" fill="none" stroke="#BBB" stroke-dasharray="4 3"/>
  <text x="122" y="104" class="c sub b">线程 1</text>
  <rect x="54" y="114" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="122" y="137.5" class="b c">程序计数器</text>
  <rect x="54" y="160" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="122" y="177" class="b c">Java 虚拟机栈</text>
  <text x="122" y="192" class="sub c">栈帧</text>
  <rect x="54" y="206" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="122" y="229.5" class="b c">本地方法栈</text>
  <rect x="214" y="86" width="156" height="170" rx="6" fill="none" stroke="#BBB" stroke-dasharray="4 3"/>
  <text x="292" y="104" class="c sub b">线程 2</text>
  <rect x="224" y="114" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="292" y="137.5" class="b c">程序计数器</text>
  <rect x="224" y="160" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="292" y="177" class="b c">Java 虚拟机栈</text>
  <text x="292" y="192" class="sub c">栈帧</text>
  <rect x="224" y="206" width="136" height="38" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="292" y="229.5" class="b c">本地方法栈</text>
  <text x="200" y="280" class="c sub">线程私有，随线程创建和销毁</text>
  <rect x="390" y="86" width="326" height="86" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="553" y="112" class="c b">堆</text>
  <text x="553" y="136" class="c sub">对象和数组，分为新生代和老年代</text>
  <text x="553" y="154" class="c sub">JDK 7 起字符串常量池、静态变量也在这里</text>
  <text x="553" y="190" class="c sub">线程共享</text>
  <rect x="390" y="210" width="326" height="60" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="553" y="238" class="b c">元空间（方法区的实现）</text>
  <text x="553" y="253" class="sub c">类的元数据、运行时常量池</text>
  <text x="553" y="290" class="c sub">元空间在本地内存中，JDK 8 起取代永久代</text>
  <rect x="24" y="340" width="712" height="40" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="380" y="358" class="b c">直接内存</text>
  <text x="380" y="373" class="sub c">NIO 的 DirectByteBuffer 分配的堆外内存，不属于运行时数据区域</text>
</svg>
