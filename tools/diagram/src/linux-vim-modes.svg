<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">VIM 的三种模式</text>
  <rect x="170" y="60" width="230" height="110" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="285" y="84" class="c b">一般指令模式</text>
  <text x="285" y="106" class="c sub">h j k l 移动光标，/word 向下搜索</text>
  <text x="285" y="123" class="c sub">dd 删除一行，yy 复制、p 粘贴</text>
  <text x="285" y="140" class="c sub">u 撤销</text>
  <rect x="520" y="60" width="200" height="110" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="620" y="84" class="c b">编辑模式</text>
  <text x="620" y="106" class="c sub">输入、删除文字</text>
  <text x="620" y="123" class="c sub">底部显示 -- INSERT --</text>
  <rect x="170" y="220" width="230" height="92" rx="6" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="285" y="244" class="c b">指令列模式</text>
  <text x="285" y="266" class="c sub">:w 保存，:q 退出，:q! 不保存退出</text>
  <text x="285" y="283" class="c sub">:%s/old/new/g 全文替换</text>
  <line x1="40" y1="115" x2="168" y2="115" class="arrow "/>
  <text x="104" y="106" class="c sub">vim file 打开</text>
  <line x1="400" y1="98" x2="518" y2="98" class="arrow "/>
  <text x="459" y="90" class="c sub mono" style="fill:#3F3F3F">i I a A o O</text>
  <line x1="518" y1="138" x2="400" y2="138" class="arrow "/>
  <text x="459" y="156" class="c sub mono" style="fill:#3F3F3F">Esc</text>
  <line x1="240" y1="170" x2="240" y2="218" class="arrow "/>
  <text x="232" y="199" class="e sub mono b" style="fill:#3F3F3F;font-size:13px">:</text>
  <line x1="330" y1="218" x2="330" y2="170" class="arrow "/>
  <text x="338" y="192" class="sub">Enter 执行命令后返回</text>
  <text x="338" y="208" class="sub">Esc 放弃输入</text>
  <text x="430" y="250" class="sub">i 在光标前插入，a 在光标后插入，o 在下方新开一行；</text>
  <text x="430" y="268" class="sub">大写的 I、A、O 分别在行首、行尾、上方。</text>
  <text x="430" y="286" class="sub">:wq 保存后退出 VIM，不再回到一般指令模式。</text>
</svg>
