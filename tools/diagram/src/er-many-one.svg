<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">多对一联系：箭头指向“一”的一方</text>
  <rect x="60" y="110" width="120" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="120" y="134.5" class="c sub b">Student</text>
  <path d="M300.0,130 L360,102.0 L420.0,130 L360,158.0 z" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="360" y="134" class="c sub b">BelongsTo</text>
  <rect x="540" y="110" width="120" height="40" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="600" y="134.5" class="c sub b">Department</text>
  <line x1="180" y1="130" x2="300" y2="130" class="line"/>
  <line x1="420" y1="130" x2="538" y2="130" class="arrow "/>
  <ellipse cx="70" cy="60" rx="48" ry="17" fill="#FFFFFF" stroke="#BFBEBA"/>
  <text x="70" y="64" class="c sub" text-decoration="underline">sno</text>
  <ellipse cx="170" cy="60" rx="48" ry="17" fill="#FFFFFF" stroke="#BFBEBA"/>
  <text x="170" y="64" class="c sub">name</text>
  <line x1="80" y1="77" x2="105" y2="110" class="line"/>
  <line x1="160" y1="77" x2="135" y2="110" class="line"/>
  <ellipse cx="600" cy="60" rx="48" ry="17" fill="#FFFFFF" stroke="#BFBEBA"/>
  <text x="600" y="64" class="c sub" text-decoration="underline">dept_no</text>
  <line x1="600" y1="77" x2="600" y2="110" class="line"/>
  <text x="30" y="210" class="sub">每个学生只属于一个院系，一个院系有多个学生：Student 到 Department 是多对一，箭头指向 Department。</text>
  <text x="30" y="230" class="sub">一对一时两端都画箭头，多对多时两端都不画箭头。</text>
  <text x="30" y="250" class="sub">带下划线的属性是主键。</text>
</svg>
