<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">主从复制（MySQL 8.0 本机实测的线程）</text>
  <rect x="20" y="46" width="250" height="200" rx="8" class="frame"/>
  <text x="30" y="64" class="b">主库 :3307</text>
  <rect x="400" y="46" width="340" height="200" rx="8" class="frame"/>
  <text x="410" y="64" class="b">从库 :3308</text>
  <path d="M47,86 v34 a23,6 0 0 0 46,0 v-34" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <ellipse cx="70" cy="86" rx="23" ry="6" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M47,103 a23,6 0 0 0 46,0" fill="none" stroke="#7FB2D6" stroke-width="1"/>
  <text x="70" y="144" class="c sub">数据</text>
  <path d="M160,82 h29 l9,9 v37 h-38 z" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <path d="M189,82 v9 h9" fill="none" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="166" y1="99" x2="191" y2="99" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="166" y1="106" x2="191" y2="106" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="166" y1="113" x2="191" y2="113" stroke="#BFBEBA" stroke-width="1"/>
  <text x="214" y="110" class="sub mono">binlog</text>
  <line x1="96" y1="104" x2="156" y2="104" class="arrow "/>
  <text x="126" y="96" class="c sub">提交</text>
  <rect x="110" y="180" width="140" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="180" y="202.5" class="c sub">Binlog Dump 线程</text>
  <line x1="179" y1="130" x2="179" y2="178" class="arrow "/>
  <rect x="420" y="180" width="120" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="480" y="202.5" class="c sub">I/O 线程</text>
  <line x1="252" y1="198" x2="418" y2="198" class="arrow "/>
  <text x="335" y="190" class="c sub">发送 binlog 事件</text>
  <path d="M461,82 h29 l9,9 v37 h-38 z" fill="#EAE9E7" stroke="#BFBEBA" stroke-width="1.2"/>
  <path d="M490,82 v9 h9" fill="none" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="467" y1="99" x2="492" y2="99" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="467" y1="106" x2="492" y2="106" stroke="#BFBEBA" stroke-width="1"/>
  <line x1="467" y1="113" x2="492" y2="113" stroke="#BFBEBA" stroke-width="1"/>
  <text x="454" y="110" class="sub mono e">relay log</text>
  <line x1="480" y1="178" x2="480" y2="132" class="arrow "/>
  <rect x="580" y="180" width="140" height="36" rx="6" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="650" y="202.5" class="c sub">SQL 线程 + 4 个 worker</text>
  <path d="M502,104 C560,104 610,140 630,178" class="arrow"/>
  <path d="M647,86 v34 a23,6 0 0 0 46,0 v-34" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <ellipse cx="670" cy="86" rx="23" ry="6" fill="#C6E4FB" stroke="#7FB2D6" stroke-width="1.2"/>
  <path d="M647,103 a23,6 0 0 0 46,0" fill="none" stroke="#7FB2D6" stroke-width="1"/>
  <text x="700" y="110" class="sub">数据</text>
  <line x1="670" y1="178" x2="670" y2="130" class="arrow "/>
  <text x="30" y="272" class="sub">主库提交时不等从库，从库落后的时间就是复制延迟。8.0.27 起默认 4 个 worker 并行重放（replica_parallel_workers = 4）。</text>
</svg>
