<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; fill: #3F3F3F; font-size: 12px; }
    .title { font-weight: bold; font-size: 15px; fill: #333; text-anchor: middle; }
    .b { font-weight: bold; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .sub { font-size: 11px; fill: #6E6E6E; }
    .note { fill: #C0605A; }
    .ok { fill: #6A9F68; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.1; fill: none; marker-end: url(#a); }
    .red { stroke: #C0605A; marker-end: url(#r); }
    .green { stroke: #6A9F68; marker-end: url(#g); }
    .dash { stroke-dasharray: 5 4; }
    .line { stroke: #555; stroke-width: 1.1; fill: none; }
    .frame { fill: none; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
    .shadow { fill: #DADADA; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#555"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#C0605A"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9.5,5 L1,8.5 z" fill="#6A9F68"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <text x="380" y="28" class="title">适配器的类图（火鸡冒充鸭子）</text>
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#555" stroke-width="1"/></marker></defs>
  <rect x="252" y="70" width="96" height="77" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="300" y="87" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="300" y="102" class="c b mono" style="font-size:12px;fill:#3F3F3F">Duck</text>
  <text x="300" y="115" class="c sub" style="font-size:10px">（Target）</text>
  <line x1="252" y1="124" x2="348" y2="124" stroke="#B8B0DE"/>
  <text x="261" y="139.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ quack()</text>
  <rect x="216.5" y="207" width="167" height="103" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="300" y="227" class="c b mono" style="font-size:12px;fill:#3F3F3F">TurkeyAdapter</text>
  <text x="300" y="240" class="c sub" style="font-size:10px">（Adapter）</text>
  <line x1="216.5" y1="249" x2="383.5" y2="249" stroke="#7FB2D6"/>
  <text x="225.5" y="264.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">~ turkey: Turkey</text>
  <line x1="216.5" y1="272" x2="383.5" y2="272" stroke="#7FB2D6"/>
  <text x="225.5" y="287.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ TurkeyAdapter(Turkey)</text>
  <text x="225.5" y="302.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ quack()</text>
  <path d="M300,207 L300,148" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <rect x="540" y="70" width="120" height="77" rx="4" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="600" y="87" class="c sub" style="font-size:9.5px">«interface»</text>
  <text x="600" y="102" class="c b mono" style="font-size:12px;fill:#3F3F3F">Turkey</text>
  <text x="600" y="115" class="c sub" style="font-size:10px">（Adaptee 的接口）</text>
  <line x1="540" y1="124" x2="660" y2="124" stroke="#B8B0DE"/>
  <text x="549" y="139.5" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ gobble()</text>
  <rect x="551" y="236.5" width="98" height="52" rx="4" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="600" y="256.5" class="c b mono" style="font-size:12px;fill:#3F3F3F">WildTurkey</text>
  <line x1="551" y1="265.5" x2="649" y2="265.5" stroke="#7FB2D6"/>
  <text x="560" y="281" class="mono" style="font-size:10.5px;fill:#3F3F3F">+ gobble()</text>
  <path d="M600,236.5 L600,148" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M383.5,243.05 L467.25,243.05 L467.25,108.5 L540,108.5" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="475.25" y="237.05" class="sub mono" style="font-size:10.5px;fill:#3F3F3F">turkey</text>
  <rect x="32" y="93.5" width="96" height="29" rx="4" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="80" y="113.5" class="c b mono" style="font-size:12px;fill:#3F3F3F">Client</text>
  <path d="M128,108 L252,108.5" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="190" y="102.5" class="c sub mono" style="font-size:10.5px;fill:#3F3F3F">quack()</text>
  <line x1="30" y1="344" x2="64" y2="344" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="72" y="348" class="sub">实现</text>
  <line x1="116" y1="344" x2="150" y2="344" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="158" y="348" class="sub">关联（字段）</text>
  <line x1="246" y1="344" x2="280" y2="344" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="288" y="348" class="sub">依赖（创建、调用）</text>
  <rect x="409" y="337" width="18" height="13" rx="3" fill="#E6E3FA" stroke="#B8B0DE"/>
  <text x="433" y="348" class="sub">接口</text>
  <rect x="473" y="337" width="18" height="13" rx="3" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="497" y="348" class="sub">类</text>
  <rect x="526" y="337" width="18" height="13" rx="3" fill="#C6ECE9" stroke="#7DBCB7"/>
  <text x="550" y="348" class="sub">客户端</text>
  <text x="605" y="348" class="sub">+ public，~ 包访问权限</text>
  <text x="30" y="370" class="sub" style="fill:#3F3F3F">Client 只认 Duck 接口；TurkeyAdapter 实现 Duck，quack() 内部调用 turkey.gobble()，所以 duck.quack() 输出 gobble!。</text>
</svg>
