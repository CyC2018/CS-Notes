  <text x="20" y="318" class="sub">以太网、PPP 链路和 Wi-Fi 的帧格式、地址都不同，但每台主机都有 IP 地址，路由器在各段链路之间转发 IP 数据报。</text>
  <text x="20" y="338" class="sub">在网络层看来，H1 到 H3 只是在同一个 IP 网络中发送数据报，下面用的是什么链路被屏蔽了。</text>
