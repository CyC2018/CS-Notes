  <rect x="40" y="56" width="200" height="130" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="140" y="76" class="c sub b" style="fill:#444">容器</text>
  <rect x="60" y="86" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="140" y="103" class="c sub" style="fill:#444">订单服务</text>
  <rect x="60" y="116" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="140" y="133" class="c sub" style="fill:#444">JDK 21</text>
  <rect x="60" y="146" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="140" y="163" class="c sub" style="fill:#444">Debian</text>
  <rect x="270" y="56" width="200" height="130" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="370" y="76" class="c sub b" style="fill:#444">容器</text>
  <rect x="290" y="86" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="370" y="103" class="c sub" style="fill:#444">推荐服务</text>
  <rect x="290" y="116" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="370" y="133" class="c sub" style="fill:#444">Python 3.12</text>
  <rect x="290" y="146" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="370" y="163" class="c sub" style="fill:#444">Ubuntu</text>
  <rect x="500" y="56" width="200" height="130" rx="6" fill="#C6E4FB" stroke="#7FB2D6"/>
  <text x="600" y="76" class="c sub b" style="fill:#444">容器</text>
  <rect x="520" y="86" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="600" y="103" class="c sub" style="fill:#444">网关</text>
  <rect x="520" y="116" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
