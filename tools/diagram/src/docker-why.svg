  <rect x="520" y="146" width="160" height="26" rx="3" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <text x="600" y="163" class="c sub" style="fill:#444">Alpine</text>
  <rect x="40" y="196" width="660" height="30" rx="6" fill="#EAE9E7" stroke="#BFBEBA"/>
  <text x="370" y="215.5" class="c sub b">宿主机的 Linux 内核</text>
  <text x="30" y="244" class="sub">各容器的依赖互不影响，同一个镜像在开发机、测试环境和生产环境中运行结果一致。</text>
</svg>
